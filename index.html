<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, interactive-widget=resizes-content">
<title>피크마케팅</title>
<script>
// Set the tab title as early as possible from URL params + a localStorage
// cache of chat room names, so standalone chat window popups show the
// right room name immediately instead of sitting on the generic
// "피크마케팅" default while Firebase auth and the API round-trip
// settle. The main-script path still overwrites this once it has live
// data; this is just the first-paint fallback.
(function () {
  try {
    var params = new URLSearchParams(location.search);
    var page = params.get('page');
    var roomId = params.get('roomId');
    if (page === 'chat' && roomId) {
      var cache = {};
      try { cache = JSON.parse(localStorage.getItem('peakChatRoomNames') || '{}') || {}; } catch (_) {}
      var name = cache && cache[roomId];
      if (name) document.title = name + ' | 피크마케팅';
      else document.title = '채팅 로딩… | 피크마케팅';
    }
  } catch (_) {}
})();
</script>

<link rel="icon" type="image/png" sizes="64x64" href="/favicon.png">

<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="피크마케팅">

<style>
:root {
  --bg: #07111F; --bg2: #0D1B2A; --bg3: #13263A; --bg4: #1A3148;
  --text: #F6F8FC; --text2: #A9B7C9; --text3: #66798F;
  --red: #FF6B5F; --red2: #E85A50; --red-bg: rgba(255,107,95,0.13);
  --green: #4ADE80; --blue: #5AA7FF; --yellow: #F8D66D;
  --border: #17283A; --card: #0F1D2E;
  --surface: #0A1726; --surface2: #132235; --surface3: #1A2D44;
  --line: rgba(196,217,255,0.10); --line-strong: rgba(196,217,255,0.18);
  --shadow-card: 0 10px 28px rgba(0,0,0,0.24);
  --shadow-panel: 0 18px 44px rgba(0,0,0,0.34);
  --radius: 8px;
  --sidebar-w: 248px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; position: fixed; width: 100%; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); letter-spacing: 0; }
button, input, textarea, select { letter-spacing: 0; }
button { -webkit-tap-highlight-color: transparent; }
::selection { background: rgba(255,107,95,0.28); color: var(--text); }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(196,217,255,0.14); border-radius: 999px; border: 3px solid transparent; background-clip: padding-box; }
::-webkit-scrollbar-thumb:hover { background: rgba(196,217,255,0.22); border: 3px solid transparent; background-clip: padding-box; }

/* ── Layout ── */
.layout { display: flex; height: 100dvh; width: 100%; background: var(--bg); }

/* ── Sidebar (PC) ── */
.sidebar {
  width: var(--sidebar-w); background: var(--surface); border-right: 1px solid var(--line);
  display: flex; flex-direction: column; flex-shrink: 0; overflow-y: auto; padding: 14px 10px 12px;
}
.sidebar-logo {
  padding: 10px 10px 18px; font-size: 18px; font-weight: 800; color: var(--red); letter-spacing: 0;
  display: flex; align-items: center; gap: 8px;
}
.sidebar-menu { flex: 1; padding: 2px 0; display: flex; flex-direction: column; gap: 3px; }
.sidebar-item {
  display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 10px 12px; border-radius: var(--radius);
  font-size: 14px; font-weight: 650; color: var(--text2); cursor: pointer; transition: background 0.15s, color 0.15s, transform 0.15s;
  margin-bottom: 0; position: relative;
}
.sidebar-item:hover { background: var(--surface2); color: var(--text); }
.sidebar-item.active { background: var(--red-bg); color: var(--text); font-weight: 800; }
.sidebar-item.active::before {
  content: ''; position: absolute; left: 0; top: 11px; bottom: 11px; width: 3px; border-radius: 999px; background: var(--red);
}
.sidebar-item .icon { font-size: 17px; width: 24px; text-align: center; opacity: 0.95; }
.sidebar-user {
  padding: 10px; border-top: 1px solid var(--line);
  display: flex; align-items: center; gap: 10px; cursor: pointer; border-radius: var(--radius); margin-top: 10px;
}
.sidebar-user:hover { background: var(--surface2); }
.sidebar-avatar { width: 34px; height: 34px; border-radius: 50%; overflow: hidden; background: var(--bg3); display: flex; align-items: center; justify-content: center; font-size: 14px; border: 1px solid var(--line); }
.sidebar-avatar img { width: 100%; height: 100%; object-fit: cover; }
.sidebar-uname { font-size: 13px; font-weight: 700; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sidebar-badge { background: var(--red); color: #fff; font-size: 10px; font-weight: 700; border-radius: 10px; padding: 1px 6px; min-width: 16px; text-align: center; }

/* ── Main Content ── */
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: var(--bg); min-width: 0; }
.main-header {
  min-height: 70px; padding: 14px 28px; border-bottom: 1px solid var(--line);
  display: flex; align-items: center; justify-content: space-between; gap: 18px;
  background: rgba(7,17,31,0.9); backdrop-filter: blur(12px); flex-shrink: 0;
}
.main-title { font-size: 21px; font-weight: 800; line-height: 1.2; min-width: 0; }
#headerRight { min-width: 0; }
.header-actions { display: flex; gap: 8px; align-items: center; justify-content: flex-end; flex-wrap: wrap; }
.main-body { flex: 1; overflow-y: auto; padding: 24px 32px 96px; scroll-padding-bottom: 96px; }
.main-body.chat-room-page { display: flex; flex-direction: column; min-height: 0; overflow: hidden; padding: 0; }

/* ── Sub tabs ── */
.sub-tabs { display: flex; gap: 6px; padding: 0 0 16px; min-width: 0; }
.sub-tab {
  padding: 8px 14px; border-radius: var(--radius); font-size: 13px; font-weight: 750;
  background: var(--surface2); color: var(--text2); cursor: pointer; border: 1px solid transparent; font-family: inherit; transition: background 0.15s, color 0.15s, border-color 0.15s;
  white-space: nowrap;
}
.sub-tab:hover { color: var(--text); background: var(--surface3); }
.sub-tab.active { background: var(--red); color: #fff; border-color: rgba(255,255,255,0.08); }

/* ── Cards ── */
.card {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-bottom: 12px;
  box-shadow: 0 1px 0 rgba(255,255,255,0.03) inset; transition: background 0.15s, border-color 0.15s, transform 0.15s;
}
.card[onclick]:hover { background: var(--surface2); border-color: var(--line-strong); transform: translateY(-1px); }
.card-title { font-size: 15px; font-weight: 800; margin-bottom: 8px; line-height: 1.35; overflow-wrap: anywhere; }
.card-meta { font-size: 12px; color: var(--text2); line-height: 1.55; }

/* ── Stats grid ── */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 20px; }
.stat-card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 14px; text-align: left; }
.stat-num { font-size: 24px; font-weight: 850; color: var(--red); line-height: 1.1; }
.stat-label { font-size: 11px; color: var(--text2); margin-top: 6px; font-weight: 650; }

/* ── Calendar ── */
.calendar-toolbar { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:18px; }
.calendar-tab-group { padding:0; flex:1; overflow-x:auto; scrollbar-width:none; }
.calendar-tab-group::-webkit-scrollbar { display:none; }
.calendar-scope-toggle { display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end; }
.calendar-split { display:flex; align-items:stretch; gap:12px; overflow:hidden; }
.calendar-main-panel { flex:1; min-width:0; overflow:visible; }
.calendar-side-panel {
  flex-shrink:0; padding: 14px; max-height: calc(100vh - 196px); overflow-y:auto;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  box-shadow: 0 1px 0 rgba(255,255,255,0.03) inset;
}
.month-wrap { display: flex; flex-direction: column; gap: 14px; min-width:0; }
.month-overview { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.month-overview-card {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 15px;
  box-shadow: 0 1px 0 rgba(255,255,255,0.03) inset;
}
.month-overview-label { font-size: 11px; color: var(--text2); font-weight: 700; }
.month-overview-value { font-size: 24px; font-weight: 850; margin-top: 8px; line-height: 1; }
.month-overview-value.red { color: var(--red); }
.month-overview-value.yellow { color: var(--yellow); }
.month-overview-value.blue { color: var(--blue); }
.month-overview-value.green { color: var(--green); }
.cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 7px; }
.month-grid { gap: 7px; }
.cal-header { text-align: center; font-size: 11px; font-weight: 800; color: var(--text3); padding: 8px 0 6px; }
.cal-header:first-child { color: var(--red); }
.cal-header:last-child { color: var(--blue); }
.cal-cell {
  min-height: 92px; display: flex; flex-direction: column; align-items: stretch; justify-content: flex-start;
  padding: 8px; cursor: pointer; border-radius: var(--radius); transition: background 0.12s, border-color 0.12s, transform 0.12s; font-size: 12px;
  overflow: hidden; min-width: 0; border: 1px solid var(--line); background: rgba(196,217,255,0.024);
}
.cal-cell:hover { background: var(--surface2); border-color: var(--line-strong); transform: translateY(-1px); }
.cal-cell.has-items { border-color: rgba(196,217,255,0.14); background: rgba(196,217,255,0.04); }
.cal-cell.other { opacity: 0.32; background: transparent; border-color: rgba(196,217,255,0.04); }
.cal-cell.today .cal-num { background: var(--red); color: #fff; border-radius: 50%; width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; }
.cal-cell.selected { background: rgba(255,107,95,0.09); border-color: rgba(255,107,95,0.5); box-shadow: inset 0 0 0 1px rgba(255,107,95,0.18); }
.cal-num { font-size: 12px; font-weight: 800; width: 26px; height: 26px; text-align: center; line-height: 26px; }
.cal-cell.sun .cal-num { color: var(--red); }
.cal-cell.sat .cal-num { color: var(--blue); }
.cal-day-head { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-bottom: 8px; }
.cal-day-total {
  display: inline-flex; align-items: center; justify-content: center; min-width: 18px; padding: 1px 6px;
  border-radius: 999px; background: var(--surface2); color: var(--text2); font-size: 10px; font-weight: 800;
}
.cal-day-metrics { display: flex; flex-direction: column; gap: 5px; margin-top: auto; }
.cal-chip {
  display: inline-flex; align-items: center; width: fit-content; max-width: 100%; padding: 4px 7px;
  border-radius: 999px; background: var(--surface2); color: var(--text2); font-size: 10px; line-height: 1; font-weight: 800;
}
.cal-chip.schedule { color: var(--text2); }
.cal-chip.meeting { color: #A9D1FF; background: rgba(90,167,255,0.16); }
.cal-chip.todo { color: #B0F2C6; background: rgba(74,222,128,0.14); }
.cal-chip.todo-open { color: #111; background: var(--yellow); }
.cal-chip.todo-carried { color: #FFC0BA; background: rgba(255,107,95,0.16); }
.cal-chip.team { color: #B2D6FF; background: rgba(90,167,255,0.13); }
.cal-day-empty { flex: 1; }
.month-day-panel {
  margin-top: 14px; padding: 14px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface);
}
.day-summary-card {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; margin-bottom: 12px;
}
.day-summary-meta { font-size: 12px; color: var(--text2); margin-top: 4px; }
.day-summary-stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-top: 10px; }
.day-summary-stat { background: var(--surface2); border-radius: var(--radius); padding: 9px 6px; text-align: center; border: 1px solid rgba(255,255,255,0.04); }
.day-summary-stat strong { display: block; font-size: 17px; color: var(--text); font-weight: 850; line-height: 1; }
.day-summary-stat span { display: block; margin-top: 4px; font-size: 10px; color: var(--text3); font-weight: 700; }
.day-section { margin-top: 14px; padding-top: 13px; border-top: 1px solid var(--line); }
.day-section:first-of-type { margin-top: 0; padding-top: 0; border-top: none; }
.day-section-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
.day-section-title { font-size: 13px; font-weight: 850; color: var(--text); }
.day-section-badge { font-size: 10px; color: var(--text3); font-weight: 750; }
.day-empty-note { font-size: 11px; color: var(--text3); padding: 8px 0; }
.day-section-actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.day-action-btn {
  padding: 7px 10px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--surface2); color: var(--text2);
  font-size: 11px; cursor: pointer; font-family: inherit; font-weight: 750;
}
.day-action-btn.primary { background: var(--red); border-color: var(--red); color: #fff; }
.day-linked-rooms { display: flex; flex-direction: column; gap: 6px; }
.day-linked-room {
  display: flex; align-items: center; gap: 8px; padding: 9px 10px; border-radius: var(--radius); background: var(--surface2); cursor: pointer; border: 1px solid var(--line);
}
.day-linked-room:hover { opacity: 0.85; }
.cal-dots { display: flex; gap: 2px; margin-top: 2px; }
.cal-dot { width: 4px; height: 4px; border-radius: 50%; }

/* ── Event items ── */
.ev-item { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: var(--radius); cursor: pointer; transition: background 0.1s, border-color 0.1s; }
.ev-item:hover { background: var(--surface2); }
.ev-color { width: 3px; border-radius: 2px; align-self: stretch; min-height: 20px; }
.ev-title { font-size: 14px; font-weight: 700; flex: 1; line-height: 1.4; }
.ev-time { font-size: 11px; color: var(--text2); }
.ev-done { text-decoration: line-through; opacity: 0.4; }
.todo-carried-badge {
  display: inline-flex; align-items: center; width: fit-content; max-width: 100%;
  padding: 2px 6px; border-radius: 999px; background: rgba(255,107,95,0.15);
  color: #FFC0BA; font-size: 9px; font-weight: 700; line-height: 1; white-space: nowrap;
}
.todo-carried-meta { font-size: 10px; color: var(--text3); margin-top: 3px; }

/* ── Todo ── */
.todo-check {
  width: 18px; height: 18px; border-radius: 5px; border: 2px solid var(--text3);
  cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; transition: all 0.15s;
}
.todo-check.done { background: var(--green); border-color: var(--green); }
.todo-check.done::after { content: '✓'; color: #fff; font-size: 11px; font-weight: 700; }
.todo-cat-hdr { display: flex; align-items: center; justify-content: space-between; padding: 8px 0 4px; border-bottom: 1px solid var(--border); margin-bottom: 4px; }
.todo-cat-name { font-size: 12px; font-weight: 700; color: var(--text2); }

/* ── Chat ── */
.chat-wrap { display: flex; flex-direction: column; height: 100%; overflow: hidden; }
.chat-list-shell { max-width: 980px; }
.room-item {
  display: flex; align-items: center; gap: 13px; padding: 13px 14px; border-radius: var(--radius); cursor: pointer;
  transition: background 0.12s, border-color 0.12s, transform 0.12s; border: 1px solid transparent; margin-bottom: 4px;
}
.room-item:hover { background: var(--surface2); border-color: var(--line); transform: translateY(-1px); }
.room-avatar { width: 42px; height: 42px; border-radius: 50%; background: var(--bg4); display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; border: 1px solid var(--line); }
.chat-msgs { flex: 1; min-height: 0; overflow-y: auto; padding: 12px 16px 20px; display: flex; flex-direction: column; gap: 8px; overscroll-behavior: contain; scroll-behavior: auto; }
.msg { display: flex; gap: 8px; align-items: flex-end; }
.msg.mine { flex-direction: row-reverse; }
.msg-avatar { width: 28px; height: 28px; border-radius: 50%; overflow: hidden; flex-shrink: 0; background: var(--bg4); display: flex; align-items: center; justify-content: center; font-size: 11px; }
.msg-avatar img { width: 100%; height: 100%; object-fit: cover; }
.msg-body { max-width: min(78%, 460px); min-width: 0; display: flex; flex-direction: column; }
.msg-name { font-size: 11px; color: var(--text3); margin-bottom: 2px; }
.msg.mine .msg-name { text-align: right; }
.msg-bubble { padding: 9px 13px; border-radius: 16px; font-size: 13px; line-height: 1.5; word-break: break-word; overflow-wrap: anywhere; white-space: pre-wrap; display: flex; flex-direction: column; gap: 8px; }
.msg:not(.mine) .msg-bubble { background: var(--bg3); color: var(--text); border-bottom-left-radius: 4px; }
.msg.mine .msg-bubble { background: var(--red); color: #fff; border-bottom-right-radius: 4px; }
.msg.mentioned:not(.mine) .msg-bubble { box-shadow: 0 0 0 2px rgba(255,107,95,0.7) inset; background: rgba(255,107,95,0.1); }
/* In-room message search — a faint highlight on every match, a
   stronger outline on the currently-focused match so Up/Down nav
   is obvious at a glance. Applied to the whole bubble so emoji,
   attachments and text-shares all show they matched. */
.msg-bubble.chat-search-hit { box-shadow: 0 0 0 2px rgba(255,214,10,0.55) inset; }
.msg-bubble.chat-search-hit.chat-search-hit-active { box-shadow: 0 0 0 3px var(--yellow) inset; background: rgba(255,214,10,0.15); }
.chat-search-bar { display:flex; gap:6px; align-items:center; padding:6px 10px; background: var(--bg2); border-bottom: 1px solid var(--border); }
.chat-search-bar input { flex:1; background: var(--bg3); border: 1px solid var(--border); border-radius: var(--radius); padding: 7px 10px; font-size: 13px; color: var(--text); outline: none; }
.chat-search-bar input:focus { border-color: var(--yellow); }
.chat-search-bar button { background: var(--bg3); border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px; color: var(--text2); font-size: 12px; cursor: pointer; }
.chat-search-bar button:disabled { opacity: 0.4; cursor: not-allowed; }
.chat-search-bar .chat-search-count { font-size: 11px; color: var(--text3); min-width: 40px; text-align: center; }
/* Image viewer overlay — tapping a chat image used to `window.open`
   the raw URL, which on mobile PWAs replaced the chat tab itself, so
   users lost their place when closing the image. The overlay below
   is modal, sits above every other z-index, and closes via ✕, Esc,
   or a click on the backdrop. */
.img-viewer-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.88); z-index: 100000; display: flex; align-items: center; justify-content: center; padding: 24px; overflow: auto; }
.img-viewer-overlay img { max-width: 100%; max-height: 100%; width: auto; height: auto; object-fit: contain; border-radius: 8px; background: #111; box-shadow: 0 8px 32px rgba(0,0,0,0.6); }
.img-viewer-close { position: fixed; top: 14px; right: 14px; width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3); color: #fff; font-size: 18px; cursor: pointer; backdrop-filter: blur(6px); z-index: 1; display: flex; align-items: center; justify-content: center; }
.img-viewer-close:hover { background: rgba(255,255,255,0.25); }
.msg-time { font-size: 10px; color: var(--text3); margin-top: 2px; }
.msg.mine .msg-time { text-align: right; }
.chat-compose { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; position: relative; }
.chat-typing-indicator { position: absolute; left: 16px; top: -27px; height: 24px; display: none; align-items: center; gap: 6px; color: var(--text2); font-size: 11px; font-weight: 700; pointer-events: none; }
.chat-typing-dots { display: inline-flex; gap: 3px; }
.chat-typing-dots i { width: 4px; height: 4px; border-radius: 50%; background: var(--red); animation: chatTypingDot 1s infinite ease-in-out; }
.chat-typing-dots i:nth-child(2) { animation-delay: .14s; }
.chat-typing-dots i:nth-child(3) { animation-delay: .28s; }
@keyframes chatTypingDot { 0%, 60%, 100% { opacity: .35; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-2px); } }
.chat-mention-menu { position: absolute; left: 0; right: 0; bottom: calc(100% + 8px); z-index: 8; display: none; max-height: 220px; overflow-y: auto; padding: 6px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg2); box-shadow: var(--shadow-panel); }
.chat-mention-option { width: 100%; display: flex; align-items: center; gap: 9px; padding: 8px 9px; border: none; border-radius: 6px; background: transparent; color: var(--text); text-align: left; cursor: pointer; font-family: inherit; }
.chat-mention-option.active, .chat-mention-option:hover { background: var(--bg4); }
.chat-mention-avatar { width: 26px; height: 26px; border-radius: 50%; background: var(--bg4); display: flex; align-items: center; justify-content: center; overflow: hidden; flex-shrink: 0; font-size: 10px; }
.chat-mention-avatar img { width: 100%; height: 100%; object-fit: cover; }
.chat-attachment-preview { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 16px; border: 1px solid var(--border); background: var(--bg3); }

// ── Debug instrumentation ─────────────────────────────────────────────
// Enable with ?debug=1 in the URL, or run `localStorage.setItem('calendarDebug','1')`
// in DevTools and reload. When off, all dlog() calls are cheap no-ops.
// When on, every render / api call / DOM mutation gets a timestamped
// entry in the console and an in-memory ring buffer. Call
// `window.__calDump()` to dump the buffer, `window.__calClear()` to reset.
const CAL_DEBUG = (() => {
  try {
    if (/(^|[?&])debug=1(\b|&)/.test(location.search)) return true;
    if (localStorage.getItem('calendarDebug') === '1') return true;
  } catch (_) {}
  return false;
})();
const calLog = [];
const CAL_LOG_MAX = 500;
// When debug is enabled the page also streams each entry to the server
// (batched every ~800ms) so the maintainer can `tail -f` a single file
// instead of asking the user to copy/paste their console.
const CAL_SESSION = Math.random().toString(36).slice(2, 10);
const CAL_PENDING_UPLOAD = [];
let calUploadTimer = null;
function scheduleCalLogUpload() {
  if (!CAL_DEBUG) return;
  if (calUploadTimer) return;
  calUploadTimer = setTimeout(flushCalLogUpload, 800);
}
function flushCalLogUpload() {
  calUploadTimer = null;
  if (!CAL_PENDING_UPLOAD.length) return;
  const entries = CAL_PENDING_UPLOAD.splice(0);
  const payload = JSON.stringify({
    session: CAL_SESSION,
    ua: navigator.userAgent,
    url: location.pathname + location.search,
    entries,
  });
  const send = token => fetch('/api/_debug/client-log', {
    method: 'POST',
    headers: Object.assign({ 'Content-Type': 'application/json' }, token ? { 'Authorization': 'Bearer ' + token } : {}),
    body: payload,
    keepalive: true,
  }).catch(() => {});
  if (typeof currentUser !== 'undefined' && currentUser && currentUser.getIdToken) {
    currentUser.getIdToken().then(send, () => send(null));
  } else {
    send(null);
  }
}
function dlog(tag, ...args) {
  if (!CAL_DEBUG) return;
  const ts = (performance.now() / 1000).toFixed(3);
  const entry = { t: Number(ts), tag, args };
  calLog.push(entry);
  if (calLog.length > CAL_LOG_MAX) calLog.shift();
  CAL_PENDING_UPLOAD.push(entry);
  scheduleCalLogUpload();
  // eslint-disable-next-line no-console
  console.log('%c[cal+' + ts + 's] ' + tag, 'color:#6aa', ...args);
}
function dwarn(tag, ...args) {
  if (!CAL_DEBUG) return;
  const ts = (performance.now() / 1000).toFixed(3);
  const entry = { t: Number(ts), tag: '!' + tag, args };
  calLog.push(entry);
  if (calLog.length > CAL_LOG_MAX) calLog.shift();
  CAL_PENDING_UPLOAD.push(entry);
  scheduleCalLogUpload();
  // eslint-disable-next-line no-console
  console.warn('[cal+' + ts + 's] ' + tag, ...args);
}
if (CAL_DEBUG) {
  window.__calDump = () => calLog.slice();
  window.__calClear = () => { calLog.length = 0; };
  window.__calSummary = () => {
    const counts = {};
    calLog.forEach(e => { counts[e.tag] = (counts[e.tag] || 0) + 1; });
    return counts;
  };
  window.__calSession = CAL_SESSION;
  window.addEventListener('beforeunload', () => {
    dwarn('beforeunload', { reason: 'navigation' });
    // Force-flush pending entries synchronously before the page goes away.
    if (CAL_PENDING_UPLOAD.length) flushCalLogUpload();
  });
  // Detect anything that would cause a full page reload.
  const origReload = location.reload.bind(location);
  location.reload = function(...a) { dwarn('location.reload()', { stack: new Error().stack }); flushCalLogUpload(); return origReload(...a); };
  // Capture uncaught errors too so silent bugs still land in the log.
  window.addEventListener('error', ev => dwarn('error', { msg: ev.message, src: ev.filename + ':' + ev.lineno }));
  window.addEventListener('unhandledrejection', ev => dwarn('unhandledrejection', { reason: String(ev.reason) }));
  dlog('session start', { ua: navigator.userAgent, url: location.href });
  console.log('%c[cal debug] session=' + CAL_SESSION + ' — logs stream to server /api/_debug/client-log', 'background:#024;color:#fff;padding:2px 6px;border-radius:3px');
}

function getMeetingPanelCollapsedMap() {
  try {
    const raw = localStorage.getItem(MEETING_PANEL_COLLAPSE_KEY);

    return {};

function isMeetingPanelCollapsed(roomId = currentRoomId) {
  if (!roomId) return false;
  const map = getMeetingPanelCollapsedMap();
  return map[String(roomId)] === true;
}

function setMeetingPanelCollapsed(roomId = currentRoomId, collapsed = false) {
  if (!roomId) return;
  const map = getMeetingPanelCollapsedMap();
  map[String(roomId)] = !!collapsed;
  localStorage.setItem(MEETING_PANEL_COLLAPSE_KEY, JSON.stringify(map));

function isChatNearBottom(container = document.getElementById('chatMsgs')) {
  if (!container) return true;

function scrollChatToBottom(behavior = 'auto') {
  const container = document.getElementById('chatMsgs');
  if (!container) return;
  try {
    container.scrollTo({ top: container.scrollHeight, behavior });
  } catch (e) {
    container.scrollTop = container.scrollHeight;

}

function queueChatBottomSnap(behavior = 'auto') {
  clearTimeout(chatBottomSnapTimer);
  const snap = (nextBehavior = 'auto') => {
    if (chatShouldStickToBottom) scrollChatToBottom(nextBehavior);
  };
  requestAnimationFrame(() => snap(behavior));
  chatBottomSnapTimer = setTimeout(() => snap('auto'), 80);
  setTimeout(() => snap('auto'), 220);
  setTimeout(() => snap('auto'), 420);
}

function getChatMessageDateLabel(ts) {
  const key = String(ts || '');
  if (!key) return '';
  if (chatMessageDateLabelCache.has(key)) return chatMessageDateLabelCache.get(key);
  const date = new Date(key);
  const label = Number.isNaN(date.getTime()) ? '' : CHAT_DATE_LABEL_FORMATTER.format(date);
  chatMessageDateLabelCache.set(key, label);
  return label;
}

function getChatMessageTimeLabel(ts) {
  const key = String(ts || '');
  if (!key) return '';
  if (chatMessageTimeLabelCache.has(key)) return chatMessageTimeLabelCache.get(key);
  const date = new Date(key);
  const label = Number.isNaN(date.getTime()) ? '' : CHAT_TIME_LABEL_FORMATTER.format(date);
  chatMessageTimeLabelCache.set(key, label);
  return label;
}

function syncChatStackAlignment(container = document.getElementById('chatMsgs')) {
  if (!container) return;
  container.style.justifyContent = container.scrollHeight <= container.clientHeight + 1 ? 'flex-end' : 'flex-start';
}

function bindChatMediaLoadHandlers(container = document.getElementById('chatMsgs')) {
  if (!container) return;
  container.querySelectorAll('img.chat-media:not([data-chat-media-bound="1"])').forEach(img => {
    img.dataset.chatMediaBound = '1';
    if (img.complete) return;
    const snap = () => {
      syncChatStackAlignment(container);
      if (chatShouldStickToBottom) queueChatBottomSnap('auto');
    };
    img.addEventListener('load', snap, { once: true });
    img.addEventListener('error', snap, { once: true });
  });
}

function escapeChatMentionRegex(value) {
  return String(value || '').replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

function chatTextMentionsCurrentUser(text) {
  const name = String(userDoc?.name || currentUser?.displayName || '').trim();
  if (!name) return false;
  const escapedName = escapeChatMentionRegex(name);
  return new RegExp(`@(?:\\[${escapedName}\\]|${escapedName})(?=$|\\s|[.,!?;:])`, 'u').test(String(text || ''));
}

function renderChatPlainText(text) {
  const mentionSpans = [];
  let rendered = esc(text).replace(/@\[([^\]]+)\]|@([^\s&lt;.,!?;:]+)/gu, (match, bracketName, plainName) => {
    const name = bracketName || plainName || '';
    const marker = `__CHAT_MENTION_${mentionSpans.length}__`;
    mentionSpans.push(`<span style="color:var(--blue);font-weight:800">@${esc(name)}</span>`);
    return marker;
  });
  rendered = rendered.replace(/(https?:\/\/\S+)/g,'<a href="$1" target="_blank" style="color:var(--blue);text-decoration:underline;word-break:break-all">$1</a>');
  mentionSpans.forEach((span, index) => {
    rendered = rendered.replace(`__CHAT_MENTION_${index}__`, span);
  });
  return rendered;
}

function buildChatMessagesHtml(msgs, previousDateStr = '') {
  let lastDate = previousDateStr;
  let html = '';
  msgs.forEach(msg => {
    const dateStr = getChatMessageDateLabel(msg.createdAt);
    const divider = dateStr && dateStr !== lastDate
      ? `<div class="chat-date-divider" data-chat-date-divider="1" data-date="${esc(dateStr)}" style="text-align:center;font-size:11px;color:var(--text3);margin:8px 0">${dateStr}</div>`
      : '';
    if (dateStr) lastDate = dateStr;
    html += buildChatMessageHtml(msg, divider);
  });
  return { html, lastDateStr: lastDate };
}

function applyChatUnreadCounts(unreadCounts = {}) {
  const container = document.getElementById('chatMsgs');
  if (!container) return false;
  let updated = false;
  container.querySelectorAll('[data-chat-unread-badge="1"]').forEach(el => {
    const count = unreadCounts[el.dataset.msgId] || 0;
    const nextText = count > 0 ? ` ${count}` : '';
    const nextDisplay = count > 0 ? 'inline' : 'none';
    if (el.textContent !== nextText || el.style.display !== nextDisplay) {
      el.textContent = nextText;
      el.style.display = nextDisplay;
      updated = true;
    }
  });
  return updated;
}

function scheduleDeferredChatHistoryRender(container, msgs, visibleStartIndex, forceStickToBottom = false) {
  if (!container || visibleStartIndex <= 0) return;
  const renderSeq = chatDeferredHistoryRenderSeq;
  let endIndex = visibleStartIndex;
  const step = () => {
    if (renderSeq !== chatDeferredHistoryRenderSeq || !container.isConnected) return;
    const startIndex = Math.max(0, endIndex - MOBILE_CHAT_PREPEND_CHUNK_SIZE);
    const chunk = msgs.slice(startIndex, endIndex);
    const previousDateStr = startIndex > 0 ? getChatMessageDateLabel(msgs[startIndex - 1].createdAt) : '';
    const prevScrollTop = container.scrollTop;
    const prevScrollHeight = container.scrollHeight;
    container.insertAdjacentHTML('afterbegin', buildChatMessagesHtml(chunk, previousDateStr).html);
    bindChatMediaLoadHandlers(container);
    syncChatStackAlignment(container);
    if (forceStickToBottom || chatShouldStickToBottom) {
      scrollChatToBottom('auto');
      queueChatBottomSnap('auto');
    } else {
      container.scrollTop = Math.max(0, prevScrollTop + (container.scrollHeight - prevScrollHeight));
    }
    endIndex = startIndex;
    if (endIndex > 0) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

function bindChatScrollTracking() {
  const container = document.getElementById('chatMsgs');
  if (!container || container.dataset.scrollBound === '1') return;
  container.dataset.scrollBound = '1';
  container.addEventListener('scroll', () => {
    chatShouldStickToBottom = isChatNearBottom(container);
  }, { passive: true });
}

function handleChatViewportAdjust() {
  if (isMobileDevice()) return;
  if (currentPage !== 'chat' || !currentRoomId) return;
  const input = document.getElementById('chatInput');
  if (!input || document.activeElement !== input) return;
  chatShouldStickToBottom = true;
  queueChatBottomSnap('auto');
}

function ensureChatViewportHandlers() {
  if (isMobileDevice()) return;
  if (chatViewportHandlersBound) return;
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', handleChatViewportAdjust);
    window.visualViewport.addEventListener('scroll', handleChatViewportAdjust);
  }
  window.addEventListener('orientationchange', handleChatViewportAdjust);
  chatViewportHandlersBound = true;
}

function handleChatInputKeydown(event) {
  if (handleChatMentionKeydown(event)) return;
  if (event.key !== 'Enter' || event.shiftKey) return;
  if (event.isComposing || event.keyCode === 229) return;
  if (isMobileDevice()) return;
  event.preventDefault();
  requestChatSend({ blurInput: false, delayMs: 0 });
}

function handleChatInputInput(textarea) {
  textarea.style.height = 'auto';
  textarea.style.height = Math.min(textarea.scrollHeight, 120) + 'px';
  updateChatMentionMenu(textarea);
  updateChatTypingSignal(textarea);
  if (document.activeElement === textarea && !isMobileDevice()) {
    chatShouldStickToBottom = true;
    queueChatBottomSnap('auto');
  }
}

function handleChatInputFocus() {
  chatShouldStickToBottom = true;
  if (isMobileDevice()) return;
  queueChatBottomSnap('auto');
}

function handleChatInputBlur() {
  clearTimeout(chatTypingClearTimer);
  chatTypingClearTimer = setTimeout(() => sendChatTypingSignal(false), 350);
  setTimeout(() => hideChatMentionMenu(), 180);
}

function renderChatTypingIndicator() {
  const indicator = document.getElementById('chatTypingIndicator');
  if (!indicator) return;
  const names = currentChatTypingUsers.map(user => String(user.name || '사용자')).filter(Boolean);
  if (!names.length) {
    indicator.style.display = 'none';
    indicator.innerHTML = '';
    return;
  }
  const label = names.length === 1
    ? `${esc(names[0])}님이 입력 중`
    : `${esc(names.slice(0, 2).join(', '))}${names.length > 2 ? ` 외 ${names.length - 2}명` : ''} 입력 중`;
  indicator.innerHTML = `<span>${label}</span><span class="chat-typing-dots"><i></i><i></i><i></i></span>`;
  indicator.style.display = 'flex';
}

async function fetchChatTypingState() {
  const roomId = currentRoomId;
  if (!roomId) return;
  try {
    const data = await api('GET', '/chat-rooms/' + roomId + '/typing');
    if (String(currentRoomId) !== String(roomId)) return;
    currentChatTypingUsers = Array.isArray(data?.users) ? data.users : [];
    renderChatTypingIndicator();
  } catch (e) {}
}

function startChatTypingPolling() {
  if (chatTypingPollId) clearInterval(chatTypingPollId);
  currentChatTypingUsers = [];
  renderChatTypingIndicator();
  fetchChatTypingState();
  chatTypingPollId = setInterval(fetchChatTypingState, 1500);
}

function stopChatTyping(options = {}) {
  const roomId = currentRoomId;
  if (chatTypingPollId) { clearInterval(chatTypingPollId); chatTypingPollId = null; }
  clearTimeout(chatTypingClearTimer);
  chatTypingClearTimer = null;
  currentChatTypingUsers = [];
  renderChatTypingIndicator();
  if (options.notify !== false && roomId && chatTypingSignalActive) {
    api('POST', '/chat-rooms/' + roomId + '/typing', { typing: false }).catch(() => {});
  }
  chatTypingSignalActive = false;
  chatTypingLastSentAt = 0;
}

function sendChatTypingSignal(typing) {
  const roomId = currentRoomId;
  if (!roomId) return;
  const nextTyping = typing === true;
  const now = Date.now();
  if (nextTyping && chatTypingSignalActive && now - chatTypingLastSentAt < 2200) return;
  if (!nextTyping && !chatTypingSignalActive) return;
  chatTypingSignalActive = nextTyping;
  chatTypingLastSentAt = now;
  api('POST', '/chat-rooms/' + roomId + '/typing', { typing: nextTyping }).catch(() => {});
}

function updateChatTypingSignal(textarea) {
  const hasText = !!String(textarea?.value || '').trim();
  clearTimeout(chatTypingClearTimer);
  if (!hasText) {
    sendChatTypingSignal(false);
    return;
  }
  sendChatTypingSignal(true);
  chatTypingClearTimer = setTimeout(() => sendChatTypingSignal(false), 4200);
}

function hideChatMentionMenu() {
  chatMentionCandidates = [];
  chatMentionIndex = 0;
  chatMentionRange = null;
  const menu = document.getElementById('chatMentionMenu');
  if (menu) {
    menu.style.display = 'none';
    menu.innerHTML = '';
  }
}

function renderChatMentionMenu() {
  const menu = document.getElementById('chatMentionMenu');
  if (!menu) return;
  if (!chatMentionCandidates.length) return hideChatMentionMenu();
  menu.innerHTML = chatMentionCandidates.map((member, index) => {
    const avatar = member.photo_url
      ? `<img src="${esc(member.photo_url)}" referrerpolicy="no-referrer">`
      : esc(String(member.name || member.email || '?').slice(0, 1));
    return `<button type="button" class="chat-mention-option ${index === chatMentionIndex ? 'active' : ''}" onmousedown="event.preventDefault()" onclick="selectChatMention(${index})">
      <span class="chat-mention-avatar">${avatar}</span>
      <span style="flex:1;min-width:0"><span style="display:block;font-size:12px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(member.name || member.email)}</span>${member.email ? `<span style="display:block;font-size:10px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(member.email)}</span>` : ''}</span>
    </button>`;
  }).join('');
  menu.style.display = 'block';
  menu.querySelector('.chat-mention-option.active')?.scrollIntoView({ block: 'nearest' });
}

async function updateChatMentionMenu(textarea) {
  if (!textarea || !currentRoomId) return hideChatMentionMenu();
  const cursor = textarea.selectionStart ?? textarea.value.length;
  const beforeCursor = textarea.value.slice(0, cursor);
  const match = beforeCursor.match(/(?:^|\s)@([^\s@\[\]]*)$/u);
  if (!match) return hideChatMentionMenu();
  const query = String(match[1] || '').toLocaleLowerCase('ko-KR');
  const requestRoomId = String(currentRoomId);
  const range = { start: cursor - query.length - 1, end: cursor };
  chatMentionRange = range;
  try {
    const members = await loadRoomMembers(requestRoomId);
    if (String(currentRoomId) !== requestRoomId || document.getElementById('chatInput') !== textarea) return;
    if (!chatMentionRange || chatMentionRange.start !== range.start || chatMentionRange.end !== range.end) return;
    chatMentionCandidates = members
      .filter(member => member.uid !== currentUser.uid)
      .filter(member => !query || `${member.name || ''} ${member.email || ''}`.toLocaleLowerCase('ko-KR').includes(query))
      .slice(0, 8);
    chatMentionIndex = 0;
    renderChatMentionMenu();
  } catch (e) {
    hideChatMentionMenu();
  }
}

function formatChatMentionToken(name) {
  const normalized = String(name || '').trim();
  return /\s/u.test(normalized) ? `@[${normalized}]` : `@${normalized}`;
}

function selectChatMention(index) {
  const member = chatMentionCandidates[index];
  const input = document.getElementById('chatInput');
  if (!member || !input || !chatMentionRange) return;
  const token = formatChatMentionToken(member.name || member.email || '사용자');
  input.value = input.value.slice(0, chatMentionRange.start) + token + ' ' + input.value.slice(chatMentionRange.end);
  const nextCursor = chatMentionRange.start + token.length + 1;
  input.setSelectionRange(nextCursor, nextCursor);
  chatSelectedMentions.set(member.uid, { ...member, token });
  hideChatMentionMenu();
  handleChatInputInput(input);
  input.focus();
}

function handleChatMentionKeydown(event) {
  const menu = document.getElementById('chatMentionMenu');
  if (!menu || menu.style.display === 'none' || !chatMentionCandidates.length) return false;
  if (event.isComposing || event.keyCode === 229) return false;
  if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
    event.preventDefault();
    const direction = event.key === 'ArrowDown' ? 1 : -1;
    chatMentionIndex = (chatMentionIndex + direction + chatMentionCandidates.length) % chatMentionCandidates.length;
    renderChatMentionMenu();
    return true;
  }
  if (event.key === 'Enter' || event.key === 'Tab') {
    event.preventDefault();
    selectChatMention(chatMentionIndex);
    return true;
  }
  if (event.key === 'Escape') {
    event.preventDefault();
    hideChatMentionMenu();
    return true;
  }
  return false;
}

function renderChatAttachmentPreview(options = {}) {
  const preview = document.getElementById('chatAttachmentPreview');
  const hasPendingAttachment = !!chatPendingAttachment && !!currentRoomId;
  document.body.classList.toggle('chat-has-pending-attachment', hasPendingAttachment && !isStandaloneChatWindow());
  if (!preview) return;
  if (!hasPendingAttachment) {
    preview.style.display = 'none';
    preview.innerHTML = '';
    if (!options.suppressSnap && chatShouldStickToBottom) queueChatBottomSnap('auto');
    return;
  }
  const attachment = chatPendingAttachment;
  const thumb = attachment.previewUrl
    ? `<img class="chat-attachment-thumb" src="${esc(attachment.previewUrl)}" alt="붙여넣은 이미지">`
    : `<div class="chat-attachment-thumb">📎</div>`;
  preview.style.display = 'flex';
  preview.innerHTML = `${thumb}
    <div class="chat-attachment-meta">
      <div class="chat-attachment-name">${esc(attachment.fileName || '붙여넣은 이미지')}</div>
      <div class="chat-attachment-caption">전송 버튼을 누르면 함께 전송됩니다.</div>
    </div>
    <button type="button" class="chat-attachment-remove" onclick="clearChatPendingAttachment()">✕</button>`;
  if (!options.suppressSnap && chatShouldStickToBottom) queueChatBottomSnap('auto');
}

function clearChatPendingAttachment(options = {}) {
  if (chatPendingAttachment?.previewUrl) {
    URL.revokeObjectURL(chatPendingAttachment.previewUrl);
  }
  chatPendingAttachment = null;
  renderChatAttachmentPreview(options);
}

function setChatPendingAttachment(file, options = {}) {
  if (!file) return;
  clearChatPendingAttachment({ suppressSnap: true });
  chatPendingAttachment = {
    file,
    fileName: options.fileName || file.name || `upload-${Date.now()}`,
    previewUrl: /^image\//i.test(file.type || '') ? URL.createObjectURL(file) : ''
  };
  renderChatAttachmentPreview(options);
  const input = document.getElementById('chatInput');
  if (input && options.focusInput !== false) input.focus();
}

function handleChatInputCompositionStart() {
  chatInputComposing = true;
}

function handleChatInputCompositionEnd() {
  chatInputComposing = false;
  const input = document.getElementById('chatInput');
  if (input) handleChatInputInput(input);
  if (chatSendQueuedAfterComposition) {
    chatSendQueuedAfterComposition = false;
    requestChatSend({ blurInput: false, delayMs: isMobileDevice() ? 30 : 0 });
  }
}

function requestChatSend(options = {}) {
  const input = document.getElementById('chatInput');
  if (!input || !currentRoomId || _sendingMsg) return;

  if (chatInputComposing) {
    chatSendQueuedAfterComposition = true;
    if (isMobileDevice() && options.blurInput !== false) input.blur();
    return;
  }

  const needsMobileCommitDelay = isMobileDevice() && document.activeElement === input;
  const delayMs = options.delayMs !== undefined ? options.delayMs : (needsMobileCommitDelay ? 60 : 0);
  if (delayMs > 0) {
    if (options.blurInput !== false) input.blur();
    clearTimeout(chatSendRequestTimer);
    chatSendRequestTimer = setTimeout(() => {
      chatSendRequestTimer = null;
      sendMsg();
    }, delayMs);
    return;
  }

  sendMsg();
}

function handleChatSendButtonPress(event) {
  if (event) {
    event.preventDefault();
    event.stopPropagation();
  }
  requestChatSend({ blurInput: false });
  return false;
}

function getChatVisualSignature(msgs = []) {
  return msgs.map(msg => [
    msg.id,
    msg.text || '',
    msg.imageUrl || '',
    msg.fileUrl || '',
    msg.fileName || '',
    msg.createdAt || ''
  ].join('|')).join('||');
}

function pruneRecentNotificationSignals() {
  const now = Date.now();
  for (const [key, expiresAt] of recentNotificationSignals.entries()) {
    if (expiresAt <= now) recentNotificationSignals.delete(key);
  }
}

function rememberNotificationSignal(key, ttlMs = 15000) {
  if (!key) return;
  pruneRecentNotificationSignals();
  recentNotificationSignals.set(String(key), Date.now() + ttlMs);
}

function wasNotificationSignalRecent(key) {
  if (!key) return false;
  pruneRecentNotificationSignals();
  const expiresAt = recentNotificationSignals.get(String(key));
  return !!expiresAt && expiresAt > Date.now();
}

function suppressChatAlerts(ms = 8000) {
  suppressChatAlertsUntil = Math.max(suppressChatAlertsUntil, Date.now() + ms);
}

function suppressNoticeAlerts(ms = 8000) {
  suppressNoticeAlertsUntil = Math.max(suppressNoticeAlertsUntil, Date.now() + ms);
}

function isIosDevice() {
  return /iPad|iPhone|iPod/.test(navigator.userAgent)
    || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
}

function isSafariBrowser() {
  const ua = navigator.userAgent;
  return /Safari/.test(ua) && !/CriOS|FxiOS|EdgiOS|OPiOS|DuckDuckGo/.test(ua);
}

function isMobileDevice() {
  return /Android|iPhone|iPad|iPod/i.test(navigator.userAgent)
    || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
}

function isStandaloneMode() {
  return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
}

function shouldOpenChatRoomInWindow() {
  return !isMobileDevice() && !isStandaloneChatWindow();
}

function canOfferInstall() {
  if (!isMobileDevice() || isStandaloneMode()) return false;
  if (isIosDevice()) return true;
  return !!deferredInstallPrompt;
}

function isInstallPromptDismissed() {
  const dismissedAt = Number(localStorage.getItem(INSTALL_PROMPT_DISMISS_KEY) || 0);
  if (!dismissedAt) return false;
  return Date.now() - dismissedAt < INSTALL_PROMPT_DISMISS_TTL;
}

function dismissInstallPrompt() {
  localStorage.setItem(INSTALL_PROMPT_DISMISS_KEY, String(Date.now()));
  renderInstallPrompt();
}

function getInstallPromptCopy() {
  if (isIosDevice()) {
    if (isSafariBrowser()) {
      return {
        title: '홈 화면에 앱처럼 설치',
        meta: 'iPhone은 버튼 한 번으로 바로 설치되지는 않고, 안내를 본 뒤 공유 버튼에서 홈 화면에 추가해야 합니다.',
        action: '홈 화면에 추가 안내'
      };
    }
    return {
      title: 'iPhone 설치는 Safari에서',
      meta: 'iPhone은 Safari에서 홈 화면에 추가해야 앱처럼 설치됩니다. 버튼을 누르면 설치 안내가 열립니다.',
      action: 'Safari 설치 안내'
    };
  }

  return {
    title: '앱으로 설치',
    meta: '홈 화면에 추가하면 전체화면으로 더 빠르게 실행할 수 있습니다.',
    action: '앱 설치'
  };
}

function updateInstallPromptPosition() {
  const installPrompt = document.getElementById('installPrompt');
  if (!installPrompt) return;
  const isAppScreen = document.getElementById('appLayout').style.display !== 'none';
  const isMobile = window.innerWidth <= 768;
  installPrompt.style.bottom = isAppScreen && isMobile ? 'calc(var(--safe-bottom) + 72px)' : '16px';
}

function renderInstallPrompt(forceVisible = false) {
  const installPrompt = document.getElementById('installPrompt');
  if (!installPrompt) return;

  updateInstallPromptPosition();

  if (!canOfferInstall() || (!forceVisible && isInstallPromptDismissed())) {
    installPrompt.style.display = 'none';
    installPrompt.innerHTML = '';
    return;
  }

  const copy = getInstallPromptCopy();
  installPrompt.innerHTML = `<div class="install-prompt-card">
    <div class="install-prompt-head">
      <div>
        <div class="install-prompt-title">📲 ${copy.title}</div>
        <div class="install-prompt-meta">${copy.meta}</div>
      </div>
      <button class="install-prompt-close" onclick="dismissInstallPrompt()">✕</button>
    </div>
    <div class="install-prompt-actions">
      <button class="install-prompt-btn secondary" onclick="dismissInstallPrompt()">나중에</button>
      <button class="install-prompt-btn primary" onclick="openInstallExperience()">${copy.action}</button>
    </div>
  </div>`;
  installPrompt.style.display = 'block';
}

async function openInstallExperience() {
  if (isIosDevice()) {
    openIosInstallGuide();
    return;
  }

  if (!deferredInstallPrompt) {
    alert('이 기기에서는 아직 설치 프롬프트를 바로 띄울 수 없습니다. 잠시 후 다시 시도해주세요.');
    return;
  }

  const promptEvent = deferredInstallPrompt;
  deferredInstallPrompt = null;
  renderInstallPrompt();

  promptEvent.prompt();
  const choiceResult = await promptEvent.userChoice.catch(() => null);
  if (choiceResult?.outcome !== 'accepted') {
    renderInstallPrompt(true);
  }
}

function openIosInstallGuide() {

  h += `<div style="font-size:12px;color:var(--text3);margin-bottom:12px">이 버튼이 바로 설치를 실행하는 것은 아니고, 홈 화면에 추가하는 순서를 안내합니다.</div>`;
  h += safariExtra;
  h += `<div class="card"><div class="card-title">${isSafariBrowser() ? '1' : '2'}. 공유 버튼 누르기</div><div class="card-meta">Safari 하단의 공유 버튼을 누르세요. 버튼 모양은 네모 위 화살표입니다.</div></div>`;
  h += `<div class="card"><div class="card-title">${isSafariBrowser() ? '2' : '3'}. 홈 화면에 추가</div><div class="card-meta">공유 메뉴에서 홈 화면에 추가를 누르면 아이폰 홈 화면에 바로 설치됩니다.</div></div>`;
  h += `<button class="btn btn-red" onclick="closeModal()" style="width:100%">확인</button>`;

function getDeepLinkState() {
  const params = new URLSearchParams(location.search);
  return {
    page: params.get('page'),
    roomId: params.get('roomId'),
    tab: params.get('tab'),
    filter: params.get('filter'),
    date: params.get('date')
  };
}

function clearDeepLinkState() {
  if (!location.search) return;
  const params = new URLSearchParams(location.search);
  if (params.get('chatWindow') === '1' && params.get('page') === 'chat') return;
  history.replaceState({}, document.title, location.pathname + location.hash);
}

async function handleInternalDeepLink(targetUrl) {
  if (!targetUrl) return;
  const url = new URL(targetUrl, location.origin);
  const page = url.searchParams.get('page');

  if (page === 'chat') {
    const roomId = url.searchParams.get('roomId');
    if (roomId && shouldOpenChatRoomInWindow() && url.searchParams.get('chatWindow') !== '1') {
      openChatRoomInWindow(roomId);
      return;
    }
    navTo('chat');
    if (!roomId) return;
    let room = chatRooms.find(r => String(r.id) === String(roomId));
    if (!room) {
      await refreshChatRoomCaches();
      room = chatRooms.find(r => String(r.id) === String(roomId));
    }
    if (room) enterRoom(String(room.id), room.name);
    return;
  }

  if (page === 'calendar') {
    const tab = url.searchParams.get('tab');
    const filter = url.searchParams.get('filter');
    const date = url.searchParams.get('date');
    const eventId = url.searchParams.get('eventId');
    if (tab && ['month', 'list', 'kanban', 'weekly', 'timetable'].includes(tab)) calSubTab = tab;
    if (filter && ['today', 'month', 'incomplete', 'today_incomplete'].includes(filter)) listDateFilter = filter;
    if (date) {
      selectedDate = date;
      const parts = String(date).split('-').map(Number);
      if (parts.length >= 2 && parts[0] && parts[1]) {
        currentYear = parts[0];
        currentMonth = parts[1];
      }
    }
    navTo('calendar');
    if (eventId) {
      setTimeout(async () => {
        if (!events.some(e => String(e.id) === String(eventId))) await fetchEvents();
        refreshCalendarUi({ keepScroll: true, openDetailId: eventId });
      }, 350);
    }
    return;
  }

  if (page === 'notice') {
    navTo('notice');
    return;
  }

  if (page === 'request') {
    navTo('request');
    return;
  }

  if (page === 'project') {
    selectedProjectId = url.searchParams.get('projectId') || null;
    selectedProjectTaskId = url.searchParams.get('taskId') || null;
    projectSubTab = selectedProjectTaskId ? 'tasks' : 'overview';
    navTo('project');
    return;
  }

  location.href = url.pathname + url.search;
}

function applyDeepLinkState() {
  const deepLink = getDeepLinkState();
  if (!deepLink.page) return;
  handleInternalDeepLink(location.pathname + location.search);
  clearDeepLinkState();
}

async function ensureServiceWorkerRegistration() {
  if (!('serviceWorker' in navigator)) return null;
  let reg = await navigator.serviceWorker.getRegistration('/sw.js').catch(() => null);
  if (!reg) reg = await navigator.serviceWorker.register('/sw.js');
  reg.addEventListener('updatefound', () => {
    const newSW = reg.installing;
    if (!newSW) return;
    newSW.addEventListener('statechange', () => {
      // Don't auto-reload (would wipe in-progress forms and scroll),
      // but surface a dismissible banner so the user can pick a safe
      // moment. Without this prompt, a stale tab could keep running
      // outdated JS for hours — which is exactly how ~half the
      // manager accounts ended up still hitting the unscoped /events
      // endpoint long after the scoping fix shipped.
      if (newSW.state === 'activated') {
        swUpdateAvailable = true;
        showSwUpdateBanner();
      }
    });
  });
  await navigator.serviceWorker.ready.catch(() => null);
  reg.update().catch(() => {});
  return reg;
}

function showSwUpdateBanner() {
  if (document.getElementById('swUpdateBanner')) return;
  const banner = document.createElement('div');
  banner.id = 'swUpdateBanner';
  banner.setAttribute('role', 'status');

// ── API Helper ──
async function api(method, path, body) {
  // Short-circuit every call once the token has expired. Previously a
  // lingering tab would keep the 5-second polling alive for hours,
  // hammering the server with 401s — the backend log showed 143 such
  // JWT-expired entries in 500 lines. Once we've seen a 401 we stop
  // all issue-new-requests work until the user reloads.
  if (sessionExpired) throw new Error('Session expired');
  if (!currentUser) throw new Error('Not signed in');
  const started = CAL_DEBUG ? performance.now() : 0;
  let token;
  try {
    token = await currentUser.getIdToken();
  } catch (e) {
    // getIdToken() throws after the underlying refresh token is
    // invalidated; treat that the same as a 401.
    handleSessionExpiry(e?.message || 'token refresh failed');
    throw e;
  }
  const isFormData = typeof FormData !== 'undefined' && body instanceof FormData;
  const headers = { 'Authorization': 'Bearer ' + token };
  if (!isFormData) headers['Content-Type'] = 'application/json';
  const opts = { method, headers };
  if (body) opts.body = isFormData ? body : JSON.stringify(body);
  dlog('api →', method, path);
  const res = await fetch('/api' + path, opts);
  if (res.status === 401) {
    handleSessionExpiry('401 from ' + path);
    throw new Error('Session expired');
  }
  if (!res.ok) {
    dwarn('api ✗', method, path, res.status);
    const err = await res.json().catch(() => ({}));
    throw new Error(err.error || 'API error');
  }
  const json = await res.json();
  if (CAL_DEBUG) dlog('api ✓', method, path, { ms: Math.round(performance.now() - started), size: Array.isArray(json) ? json.length : undefined });
  return json;
}

function handleSessionExpiry(reason) {
  if (sessionExpired) return;
  sessionExpired = true;
  dwarn('session expired', reason);
  if (pollId) { clearInterval(pollId); pollId = null; }
  if (chatPollId) { clearInterval(chatPollId); chatPollId = null; }
  // Show a dismissable, non-modal banner instead of an alert so it
  // doesn't interrupt whatever the user was doing. One click to
  // reload gets them back to a working session.
  if (document.getElementById('sessionExpiredBanner')) return;
  const banner = document.createElement('div');
  banner.id = 'sessionExpiredBanner';
  banner.setAttribute('role', 'alert');
  banner.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99999;background:#b91c1c;color:#fff;padding:10px 14px;text-align:center;font-size:13px;font-family:inherit;box-shadow:0 2px 8px rgba(0,0,0,0.4)';
  banner.innerHTML = '세션이 만료되었습니다. <button onclick="location.reload()" style="margin-left:10px;padding:4px 12px;border-radius:4px;background:#fff;color:#b91c1c;border:none;cursor:pointer;font-weight:600">새로고침</button>';
  document.body.appendChild(banner);
}
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function todayStr() { const t = new Date(); return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0'); }

function installCalendarMutationProbe() {
  // Only install the deep DOM-mutation probe when ?debug=2 is set.
  // ?debug=1 still emits dlog/api/render traces but skips this
  // MutationObserver, because during a morphHtml pass it fires
  // hundreds of times — each dlog call appends to a buffer and
  // schedules an upload, so just having debug=1 on made clicking a
  // calendar cell go from ~35ms to ~220ms. Opt-in via debug=2 when
  // you actually need DOM-diff traces.
  if (!CAL_DEBUG) return;
  const deep = /(^|[?&])debug=2(\b|&)/.test(location.search) || localStorage.getItem('calendarDebugDeep') === '1';
  if (!deep) {
    dlog('mutation probe skipped (use ?debug=2 for deep tracing)');
    return;
  }
  const body = document.getElementById('mainBody');
  if (!body) return;
  // Coalesce all mutations within a 120ms window into a single log
  // entry so an 800-mutation morph pass emits one summary, not 800.
  let acc = { added: 0, removed: 0, targets: new Set() };
  let flushTimer = null;
  const flush = () => {
    flushTimer = null;
    if (acc.added + acc.removed === 0) { acc.targets.clear(); return; }
    const big = acc.removed >= 20;
    (big ? dwarn : dlog)('mutation#mainBody', {
      added: acc.added, removed: acc.removed,
      targets: [...acc.targets].slice(0, 8),
    });
    acc = { added: 0, removed: 0, targets: new Set() };
  };
  const obs = new MutationObserver(muts => {
    for (const m of muts) {
      if (m.type !== 'childList') continue;
      acc.added += m.addedNodes.length;
      acc.removed += m.removedNodes.length;
      const t = m.target;
      acc.targets.add((t.id ? '#' + t.id : t.nodeName) + (t.className ? '.' + String(t.className).split(/\s+/)[0] : ''));
    }
    if (!flushTimer) flushTimer = setTimeout(flush, 120);
  });
  obs.observe(body, { childList: true, subtree: true });
  dlog('mutation probe installed on #mainBody (deep)');
}

async function initApp() {
  window.__bootMark && window.__bootMark('initApp:start');
  installCalendarMutationProbe();
  // Apply chat-only account restriction before any first render. When
  // set, the sidebar/mobile-tabs lose every non-chat entry, boot-time
  // fetches for events/ideas/notices/reports are skipped entirely,
  // and navTo() will refuse to route anywhere but 'chat'. Server
  // enforces the same policy so a direct API hit can't bypass it.
  applyChatOnlyRestrictions();
  // Avatar
  const av = document.getElementById('sidebarAvatar');
  if (currentUser.photoURL) av.innerHTML = `<img src="${currentUser.photoURL}" referrerpolicy="no-referrer">`;
  document.getElementById('sidebarName').textContent = currentUser.displayName || currentUser.email;

  const now = new Date();
  currentYear = now.getFullYear(); currentMonth = now.getMonth() + 1;
  selectedDate = todayStr();

  // All boot-time fetches are independent of one another: paintable
  // state in the calendar tab does not depend on chat or notice data
  // and vice versa. Previously these were serialised behind three
  // separate awaits which stacked the boot waterfall to ~3 network
  // round trips; Promise.all collapses them into one.
  window.__bootMark && window.__bootMark('boot:parallel-fetches:start');
  // chat_only accounts never render the calendar/notice/report/idea
  // pages, so fetching their data wastes a round trip AND a 29MB
  // payload on manager-scale tenants. Only grab chat-adjacent data.
  const chatOnly = isChatOnlyUser();
  const externalCalendarOnly = isExternalCalendarOnlyUser();
  const fetches = chatOnly ? [
    refreshChatRoomCaches({ skipUnread: true }).then(() => window.__bootMark && window.__bootMark('boot:refreshChatRoomCaches:done')).catch(() => {}),
    checkAllRoomsUnread({ suppressAlerts: true }).then(() => window.__bootMark && window.__bootMark('boot:checkAllRoomsUnread:done')),
  ] : externalCalendarOnly ? [
    fetchEvents().then(() => window.__bootMark && window.__bootMark('boot:fetchEvents:done')),
    refreshChatRoomCaches({ skipUnread: true }).then(() => window.__bootMark && window.__bootMark('boot:refreshChatRoomCaches:done')).catch(() => {}),
    checkAllRoomsUnread({ suppressAlerts: true }).then(() => window.__bootMark && window.__bootMark('boot:checkAllRoomsUnread:done')),
  ] : [
    fetchEvents().then(() => window.__bootMark && window.__bootMark('boot:fetchEvents:done')),
    fetchIdeas().then(() => window.__bootMark && window.__bootMark('boot:fetchIdeas:done')),
    fetchCustomTypes().then(() => window.__bootMark && window.__bootMark('boot:fetchCustomTypes:done')),
    fetchCustomCats().then(() => window.__bootMark && window.__bootMark('boot:fetchCustomCats:done')),
    fetchCustomIdeaCats().then(() => window.__bootMark && window.__bootMark('boot:fetchCustomIdeaCats:done')),
    refreshChatRoomCaches({ skipUnread: true }).then(() => window.__bootMark && window.__bootMark('boot:refreshChatRoomCaches:done')).catch(() => {}),
    checkAllRoomsUnread({ suppressAlerts: true }).then(() => window.__bootMark && window.__bootMark('boot:checkAllRoomsUnread:done')),
    checkNoticeUnread({ suppressAlerts: true }).then(() => window.__bootMark && window.__bootMark('boot:checkNoticeUnread:done')),
  ];
  await Promise.all(fetches);
  window.__bootMark && window.__bootMark('boot:parallel-fetches:end');
  // admin: 오늘 보고서 리마인더 자동 생성 (chat_only admin은 없음)
  if (isAdmin && !chatOnly && !externalCalendarOnly) { api('POST','/reports/auto-reminders',{}).catch(()=>{}); }
  window.__bootMark && window.__bootMark('boot:navTo:start');
  navTo(chatOnly || isStandaloneChatWindow() ? 'chat' : 'calendar');
  window.__bootMark && window.__bootMark('boot:navTo:end');
  if (!chatOnly) applyDeepLinkState();

  // 읽지 않은 공지 팝업 체크 (chat_only 계정은 공지 페이지 자체가 없음)
  if (!chatOnly && !externalCalendarOnly) setTimeout(() => showUnreadNoticePopup(), 1500);

  // Polling. Gate /events fetch to the calendar tab — the other
  // pages (chat, report, notice, idea, more) don't read from the
  // events array, so refetching 50k+ rows every 5s while the user
  // isn't even looking at the calendar is pure waste. navTo('calendar')
  // re-triggers fetchEvents() on return if the data is stale.
  // chat_only accounts never visit non-chat pages, so skip events +
  // notice unread polling entirely for them.
  pollId = setInterval(async () => {
    if (sessionExpired) { dlog('poll skipped (session expired)'); return; }
    dlog('poll tick', { page: currentPage });
    const shouldRenderChatRoomList = shouldRefreshVisibleChatRoomCaches();
    const tasks = [
      shouldRenderChatRoomList
        ? refreshChatRoomCaches({ skipUnread: true }).then(() => {
            maybeRenderVisibleChatRoomList();
          })
        : Promise.resolve(),
      checkAllRoomsUnread({ renderList: shouldRenderChatRoomList }),
    ];
    if (!chatOnly) {
      tasks.push(currentPage === 'calendar'
        ? fetchEvents().then(() => refreshCalendarUi({ keepScroll: true }))
        : Promise.resolve());
      if (!externalCalendarOnly) tasks.push(checkNoticeUnread());
    }
    await Promise.all(tasks);
  }, 5000);

  // 백그라운드 복귀 시 즉시 알림 체크.
  // Desktop browsers fire BOTH `visibilitychange` (hidden→visible) AND
  // `window.focus` on tab-return, usually within ~10-50ms of each
  // other. The chat rewrite made each handler issue 2-3 API calls +
  // an optional re-render, so without dedupe every tab-return became
  // a double burst of 4-6 fetches (seen in debug logs as a ~10ms pair
  // of identical chat-rooms/unread + notices/unread/count requests).
  // Centralize the logic and ignore secondary wake events within 1s.
  let lastAppWakeAt = 0;
  const onAppResume = () => {
    const now = Date.now();
    if (now - lastAppWakeAt < 1000) { dlog('appResume deduped'); return; }
    lastAppWakeAt = now;
    dlog('appResume');
    const shouldRenderChatRoomList = shouldRefreshVisibleChatRoomCaches();
    suppressChatAlerts();
    suppressNoticeAlerts();
    checkAllRoomsUnread({ suppressAlerts: true, renderList: shouldRenderChatRoomList });
    if (!externalCalendarOnly) checkNoticeUnread({ suppressAlerts: true });
    if (shouldRenderChatRoomList) {
      refreshChatRoomCaches({ skipUnread: true }).then(() => {
        maybeRenderVisibleChatRoomList();
      });
    }
    if (!chatOnly) fetchEvents();
  };
  document.addEventListener('visibilitychange', () => { if (!document.hidden) onAppResume(); });
  window.addEventListener('focus', onAppResume);

  renderInstallPrompt();

  // PWA Service Worker 등록 + 자동 업데이트
  const swReg = await ensureServiceWorkerRegistration().catch(() => null);
  if (swReg) setInterval(() => swReg.update(), 300000);

  // FCM 푸시 토큰 등록
  registerFCM(!isIosDevice());
}

// ── Data Fetch ──
// Scope /events fetches to a 3-year window centred on the currently
// viewed year. The production events table holds ~77k rows spanning
// 2026 → 2073 (repeat-series pre-creation), and an unscoped fetch
// returned ~50k rows for a manager on every 5-second poll. The
// calendar only needs a few months around the visible one, list view
// filters by current month, and kanban scans alive team todos — all
// satisfied by ±1 year around the user's context.
function computeEventFetchRange() {
  const yr = currentYear || new Date().getFullYear();
  return {
    from: `${yr - 1}-01-01`,
    to: `${yr + 1}-12-31`,
  };
}

let lastEventsFetchAt = 0;
async function fetchEvents() {
  const before = events.length;
  try {
    const { from, to } = computeEventFetchRange();
    const data = await api('GET', `/events?from=${from}&to=${to}`);
    lastEventsFetchAt = Date.now();
    const serverEvents = data.map(mapEventRecord);
    const now = Date.now();
    const UPSERT_GRACE_MS = 15000;
    for (const [id, ts] of recentLocalUpserts) {
      if (now - ts > UPSERT_GRACE_MS) recentLocalUpserts.delete(id);
    }
    let keptLocalCount = 0;
    if (recentLocalUpserts.size) {
      const serverIds = new Set(serverEvents.map(e => String(e.id)));
      const keepLocal = events.filter(e =>
        !serverIds.has(String(e.id)) && recentLocalUpserts.has(String(e.id))
      );
      keptLocalCount = keepLocal.length;
      events = keepLocal.length ? [...serverEvents, ...keepLocal] : serverEvents;
    } else {
      events = serverEvents;
    }
    dlog('fetchEvents', { before, after: events.length, server: serverEvents.length, keptLocal: keptLocalCount, grace: recentLocalUpserts.size });
    try { checklistSummary = await api('GET','/events/checklist-summary'); } catch(e2) {}
  } catch(e) { dwarn('fetchEvents ✗', e?.message || e); }
}

function mapEventRecord(record = {}) {
  return {
    id: record.id,
    type: record.type,
    title: record.title,
    date: record.date,
    time: record.time || '',
    url: record.url || '',
    memo: record.memo || '',
    todoCat: record.todoCat !== undefined ? record.todoCat : (record.todo_cat || null),
    reminder: record.reminder || null,
    scope: record.scope || 'personal',
    ownerId: record.ownerId !== undefined ? record.ownerId : record.owner_id,
    ownerName: record.ownerName !== undefined ? record.ownerName : record.owner_name,
    isShared: record.isShared !== undefined ? record.isShared : record.is_shared === true,
    done: record.done === true,
    deleted: record.deleted === true,
    kanbanStatus: record.kanbanStatus !== undefined ? record.kanbanStatus : (record.kanban_status || 'todo'),
    projectId: record.projectId !== undefined ? record.projectId : record.project_id,
    repeatType: record.repeatType !== undefined ? record.repeatType : record.repeat_type,
    endDate: record.endDate !== undefined ? record.endDate : (record.end_date || null),
    sortOrder: record.sortOrder !== undefined ? record.sortOrder : (record.sort_order || 0),
    createdAt: record.createdAt !== undefined ? record.createdAt : record.created_at
  };
}

const checklistItemsCache = {};
const openInlineChecklistIds = new Set();
let eventDetailRenderTicket = 0;
let currentOpenEventDetailId = null;

function mapChecklistItem(record = {}) {
  return {
    id: record.id,
    eventId: record.eventId !== undefined ? record.eventId : record.event_id,
    title: record.title || '',
    done: record.done === true,
    sortOrder: record.sortOrder !== undefined ? record.sortOrder : (record.sort_order || 0),
    createdAt: record.createdAt !== undefined ? record.createdAt : record.created_at
  };
}

function getNextTodoSortOrder(date, todoCat = null, options = {}) {
  const scope = options.scope || 'personal';
  const ownerId = options.ownerId !== undefined ? options.ownerId : currentUser?.uid;
  const normalizedCat = todoCat || null;
  const matched = events.filter(event => {
    if (event.deleted || event.type !== 'todo' || event.date !== date) return false;
    if ((event.todoCat || null) !== normalizedCat) return false;
    if ((event.scope || 'personal') !== scope) return false;
    if (scope === 'personal' && ownerId && event.ownerId !== ownerId) return false;
    return true;
  });
  if (!matched.length) return 0;
  return Math.max(...matched.map(event => Number(event.sortOrder) || 0)) + 1;
}

function normalizeCreatedTodoEventRecord(record, options = {}) {
  if (!record || record.type !== 'todo') return record;
  const normalized = { ...record };
  const scope = normalized.scope || options.scope || 'personal';
  const ownerId = normalized.ownerId !== undefined ? normalized.ownerId : (normalized.owner_id !== undefined ? normalized.owner_id : options.ownerId);
  const todoCat = normalized.todoCat !== undefined ? normalized.todoCat : (normalized.todo_cat || null);
  const expectedSortOrder = getNextTodoSortOrder(normalized.date, todoCat, { scope, ownerId });
  const hasSortOrder = normalized.sortOrder !== undefined || normalized.sort_order !== undefined;
  const currentSortOrder = Number(normalized.sortOrder !== undefined ? normalized.sortOrder : normalized.sort_order);
  if (!hasSortOrder || Number.isNaN(currentSortOrder) || currentSortOrder < expectedSortOrder) {
    normalized.sortOrder = expectedSortOrder;
  }
  return normalized;
}

function sortChecklistItems(items = []) {
  return items.slice().sort((left, right) => {
    if (left.done !== right.done) return left.done ? -1 : 1;
    const orderDiff = (left.sortOrder || 0) - (right.sortOrder || 0);
    if (orderDiff) return orderDiff;
    const createdDiff = String(left.createdAt || '').localeCompare(String(right.createdAt || ''));
    if (createdDiff) return createdDiff;
    return String(left.id || '').localeCompare(String(right.id || ''));
  });
}

function getChecklistItemsLocal(eventId) {
  return sortChecklistItems((checklistItemsCache[eventId] || []).map(item => ({ ...item })));
}

function getNextChecklistSortOrder(eventId) {
  const items = getChecklistItemsLocal(eventId);
  if (!items.length) return 0;
  return Math.max(...items.map(item => Number(item.sortOrder) || 0)) + 1;
}

function setChecklistItemsLocal(eventId, items = []) {
  if (!eventId) return [];
  checklistItemsCache[eventId] = sortChecklistItems(items.map(mapChecklistItem));
  return getChecklistItemsLocal(eventId);
}

function normalizeChecklistMutationResponse(eventId, response, fallbackItem = {}) {
  const isEnvelope = !!response && typeof response === 'object' && !Array.isArray(response) && (
    Object.prototype.hasOwnProperty.call(response, 'item') ||
    Object.prototype.hasOwnProperty.call(response, 'event') ||
    Object.prototype.hasOwnProperty.call(response, 'ok')
  );
  const itemCandidate = isEnvelope ? response.item : response;
  const eventCandidate = isEnvelope ? (response.event || null) : null;
  const mergedItem = itemCandidate && typeof itemCandidate === 'object' && !Array.isArray(itemCandidate)
    ? { ...fallbackItem, ...itemCandidate }
    : { ...fallbackItem };
  if (!mergedItem.eventId && !mergedItem.event_id) mergedItem.eventId = eventId;
  if (mergedItem.sortOrder === undefined && mergedItem.sort_order === undefined && fallbackItem.sortOrder === undefined) {
    mergedItem.sortOrder = getNextChecklistSortOrder(eventId);
  }
  return {
    item: mergedItem,
    event: eventCandidate,
    id: isEnvelope ? response.id : mergedItem.id
  };
}

function patchChecklistItemLocal(eventId, itemRecord) {
  const items = getChecklistItemsLocal(eventId);
  const nextItem = mapChecklistItem(itemRecord);
  const index = items.findIndex(item => String(item.id) === String(nextItem.id));
  if (index === -1) items.push(nextItem);
  else items[index] = { ...items[index], ...nextItem };
  return setChecklistItemsLocal(eventId, items);
}

function removeChecklistItemLocal(eventId, itemId) {
  const items = getChecklistItemsLocal(eventId).filter(item => String(item.id) !== String(itemId));
  return setChecklistItemsLocal(eventId, items);
}

function deriveChecklistEventState(items = []) {
  const total = items.length;
  const completed = items.filter(item => item.done).length;
  let kanbanStatus = 'todo';
  let done = false;
  if (total > 0 && total === completed) {
    kanbanStatus = 'done';
    done = true;
  } else if (completed > 0) {
    kanbanStatus = 'in_progress';
  }
  return { total, completed, done, kanbanStatus };
}

function applyChecklistItemsToLocalEvent(eventId, items, eventRecord = null) {
  const normalizedItems = setChecklistItemsLocal(eventId, items);
  const derived = deriveChecklistEventState(normalizedItems);
  setChecklistSummaryLocal(eventId, derived.total, derived.completed);
  const currentEvent = events.find(event => String(event.id) === String(eventId));
  if (eventRecord) {
    upsertLocalEvent({ ...(currentEvent || {}), ...eventRecord, id: eventId, done: derived.done, kanbanStatus: derived.kanbanStatus });
  } else if (currentEvent) {
    upsertLocalEvent({ ...currentEvent, id: eventId, done: derived.done, kanbanStatus: derived.kanbanStatus });
  }
  return { items: normalizedItems, ...derived };
}

async function fetchChecklistItems(eventId) {
  const items = await api('GET','/events/'+eventId+'/checklist');
  applyChecklistItemsToLocalEvent(eventId, items);
  return getChecklistItemsLocal(eventId);
}

function upsertLocalEvent(record) {
  if (!record?.id) return null;
  const nextEvent = mapEventRecord(record);
  const index = events.findIndex(event => event.id === nextEvent.id);
  if (nextEvent.deleted) {
    events = events.filter(event => event.id !== nextEvent.id);
    delete checklistSummary[nextEvent.id];
    delete checklistItemsCache[nextEvent.id];
    openInlineChecklistIds.delete(String(nextEvent.id));
    recentLocalUpserts.delete(String(nextEvent.id));
    dlog('upsertLocalEvent (delete)', nextEvent.id);
    return null;
  }
  // Track local mutation so a concurrent polling fetchEvents() can't
  // clobber or briefly "disappear" an event the user just saved.
  recentLocalUpserts.set(String(nextEvent.id), Date.now());
  if (index === -1) {
    events = [nextEvent, ...events];
    dlog('upsertLocalEvent (insert)', { id: nextEvent.id, type: nextEvent.type, date: nextEvent.date });
  } else {
    events[index] = { ...events[index], ...nextEvent };
    dlog('upsertLocalEvent (update)', { id: nextEvent.id, date: nextEvent.date });
  }
  return index === -1 ? nextEvent : events[index];
}

function setChecklistSummaryLocal(eventId, total = 0, completed = 0) {
  if (!eventId) return;
  if (total > 0) {
    checklistSummary[eventId] = { total, completed };
    return;
  }
  delete checklistSummary[eventId];
}
