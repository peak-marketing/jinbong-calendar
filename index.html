// 캘린더 일정 불러오기
async function openImportEvents(date) {
  try {
    const available = await api('GET', '/timetable/available-events?date=' + date);
    if (!available.length) {
      openModal(`<div class="modal-title">📅 일정 불러오기</div>
        <div style="color:var(--text3);text-align:center;padding:20px;font-size:13px">불러올 일정이 없습니다<br><span style="font-size:11px">이미 모두 추가했거나, 오늘 일정이 없습니다</span></div>
        <button class="btn btn-dark" onclick="closeModal()" style="width:100%;margin-top:12px">닫기</button>`);
      return;
    }
    const allTypes = getAllEventTypes();
    let h = `<div class="modal-title">📅 일정 불러오기</div>
      <div style="font-size:12px;color:var(--text3);margin-bottom:12px">원하는 일정을 선택하면 일과표에 추가됩니다</div>`;
    window._importAvailable = available;
    available.forEach((e, idx) => {
      const t = allTypes[e.type] || {icon:'📌'};
      const time = e.time || '';
      h += `<div class="room-item" onclick="importEventByIndex('${date}',${idx})">
        <div style="width:32px;height:32px;border-radius:8px;background:var(--bg4);display:flex;align-items:center;justify-content:center;font-size:16px">${t.icon}</div>
        <div style="flex:1"><div style="font-size:13px;font-weight:600">${esc(e.title)}</div><div style="font-size:10px;color:var(--text3)">${e.date}${time?' · '+time:''}</div></div>
        <span style="color:var(--blue);font-size:12px">+ 추가</span>
      </div>`;
    });
    h += `<button class="btn btn-dark" onclick="closeModal()" style="width:100%;margin-top:12px">닫기</button>`;
    openModal(h);
  } catch(e) { alert('로드 실패: ' + e.message); }
}

function importEventByIndex(date, idx) {
  const e = window._importAvailable[idx];
  if (!e) return;
  importEventToTimetable(date, e.id, e.title, e.time || '');
}

async function importEventToTimetable(date, eventId, title, time) {
  // 시간이 있으면 그 시간 사용, 없으면 기본값
  let startTime = '09:00', endTime = '09:30';
  if (time && time.includes(':')) {
    startTime = time.slice(0, 5);
    // 종료시간은 시작시간 + 30분
    const [hh, mm] = startTime.split(':').map(Number);
    const endMin = mm + 30;
    endTime = String(hh + Math.floor(endMin / 60)).padStart(2, '0') + ':' + String(endMin % 60).padStart(2, '0');
  }
  try {
    await api('POST', '/timetable', { date, startTime, endTime, title, eventId });
    closeModal();
    renderPage();
  } catch(e) { alert('추가 실패'); }
}

// 미완료 항목 → 오늘 일과표에 빠르게 추가
async function quickAddToTimetable(eventId) {
  const ev = events.find(e => e.id === eventId);
  if (!ev) return;
  const today = todayStr();
  try {
    await api('POST', '/timetable', { date: today, startTime: '09:00', endTime: '09:30', title: ev.title, eventId: parseInt(eventId) });
    alert('일과표에 추가했습니다');
  } catch(e) { alert('추가 실패'); }
}

async function loadReportStatus(date) {
  const el = document.getElementById('reportStatusArea');
  const wrap = document.getElementById('reportStatusWrap');
  if (!el) return;
  const commit = (html, hidden = false) => {
    // Only touch the DOM when the content actually changes, so a
    // polling-driven or modal-close-driven re-render doesn't produce
    // a visible "로딩 중... → content" flash every time.
    reportStatusCache[date] = hidden ? REPORT_STATUS_HIDDEN : html;
    if (wrap) wrap.style.display = hidden ? 'none' : '';
    const desired = hidden ? '' : html;
    if (el.innerHTML !== desired) el.innerHTML = desired;
  };
  try {
    const status = await api('GET','/reports/team-status?date='+date);
    if (!status.length) { commit('', true); return; }

    // 주말이면 보고서 현황 안 보임
    const d = new Date(date);
    const isWeekend = d.getDay() === 0 || d.getDay() === 6;
    // 휴무일 체크
    let isHoliday = false;
    try { const hc = await api('GET','/holidays/check?date='+date); isHoliday = hc.isHoliday; } catch(e) {}
    if (isWeekend || isHoliday) {
      if (isHoliday) {
        commit('<div style="font-size:12px;color:var(--yellow)">📅 휴무일</div>');
      } else {
        commit('', true);
      }
      return;
    }
    const dow = d.getDay(); // 0=일, 1=월
    const dayOfMonth = d.getDate();
    const isMonday = dow === 1;
    const isFirstDay = dayOfMonth === 1;

    let h = '';
    const submitted = status.filter(s => s.submitted);
    const missing = status.filter(s => !s.submitted);
    const dailyContent = [...submitted.map(s=>`<div style="display:flex;align-items:center;gap:6px;padding:2px 0;font-size:11px"><span style="color:var(--green)">✅</span><span>${esc(s.name)}</span></div>`),
      ...missing.map(s=>`<div style="display:flex;align-items:center;gap:6px;padding:2px 0;font-size:11px"><span style="color:var(--red)">❌</span><span>${esc(s.name)}</span></div>`)].join('');

    h += accordion('📄 일일 보고서', `${submitted.length}/${status.length}`, 'var(--text2)', dailyContent, false);

    if (isMonday && userDoc.show_sales_report !== false) {
      let weeklyContent = '';
      try {
        const weeklyReports = await api('GET','/weekly-reports');
        const lastMon = new Date(d); lastMon.setDate(d.getDate() - 7);
        const lastMonStr = lastMon.toISOString().slice(0,10);
        const weeklySubmitted = weeklyReports.filter(r => r.week_start === lastMonStr).map(r => r.author_name);
        weeklyContent = status.map(s => {
          const done = weeklySubmitted.includes(s.name);
          return `<div style="display:flex;align-items:center;gap:6px;padding:2px 0;font-size:11px"><span style="color:${done?'var(--green)':'var(--red)'}">${done?'✅':'❌'}</span><span>${esc(s.name)}</span></div>`;
        }).join('');
      } catch(e) { weeklyContent = '<div style="font-size:11px;color:var(--text3)">로드 실패</div>'; }
      h += accordion('📊 주간 보고서 (마감)', '', 'var(--yellow)', weeklyContent, true);
    }

    if (isFirstDay && userDoc.show_sales_report !== false) {
      let monthlyContent = '';
      try {
        const monthlyReports = await api('GET','/monthly-reports');
        const lastMonth = new Date(d.getFullYear(), d.getMonth() - 1, 1);
        const lastMonthStr = `${lastMonth.getFullYear()}-${String(lastMonth.getMonth()+1).padStart(2,'0')}`;
        const monthlySubmitted = monthlyReports.filter(r => r.report_month === lastMonthStr).map(r => r.author_name);
        monthlyContent = status.map(s => {
          const done = monthlySubmitted.includes(s.name);
          return `<div style="display:flex;align-items:center;gap:6px;padding:2px 0;font-size:11px"><span style="color:${done?'var(--green)':'var(--red)'}">${done?'✅':'❌'}</span><span>${esc(s.name)}</span></div>`;
        }).join('');
      } catch(e) { monthlyContent = '<div style="font-size:11px;color:var(--text3)">로드 실패</div>'; }
      h += accordion('📊 월간 보고서 (마감)', '', 'var(--blue)', monthlyContent, true);
    }
    commit(h);
  } catch(e) {
    commit('', true);
  }
}

function changeMonth(d) {
  currentMonth += d;
  if (currentMonth > 12) { currentMonth = 1; currentYear++; }
  if (currentMonth < 1) { currentMonth = 12; currentYear--; }
  renderPage();
  fetchEvents().then(() => refreshCalendarUi({ keepScroll: true })).catch(() => {});
}
async function toggleTodo(id) {
  const ev = events.find(e=>e.id===id);
  if(!ev) return;
  const updated = await api('PUT','/events/'+id,{done:!ev.done});
  upsertLocalEvent(updated);
  refreshCalendarUi({ keepScroll: true });
}

function inlineAddTodo(date, cat) {
  // 클릭한 버튼의 부모 요소에서 입력창 추가
  const btn = event.target;
  const parent = btn.closest('div') || btn.parentElement;
  // Create inline input
  const wrapper = document.createElement('div');
  wrapper.className = 'ev-item';
  wrapper.style.padding = '6px 4px';
  wrapper.innerHTML = `<div class="todo-check"></div><input type="text" placeholder="할 일 입력 후 Enter" style="flex:1;background:transparent;border:none;outline:none;color:var(--text);font-size:13px;font-family:inherit" />`;
  parent.insertAdjacentElement('afterend', wrapper);
  const input = wrapper.querySelector('input');
  input.focus();
  async function submit() {
    const title = input.value.trim();
    if(!title) { wrapper.remove(); return; }
    input.disabled = true;
    try {
      const created = normalizeCreatedTodoEventRecord(
        await api('POST','/events',{type:'todo',title,date,todoCat:cat,scope:'personal'}),
        { scope: 'personal', ownerId: currentUser?.uid }
      );
      upsertLocalEvent(created);
      refreshCalendarUi({ keepScroll: true });
    } catch(e) { alert('추가 실패'); wrapper.remove(); }
  }
  // Ignore Enter that is still resolving a Korean IME composition — it
  // fires keydown once to commit the composition and again as the real
  // Enter, which would otherwise POST the same todo twice.
  input.onkeydown = (e) => {
    if (e.key === 'Enter' && !e.isComposing && e.keyCode !== 229) submit();
    if (e.key === 'Escape') wrapper.remove();
  };
  input.onblur = () => setTimeout(()=>{if(!input.disabled) wrapper.remove();},150);
}

// ══════════════════════════════════════════════════════════════
// CHAT PAGE
// ══════════════════════════════════════════════════════════════
function formatChatRoomTimestamp(ts) {
  if (!ts) return '';
  const date = new Date(ts);
  if (Number.isNaN(date.getTime())) return '';
  const now = new Date();
  const sameDay = date.getFullYear() === now.getFullYear() && date.getMonth() === now.getMonth() && date.getDate() === now.getDate();
  if (sameDay) return date.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', hour12: true });
  if (date.getFullYear() === now.getFullYear()) return `${date.getMonth() + 1}/${date.getDate()}`;
  return date.toLocaleDateString('ko-KR');
}

function isMeetingRoom(room) {
  const name = String(room?.name || '');
  return name.startsWith('📅') || name.includes('회의') || name.toLowerCase().includes('meeting');
}

function getChatRoomSubtitle(room) {
  if (!room?.last_message_text) return `멤버 ${room.member_count}명 · 아직 메시지 없음`;
  const sender = room.last_message_sender ? `${room.last_message_sender}: ` : '';
  const preview = `${sender}${room.last_message_text}`.replace(/\s+/g, ' ').trim();
  return preview.length > 60 ? preview.slice(0, 60) + '...' : preview;
}

function getChatRoomActivityTime(room) {
  const time = Date.parse(room?.last_message_at || room?.created_at || '');
  return Number.isNaN(time) ? 0 : time;
}

function sortChatRoomsByActivity(rooms = chatRooms) {
  rooms.sort((left, right) => {
    const timeDiff = getChatRoomActivityTime(right) - getChatRoomActivityTime(left);
    if (timeDiff !== 0) return timeDiff;
    return String(left?.name || '').localeCompare(String(right?.name || ''), 'ko');
  });
  return rooms;
}

function getChatRoomListSignature(rooms = chatRooms, unreadCounts = chatUnreadCounts) {
  return JSON.stringify([
    chatRoomSearchQuery || '',
    chatRoomGroupFilter || '',
    chatBulkMode ? 1 : 0,
    Array.from(selectedChatRoomIds).sort(),
    (chatRoomGroups || []).map(group => [String(group.id || ''), group.name || '', group.color || '', Number(group.room_count || 0)]),
    (rooms || []).map(room => ([
    String(room.id || ''),
    room.name || '',
    room.group_id || '',
    room.group_name || '',
    room.group_color || '',
    room.last_message_at || '',
    room.last_message_sender || '',
    room.last_message_text || '',
    Number(room.member_count || 0),
    room.delete_requested ? 1 : 0,
    Number(unreadCounts?.[room.id] || 0)
    ]))
  ]);
}

function maybeRenderVisibleChatRoomList(options = {}) {
  const body = options.body || document.getElementById('mainBody');
  if (!body || currentPage !== 'chat' || currentRoomId) return false;
  const nextSignature = getChatRoomListSignature();
  if (!options.force && body.dataset.chatRoomListSig === nextSignature) return false;
  renderChatRoomList(body);
  return true;
}

function shouldRefreshVisibleChatRoomCaches() {
  return currentPage === 'chat' && !currentRoomId;
}

function updateCurrentChatRoomIdentity(roomId = currentRoomId) {
  const room = getCurrentChatRoom(roomId);
  if (room && String(room.id) === String(currentRoomId)) {
    const title = document.getElementById('mainTitle');
    if (title) title.textContent = room.name || '💬 채팅';
    syncDocumentTitle({ roomId: room.id });
    syncStandaloneChatWindowUrl(room.id);
    return;
  }
  syncDocumentTitle({ roomId });
}

function getChatMessagePreviewText(message) {
  if (!message) return '';
  if (message.imageUrl || message.image_url) return '사진을 보냈습니다';
  if (message.fileUrl || message.file_url) return message.fileName || message.file_name || '파일을 보냈습니다';
  const text = String(message.text || '');
  if (!text) return '';
  if (text.startsWith('[EVENT_SHARE]')) return '일정을 공유했습니다';
  if (text.startsWith('[NOTICE_SHARE]')) return '공지를 공유했습니다';
  if (text.startsWith('[IDEA_SHARE]')) return '아이디어를 공유했습니다';
  if (text.startsWith('[MEETING_BRIEF]')) return '회의 카드가 업데이트됐습니다';
  if (text.startsWith('[MEETING_ACTION]')) return '액션 아이템이 등록됐습니다';
  if (text.startsWith('[MEETING_ACTION_LINK]')) return '액션 아이템이 등록 처리됐습니다';
  return text.slice(0, 120).trim();
}

function buildChatRoomMessageSnapshot(messages = []) {
  const lastMessage = messages[messages.length - 1];
  if (!lastMessage) {
    return { last_message_at: null, last_message_sender: null, last_message_text: null };
  }
  return {
    last_message_at: lastMessage.createdAt || lastMessage.created_at || null,
    last_message_sender: String(lastMessage.name || '').trim() || null,
    last_message_text: getChatMessagePreviewText(lastMessage) || null
  };
}

function replaceChatRoomsCache(rooms = []) {
  chatRooms = Array.isArray(rooms) ? rooms.slice() : [];
  sortChatRoomsByActivity(chatRooms);
  // Persist room name -> id so the next popup can show the right
  // tab title from the very first paint, before the API round-trip.
  syncChatRoomNameCacheFromList(chatRooms);
  updateCurrentChatRoomIdentity();
  // If we're already inside a chat room and the fresh cache now has
  // the authoritative name, re-sync the title so it doesn't linger
  // on the localStorage fallback (which can be stale).
  if (currentPage === 'chat' && currentRoomId) syncDocumentTitle({ roomId: currentRoomId });
}

function applyChatRoomMetaUpdate(roomId, updates = {}, options = {}) {
  const roomKey = String(roomId || '').trim();
  if (!roomKey) return null;
  const roomIndex = chatRooms.findIndex(room => String(room.id) === roomKey);
  if (roomIndex === -1) return null;
  const currentRoom = chatRooms[roomIndex];
  const changedEntries = Object.entries(updates).filter(([key, value]) => (currentRoom[key] ?? null) !== (value ?? null));
  if (!changedEntries.length) return currentRoom;
  chatRooms[roomIndex] = { ...currentRoom, ...Object.fromEntries(changedEntries) };
  sortChatRoomsByActivity(chatRooms);
  if (String(currentRoomId) === roomKey) updateCurrentChatRoomIdentity(roomKey);
  if (options.renderList !== false) maybeRenderVisibleChatRoomList();
  return chatRooms.find(room => String(room.id) === roomKey) || null;
}

function isStandaloneChatWindow() {
  const params = new URLSearchParams(location.search);
  return params.get('chatWindow') === '1';
}

function getChatRoomWindowUrl(roomId = currentRoomId, standalone = false) {
  const url = new URL(location.pathname, location.origin);
  url.searchParams.set('page', 'chat');
  if (roomId) url.searchParams.set('roomId', String(roomId));
  if (standalone) url.searchParams.set('chatWindow', '1');
  return url.toString();
}

function syncStandaloneChatWindowUrl(roomId = currentRoomId) {
  if (!isStandaloneChatWindow()) return;
  const url = new URL(location.pathname, location.origin);
  url.searchParams.set('page', 'chat');
  url.searchParams.set('chatWindow', '1');
  if (roomId) url.searchParams.set('roomId', String(roomId));
  const historyTitle = currentPage === 'chat' && roomId
    ? getChatRoomBrowserTitle(roomId)
    : document.title || getDefaultBrowserTitle();
  history.replaceState({}, historyTitle, url.pathname + url.search);
}

function buildChatRoomWindowFeatures() {
  const width = Math.min(Math.max(window.innerWidth >= 768 ? 430 : window.innerWidth - 24, 360), 520);
  const height = Math.min(Math.max(window.innerHeight - 48, 620), 920);
  const left = Math.max(0, window.screenX + Math.round((window.outerWidth - width) / 2));
  const top = Math.max(0, window.screenY + Math.max(24, Math.round((window.outerHeight - height) / 2)));
  return `popup=yes,width=${width},height=${height},left=${left},top=${top},resizable=yes,scrollbars=yes`;
}

// ── In-app image viewer ────────────────────────────────────────
// Chat bubbles used to respond to clicks with window.open(url,'_blank'),
// which on some PWAs/mobile browsers replaced the current tab instead
// of creating a new one — closing the image window then closed the
// chat itself. This viewer is a self-contained overlay so the chat
// room underneath stays mounted.
function openImageViewer(url) {
  if (!url) return;
  closeImageViewer();
  const overlay = document.createElement('div');
  overlay.className = 'img-viewer-overlay';
  overlay.id = 'imgViewerOverlay';
  overlay.setAttribute('role', 'dialog');
  overlay.setAttribute('aria-label', '이미지 보기');
  overlay.innerHTML = `
    <button class="img-viewer-close" onclick="closeImageViewer()" aria-label="닫기">✕</button>
    <img src="${url}" alt="">
  `;
  // Click on the dim backdrop (but not the image itself) closes too.
  overlay.addEventListener('click', (ev) => {
    if (ev.target === overlay) closeImageViewer();
  });
  document.body.appendChild(overlay);
  // Esc closes. One-shot listener keyed to this overlay so stacking
  // doesn't leave stray handlers behind.
  const onKey = (ev) => {
    if (ev.key === 'Escape') {
      ev.preventDefault();
      closeImageViewer();
    }
  };
  overlay._escHandler = onKey;
  document.addEventListener('keydown', onKey);
}

function closeImageViewer() {
  const overlay = document.getElementById('imgViewerOverlay');
  if (!overlay) return;
  if (overlay._escHandler) document.removeEventListener('keydown', overlay._escHandler);
  overlay.remove();
}

// ── Chat in-room message search ───────────────────────────────
// Simple find-in-page over the currently-rendered messages, modelled
// on KakaoTalk's 대화내용 검색 bar: live-filter while typing, ↑/↓
// nav, close with ✕ or Esc. Matches are recomputed on every input so
// the counter stays in sync with new messages streaming in while the
// search bar is open. All state resets when the room unmounts.
let chatSearchMatches = [];
let chatSearchIndex = -1;
let chatSearchQuery = '';

function toggleChatSearchBar() {
  const bar = document.getElementById('chatSearchBar');
  if (!bar) return;
  if (bar.style.display === 'none') {
    bar.style.display = '';
    const input = document.getElementById('chatSearchInput');
    input?.focus();
    input?.select();
  } else {
    closeChatSearchBar();
  }
}

function closeChatSearchBar() {
  const bar = document.getElementById('chatSearchBar');
  if (bar) bar.style.display = 'none';
  const input = document.getElementById('chatSearchInput');
  if (input) input.value = '';
  chatSearchQuery = '';
  clearChatSearchHits();
}

function clearChatSearchHits() {
  document.querySelectorAll('#chatMsgs .msg-bubble.chat-search-hit')
    .forEach(el => el.classList.remove('chat-search-hit', 'chat-search-hit-active'));
  chatSearchMatches = [];
  chatSearchIndex = -1;
  updateChatSearchCount();
}

function onChatSearchInput(value) {
  chatSearchQuery = (value || '').trim().toLowerCase();
  runChatSearch();
}

function runChatSearch() {
  clearChatSearchHits();
  if (!chatSearchQuery) return;
  const container = document.getElementById('chatMsgs');
  if (!container) return;
  const bubbles = container.querySelectorAll('.msg-bubble');
  const hits = [];
  bubbles.forEach(el => {
    const text = (el.textContent || '').toLowerCase();
    if (text.includes(chatSearchQuery)) {
      el.classList.add('chat-search-hit');
      hits.push(el);
    }
  });
  chatSearchMatches = hits;
  if (!hits.length) {
    updateChatSearchCount();
    return;
  }
  // Start from the last match — users almost always want to look at
  // the most recent hit first, same as KakaoTalk's default cursor.
  chatSearchIndex = hits.length - 1;
  focusChatSearchMatch();
}

function chatSearchNav(direction) {
  if (!chatSearchMatches.length) return;
  const n = chatSearchMatches.length;
  chatSearchIndex = ((chatSearchIndex + direction) % n + n) % n;
  focusChatSearchMatch();
}

function focusChatSearchMatch() {
  document.querySelectorAll('#chatMsgs .msg-bubble.chat-search-hit-active')
    .forEach(el => el.classList.remove('chat-search-hit-active'));
  const el = chatSearchMatches[chatSearchIndex];
  if (!el) return updateChatSearchCount();
  el.classList.add('chat-search-hit-active');
  el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  updateChatSearchCount();
}

function updateChatSearchCount() {
  const counter = document.getElementById('chatSearchCount');
  const prev = document.getElementById('chatSearchPrev');
  const next = document.getElementById('chatSearchNext');
  if (!counter) return;
  const n = chatSearchMatches.length;
  const idx = chatSearchIndex >= 0 ? chatSearchIndex + 1 : 0;
  counter.textContent = n ? `${idx} / ${n}` : '0 / 0';
  if (prev) prev.disabled = n < 2;
  if (next) next.disabled = n < 2;
}

function handleChatSearchKeydown(event) {
  if (event.isComposing || event.keyCode === 229) return;
  if (event.key === 'Escape') { event.preventDefault(); closeChatSearchBar(); return; }
  if (event.key === 'Enter') {
    event.preventDefault();
    chatSearchNav(event.shiftKey ? -1 : 1);
  }
}

// Ctrl+F / Cmd+F anywhere inside a chat room opens the 대화내용 검색
// bar and focuses its input, matching the built-in find-in-page
// shortcut users expect. The native browser find is preempted only
// while a chat room is active — on other pages the browser's own
// find still works normally.
function handleGlobalChatSearchShortcut(event) {
  if (event.key !== 'f' && event.key !== 'F') return;
  if (!(event.metaKey || event.ctrlKey)) return;
  if (event.altKey || event.shiftKey) return;
  if (currentPage !== 'chat' || !currentRoomId) return;
  const bar = document.getElementById('chatSearchBar');
  if (!bar) return;
  event.preventDefault();
  if (bar.style.display === 'none') bar.style.display = '';
  const input = document.getElementById('chatSearchInput');
  input?.focus();
  input?.select();
}
document.addEventListener('keydown', handleGlobalChatSearchShortcut);

// Track popups this tab has opened, keyed by roomId, so clicking the
// same room twice in a row focuses the existing window instead of
// spawning a second one. The DOM-level window.open({name}) spec is
// supposed to do this on its own but Chrome/Safari frequently ignore
// it when the popup was opened from a different tab or the COOP
// policy differs, so we keep our own map as the authoritative answer.
const openChatPopups = new Map();
function openChatRoomInWindow(roomId = currentRoomId) {
  const roomKey = String(roomId || '').trim();
  if (!roomKey) return;
  const existing = openChatPopups.get(roomKey);
  if (existing && !existing.closed) {
    try { existing.focus(); return; } catch (_) { /* fall through to reopen */ }
  }
  const url = getChatRoomWindowUrl(roomKey, true);
  const popup = window.open(url, 'peak_chat_room_' + roomKey, buildChatRoomWindowFeatures());
  if (popup) {
    openChatPopups.set(roomKey, popup);
    try { popup.focus(); } catch(e) {}
    return;
  }
  const fallback = window.open(url, '_blank', 'noopener,noreferrer');
  if (fallback) openChatPopups.set(roomKey, fallback);
  if (!fallback) alert('팝업이 차단되어 채팅방을 새 창으로 열지 못했습니다. 브라우저 팝업 허용 후 다시 시도해주세요.');
}

async function openChatRoomById(roomId) {
  const roomKey = String(roomId || '').trim();
  if (!roomKey) return;
  if (shouldOpenChatRoomInWindow()) {
    openChatRoomInWindow(roomKey);
    return;
  }
  let room = chatRooms.find(r => String(r.id) === roomKey);
  if (!room) {
    await refreshChatRoomCaches();
    room = chatRooms.find(r => String(r.id) === roomKey);
  }
  if (!room) {
    alert('채팅방을 찾을 수 없습니다.');
    return;
  }
  if (currentPage !== 'chat') navTo('chat');
  enterRoom(String(room.id), room.name);
}

function updateChatRoomSearch(value) {
  if (chatRoomSearchComposing) return;
  chatRoomSearchQuery = value;
  const body = document.getElementById('mainBody');
  if (body && currentPage === 'chat' && !currentRoomId) renderChatRoomListResultsOnly(body);
}

function handleChatRoomSearchCompositionStart() {
  chatRoomSearchComposing = true;
}

function handleChatRoomSearchCompositionEnd(input) {
  chatRoomSearchComposing = false;
  updateChatRoomSearch(input?.value || '');
}

const HANGUL_INITIALS = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
function compactSearchText(value) {
  return String(value || '')
    .normalize('NFKC')
    .toLowerCase()
    .replace(/[\u200B-\u200D\uFEFF]/g, '')
    .replace(/[\s._\-()[\]{}|/\\,;:'"`~!@#$%^&*+=?<>·…]+/g, '');
}
function getHangulInitialText(value) {
  return Array.from(String(value || '')).map(ch => {
    const code = ch.charCodeAt(0);
    if (code >= 0xAC00 && code <= 0xD7A3) {
      return HANGUL_INITIALS[Math.floor((code - 0xAC00) / 588)] || ch;
    }
    return ch;
  }).join('');
}
function getChatSearchVariants(value) {
  const raw = String(value || '');
  const compact = compactSearchText(raw);
  const initials = compactSearchText(getHangulInitialText(raw));
  return [compact, initials].filter(Boolean);
}
function isChatSearchMatch(source, query) {
  const queryVariants = getChatSearchVariants(query);
  if (!queryVariants.length) return true;
  const sourceVariants = getChatSearchVariants(source);
  return queryVariants.some(q => sourceVariants.some(s => s.includes(q)));
}

function getRoomGroupKey(room) {
  return room?.group_id ? String(room.group_id) : 'ungrouped';
}

function getRoomGroupMeta(groupId) {
  if (groupId === 'ungrouped') return { id: 'ungrouped', name: '미분류', color: 'var(--text3)' };
  return chatRoomGroups.find(group => String(group.id) === String(groupId)) || { id: groupId, name: '그룹 없음', color: 'var(--text3)' };
}

function setChatRoomGroupFilter(groupId) {
  chatRoomGroupFilter = groupId || 'all';
  const body = document.getElementById('mainBody');
  if (body && currentPage === 'chat' && !currentRoomId) renderChatRoomList(body);
}

function canManageChatRoomGroupsClient() {
  return isAdmin || userDoc?.role === 'manager' || !!userDoc?.can_manage_team;
}

function buildDefaultMeetingRoomName() {
  const now = new Date();
  return `📅 ${now.getMonth() + 1}/${now.getDate()} 회의`;
}

let lastChatRoomsFetchAt = 0;
async function refreshChatRoomCaches(options = {}) {
  const skipUnread = !!options.skipUnread;
  // Hit both endpoints in parallel. The old code awaited them one
  // after another which doubled the user-perceived latency of the
  // "채팅" tab (each click triggered a full refetch).
  const [nextRooms, nextUnreadCounts, nextGroups] = await Promise.all([
    api('GET', '/chat-rooms').catch(() => []),
    skipUnread ? Promise.resolve(chatUnreadCounts) : api('GET', '/chat-rooms/unread').catch(() => ({})),
    api('GET', '/chat-room-groups').catch(() => ({ groups: [] })),
  ]);
  replaceChatRoomsCache(nextRooms);
  if (!skipUnread) chatUnreadCounts = nextUnreadCounts && typeof nextUnreadCounts === 'object' ? nextUnreadCounts : {};
  chatRoomGroups = Array.isArray(nextGroups?.groups) ? nextGroups.groups : [];
  lastChatRoomsFetchAt = Date.now();
}

function getCurrentChatRoom(roomId = currentRoomId) {
  return chatRooms.find(r => String(r.id) === String(roomId));
}

function canManageChatRoom(room) {
  return !!room && (room.creator_id === currentUser.uid || isAdmin);
}

async function loadRoomMembers(roomId = currentRoomId, force = false) {
  const key = String(roomId || '');
  if (!key) return [];
  if (!force && roomMemberCache[key]) return roomMemberCache[key];
  const members = await api('GET', '/chat-rooms/' + roomId + '/members');
  roomMemberCache[key] = members;
  return members;
}

function parseStructuredChatPayload(prefix, text) {
  if (!text || !text.startsWith(prefix)) return null;
  try { return JSON.parse(text.slice(prefix.length)); } catch(e) { return null; }
}

function getMeetingRoomData(msgs = currentChatMessages) {
  if (msgs === currentChatMessages && currentMeetingRoomDataSignature === currentChatVisualSignature) {
    return currentMeetingRoomData;
  }

  let brief = null;
  const actions = [];
  const links = {};

  msgs.forEach(msg => {
    const briefPayload = parseStructuredChatPayload('[MEETING_BRIEF]', msg.text);
    if (briefPayload) {
      brief = { ...briefPayload, msgId: msg.id, updatedBy: msg.name, updatedAt: msg.createdAt };
      return;
    }

    const actionPayload = parseStructuredChatPayload('[MEETING_ACTION]', msg.text);
    if (actionPayload) {
      actions.push({ ...actionPayload, msgId: msg.id, createdBy: msg.name, createdAt: msg.createdAt });
      return;
    }

    const linkPayload = parseStructuredChatPayload('[MEETING_ACTION_LINK]', msg.text);
    if (linkPayload) {
      const key = String(linkPayload.actionMsgId);
      if (!links[key]) links[key] = [];
      links[key].push({ ...linkPayload, msgId: msg.id, createdBy: msg.name, createdAt: msg.createdAt });
    }
  });

  const data = {
    brief,
    actions: actions
      .sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt))
      .map(action => ({
        ...action,
        conversions: (links[String(action.msgId)] || []).sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt))
      }))
  };

  if (msgs === currentChatMessages) {
    currentMeetingRoomData = data;
    currentMeetingRoomDataSignature = currentChatVisualSignature;
  }

  return data;
}

function scheduleMeetingRoomPanelRender() {
  const renderSeq = ++chatMeetingPanelRenderSeq;
  const run = () => {
    if (renderSeq !== chatMeetingPanelRenderSeq) return;
    renderMeetingRoomPanel();
    if (chatShouldStickToBottom) {
      scrollChatToBottom('auto');
      queueChatBottomSnap('auto');
    }
  };
  if (isMobileDevice()) {
    setTimeout(run, 0);
    return;
  }
  requestAnimationFrame(run);
}

function getMeetingActionById(actionMessageId) {
  const meetingData = getMeetingRoomData();
  return meetingData.actions.find(action => String(action.msgId) === String(actionMessageId)) || null;
}

function formatMeetingDateLabel(date, time = '') {
  if (!date) return '날짜 미정';
  const parsed = new Date(date);
  const label = Number.isNaN(parsed.getTime()) ? date : `${parsed.getMonth() + 1}/${parsed.getDate()}`;
  return time ? `${label} ${time}` : label;
}

function renderMeetingRoomPanel() {
  const panel = document.getElementById('chatMeetingPanel');
  const room = getCurrentChatRoom();
  if (!panel) return;
  if (!room || !isMeetingRoom(room)) {
    panel.style.display = 'none';
    panel.innerHTML = '';
    return;
  }

  const canManage = canManageChatRoom(room);
  const meetingData = getMeetingRoomData();
  const brief = meetingData.brief || {};
  const meta = meetingData.brief
    ? `${brief.updatedBy || '누군가'} · ${formatChatRoomTimestamp(brief.updatedAt) || '방금'}`
    : '아직 회의 카드가 없습니다';

function renderChatRoomList(body) {
  if (!body) return;
  const canOpenNewWindow = !isMobileDevice();
  const controlsHtml = `<div class="chat-list-shell"><div style="margin-bottom:12px">
    <input class="form-input" id="chatRoomSearchInput" value="${esc(chatRoomSearchQuery)}"
      oncompositionstart="handleChatRoomSearchCompositionStart()"
      oncompositionend="handleChatRoomSearchCompositionEnd(this)"
      oninput="updateChatRoomSearch(this.value)"
      placeholder="채팅방, 최근 메시지 검색">
  </div>
  <div id="chatBulkToolbar">${renderChatBulkToolbar()}</div>
  <div id="chatRoomGroupTabs">${renderChatRoomGroupTabs()}</div>
  <div id="chatRoomListResults">${renderChatRoomListResults({ canOpenNewWindow })}</div></div>`;
  const inputIsActive = document.activeElement?.id === 'chatRoomSearchInput';
  const hasStableShell = !!body.querySelector('#chatRoomSearchInput') && !!body.querySelector('#chatRoomListResults');

  if (hasStableShell && (inputIsActive || chatRoomSearchComposing)) {
    const bulkToolbar = body.querySelector('#chatBulkToolbar');
    const tabs = body.querySelector('#chatRoomGroupTabs');
    const results = body.querySelector('#chatRoomListResults');
    if (bulkToolbar) bulkToolbar.innerHTML = renderChatBulkToolbar();
    if (tabs) tabs.innerHTML = renderChatRoomGroupTabs();
    if (results) results.innerHTML = renderChatRoomListResults({ canOpenNewWindow });
    body.dataset.chatRoomListSig = getChatRoomListSignature();
    return;
  }

  body.innerHTML = controlsHtml;
  body.dataset.chatRoomListSig = getChatRoomListSignature();
}

function getFilteredChatRoomsForList() {
  const query = chatRoomSearchQuery.trim();
  return chatRooms.filter(room => {
    if (chatRoomGroupFilter === 'ungrouped' && room.group_id) return false;
    if (chatRoomGroupFilter !== 'all' && chatRoomGroupFilter !== 'ungrouped' && String(room.group_id || '') !== String(chatRoomGroupFilter)) return false;
    if (!query) return true;
    const searchSource = [room.name, room.last_message_text, room.last_message_sender].filter(Boolean).join(' ');
    return isChatSearchMatch(searchSource, query);
  });
}

function renderChatRoomListResults(options = {}) {
  const filteredRooms = sortChatRoomsByActivity(getFilteredChatRoomsForList().slice());
  const query = chatRoomSearchQuery.trim();
  const canOpenNewWindow = !!options.canOpenNewWindow;
  if (!chatRooms.length) {
    return '<div style="color:var(--text3);text-align:center;padding:60px 0;font-size:13px">채팅방이 없습니다.<br>일반방이나 회의방을 바로 만들어보세요.</div>';
  }
  if (!filteredRooms.length) {
    return '<div style="color:var(--text3);text-align:center;padding:40px 0;font-size:13px">검색 결과가 없습니다.</div>';
  }
  return filteredRooms.map(r => renderChatRoomListItem(r, { canOpenNewWindow })).join('');
}

function renderChatRoomListResultsOnly(body = document.getElementById('mainBody')) {
  if (!body) return;
  const bulkToolbar = body.querySelector('#chatBulkToolbar');
  const results = body.querySelector('#chatRoomListResults');
  if (bulkToolbar) bulkToolbar.innerHTML = renderChatBulkToolbar();
  if (!results) return renderChatRoomList(body);
  results.innerHTML = renderChatRoomListResults({ canOpenNewWindow: !isMobileDevice() });
  body.dataset.chatRoomListSig = getChatRoomListSignature();
}

function getSelectedChatRoomIds() {
  return Array.from(selectedChatRoomIds).filter(roomId => chatRooms.some(room => String(room.id) === String(roomId)));
}

function toggleChatBulkMode(force) {
  chatBulkMode = typeof force === 'boolean' ? force : !chatBulkMode;
  if (!chatBulkMode) selectedChatRoomIds.clear();
  renderChatRoomList(document.getElementById('mainBody'));
}

function toggleChatRoomBulkSelection(roomId) {
  const id = String(roomId);
  if (selectedChatRoomIds.has(id)) selectedChatRoomIds.delete(id);
  else selectedChatRoomIds.add(id);
  renderChatRoomListResultsOnly();
}

function selectAllVisibleChatRooms() {
  getFilteredChatRoomsForList().forEach(room => selectedChatRoomIds.add(String(room.id)));
  renderChatRoomListResultsOnly();
}

function clearChatRoomBulkSelection() {
  selectedChatRoomIds.clear();
  renderChatRoomListResultsOnly();
}

function renderChatRoomGroupTabs() {

  const tabs = [
    { id: 'all', name: '전체', count: chatRooms.length, color: 'var(--red)' },
    ...chatRoomGroups.map(group => ({ id: String(group.id), name: group.name, count: Number(group.room_count || 0), color: group.color || 'var(--blue)' })),
    { id: 'ungrouped', name: '미분류', count: ungroupedCount, color: 'var(--text3)' },
  ];
  return `<div style="display:flex;align-items:center;gap:8px;margin-bottom:14px;overflow-x:auto;padding-bottom:2px">
    ${tabs.map(tab => `<button class="sub-tab ${chatRoomGroupFilter===tab.id?'active':''}" onclick="setChatRoomGroupFilter('${esc(tab.id)}')" style="white-space:nowrap;${chatRoomGroupFilter===tab.id ? `background:${esc(tab.color)};color:#fff` : ''}">${esc(tab.name)} ${tab.count ? `<span style="opacity:.8">${tab.count}</span>` : ''}</button>`).join('')}

function renderGroupedChatRoomList(rooms, options = {}) {
  const byGroup = new Map();
  rooms.forEach(room => {
    const key = getRoomGroupKey(room);
    if (!byGroup.has(key)) byGroup.set(key, []);
    byGroup.get(key).push(room);
  });
  const orderedGroups = [
    ...chatRoomGroups.map(group => String(group.id)).filter(groupId => byGroup.has(groupId)),
    ...(byGroup.has('ungrouped') ? ['ungrouped'] : [])
  ];
  return orderedGroups.map(groupId => {
    const meta = getRoomGroupMeta(groupId);
    const groupRooms = byGroup.get(groupId) || [];
    return `<div style="margin-bottom:16px">
      <div style="display:flex;align-items:center;gap:8px;margin:4px 0 8px;color:var(--text2);font-size:12px;font-weight:800">
        <span style="width:9px;height:9px;border-radius:50%;background:${esc(meta.color || 'var(--text3)')};display:inline-block"></span>
        <span>${esc(meta.name)}</span>
        <span style="color:var(--text3);font-weight:600">${groupRooms.length}</span>
      </div>
      ${groupRooms.map(room => renderChatRoomListItem(room, options)).join('')}
    </div>`;
  }).join('');
}

async function renderChatPage(body, right) {
  const isActiveRender = createPageRenderGuard('chat', body);
  setChatRoomLayoutActive(!!currentRoomId);
  if (currentRoomId) {
    renderChatRoom(body, right);
    return;
  }
  const deepLink = getDeepLinkState();
  const requestedRoomId = deepLink.page === 'chat' && deepLink.roomId ? String(deepLink.roomId) : '';
  if (requestedRoomId) {
    let room = chatRooms.find(r => String(r.id) === requestedRoomId);
    if (!room) await refreshChatRoomCaches();
    if (!isActiveRender()) return;
    room = chatRooms.find(r => String(r.id) === requestedRoomId);
    if (room) {
      enterRoom(String(room.id), room.name);
      return;
    }
  }
  right.innerHTML = `<div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end">
    ${canManageChatRoomGroupsClient() ? `<button onclick="openChatRoomGroupManager()" style="background:var(--bg3);border:none;border-radius:8px;padding:6px 10px;color:var(--text2);font-size:12px;font-weight:600;cursor:pointer">그룹</button>` : ''}
    <button onclick="openCreateRoom('meeting')" style="background:var(--bg3);border:1px solid var(--blue);border-radius:8px;padding:6px 10px;color:var(--blue);font-size:12px;font-weight:600;cursor:pointer">📅 회의방</button>
    <button onclick="openCreateRoom()" style="background:var(--red);border:none;border-radius:8px;padding:6px 12px;color:#fff;font-size:12px;font-weight:600;cursor:pointer">+ 새 방</button>
  </div>`;
  // Stale-while-revalidate: if we already have chat rooms cached
  // (from boot or a prior visit), render instantly and refresh in
  // the background. Every tap on the 채팅 tab used to block on two
  // sequential API calls before showing the already-known list.
  if (chatRooms.length > 0) {
    renderChatRoomList(body);
    refreshChatRoomCaches().then(() => {
      if (!isActiveRender() || currentRoomId) return;
      maybeRenderVisibleChatRoomList({ body });
    }).catch(() => {});
    return;
  }
  await refreshChatRoomCaches();
  if (!isActiveRender()) return;
  if (currentRoomId) {
    renderChatRoom(body, right);
    return;
  }
  renderChatRoomList(body);
}

async function enterRoom(roomId, roomName) {
  if (currentRoomId && String(currentRoomId) !== String(roomId)) stopChatTyping();
  currentRoomId = roomId;
  chatShouldStickToBottom = true;
  chatSelectedMentions.clear();
  hideChatMentionMenu();
  currentChatVisualSignature = '';
  currentChatMessages = [];
  document.getElementById('mainTitle').textContent = roomName;
  // Keep localStorage cache fresh so a sibling popup for this same

  const body = document.getElementById('mainBody');

  renderChatRoom(body, right);
  if (chatPollId) clearInterval(chatPollId);
  chatPollId = setInterval(fetchRoomMessages, 3000);
}

async function fetchRoomMessages() {
  if (!currentRoomId) return;
  try {
    const roomId = currentRoomId;
    const previousUnreadCounts = new Map(currentChatMessages.map(msg => [msg.id, msg.unreadCount || 0]));
    const data = await api('GET', '/chat-rooms/'+currentRoomId+'/messages');
    if (roomId !== currentRoomId) return;
    const msgs = data.map(m => ({
      id:m.id,
      text:m.text,
      uid:m.uid,
      name:m.name,
      photoURL:m.photo_url,
      imageUrl:m.image_url,
      fileUrl:m.file_url,
      fileName:m.file_name,
      createdAt:m.created_at,
      unreadCount: previousUnreadCounts.get(m.id) || 0
    }));
    applyChatRoomMetaUpdate(roomId, buildChatRoomMessageSnapshot(msgs), { renderList: false });
    const nextVisualSignature = getChatVisualSignature(msgs);
    const shouldRenderChat = nextVisualSignature !== currentChatVisualSignature;
    currentChatMessages = msgs;
    if (shouldRenderChat) {
      currentMeetingRoomDataSignature = '';
      currentChatVisualSignature = nextVisualSignature;
      renderChatMessages(msgs);
      scheduleMeetingRoomPanelRender();
    }

    const unreadRefreshSeq = ++chatUnreadRefreshSeq;
    api('GET','/chat-rooms/'+roomId+'/unread-counts').then(unreadCounts => {
      if (roomId !== currentRoomId || unreadRefreshSeq !== chatUnreadRefreshSeq) return;
      let hasChanges = false;
      currentChatMessages = currentChatMessages.map(msg => {
        const nextCount = unreadCounts[msg.id] || 0;
        if ((msg.unreadCount || 0) === nextCount) return msg;
        hasChanges = true;
        return { ...msg, unreadCount: nextCount };
      });
      if (hasChanges && !applyChatUnreadCounts(unreadCounts)) renderChatMessages(currentChatMessages);
    }).catch(() => {});

    if (msgs.length) {
      if (Number(chatUnreadCounts[roomId] || 0) !== 0) chatUnreadCounts = { ...chatUnreadCounts, [roomId]: 0 };
      api('POST','/chat-rooms/'+currentRoomId+'/read',{lastMsgId:msgs[msgs.length-1].id}).catch(()=>{});
    }
  } catch(e) {}
}

function renderChatMessages(msgs) {
  const container = document.getElementById('chatMsgs');
  if (!container) return;
  chatDeferredHistoryRenderSeq += 1;
  container.style.justifyContent = 'flex-start';
  const prevScrollTop = container.scrollTop;
  const prevScrollHeight = container.scrollHeight;
  const shouldSnap = chatShouldStickToBottom || !container.dataset.rendered || isChatNearBottom(container);
  if (!msgs.length) {
    container.innerHTML = '<div style="color:var(--text3);text-align:center;padding:40px 0;font-size:13px">메시지를 시작하세요!</div>';
    container.dataset.rendered = '1';
    chatShouldStickToBottom = true;
    return;
  }
  const shouldDeferHistoryRender = isMobileDevice() && shouldSnap && msgs.length > MOBILE_CHAT_INITIAL_RENDER_COUNT;
  const visibleStartIndex = shouldDeferHistoryRender ? Math.max(0, msgs.length - MOBILE_CHAT_INITIAL_RENDER_COUNT) : 0;
  const renderMsgs = msgs.slice(visibleStartIndex);
  const previousDateStr = visibleStartIndex > 0 ? getChatMessageDateLabel(msgs[visibleStartIndex - 1].createdAt) : '';
  container.innerHTML = buildChatMessagesHtml(renderMsgs, previousDateStr).html;
  container.dataset.rendered = '1';
  bindChatScrollTracking();
  bindChatMediaLoadHandlers(container);
  syncChatStackAlignment(container);
  // Bubbles just got rebuilt; if a search is active, re-tag matches
  // against the fresh DOM so new messages are searchable too.
  if (chatSearchQuery) runChatSearch();
  if (shouldSnap) {
    chatShouldStickToBottom = true;
    scrollChatToBottom('auto');
    queueChatBottomSnap('auto');
  } else {
    container.scrollTop = Math.max(0, prevScrollTop + (container.scrollHeight - prevScrollHeight));
  }
  if (shouldDeferHistoryRender) scheduleDeferredChatHistoryRender(container, msgs, visibleStartIndex, shouldSnap);
}

let _sendingMsg = false;
async function sendMsg() {
  if(!currentRoomId || _sendingMsg) return;
  const input = document.getElementById('chatInput');
  if (!input) return;
  clearTimeout(chatSendRequestTimer);
  chatSendRequestTimer = null;
  chatSendQueuedAfterComposition = false;
  const rawText = input.value;
  const text = rawText.trim();
  const mentionUserIds = Array.from(chatSelectedMentions.entries())
    .filter(([, member]) => text.includes(member.token))
    .map(([uid]) => uid);
  const pendingAttachment = chatPendingAttachment;
  if (!text && !pendingAttachment) return;
  _sendingMsg = true;
  chatShouldStickToBottom = true;
  // 즉시 비우기
  input.value = '';
  input.style.height = 'auto';
  hideChatMentionMenu();
  sendChatTypingSignal(false);
  // IME 조합 중인 글자 강제 초기화
  input.dispatchEvent(new Event('compositionend'));
  setTimeout(() => { input.value = ''; }, 0);
  let attachmentUploaded = false;
  try {
    if (pendingAttachment) {
      await uploadChatAttachment(pendingAttachment.file, { fileName: pendingAttachment.fileName, refreshAfterUpload: false });
      attachmentUploaded = true;
      clearChatPendingAttachment({ suppressSnap: true });
    }
    if (text) {
      await api('POST','/chat-rooms/'+currentRoomId+'/messages',{text, mentionUserIds});
    }
    chatSelectedMentions.clear();
    await fetchRoomMessages();
    queueChatBottomSnap('auto');
  } catch(e) {
    input.value = rawText;
    handleChatInputInput(input);
    if (!attachmentUploaded && pendingAttachment && !chatPendingAttachment) {
      setChatPendingAttachment(pendingAttachment.file, { fileName: pendingAttachment.fileName, focusInput: false, suppressSnap: true });
    }
    alert(e.message || '전송 실패');
  }
  _sendingMsg = false;
}

async function uploadChatAttachment(file, options = {}) {
  if (!currentRoomId || !file) return false;
  const isImage = /^image\/(png|jpe?g|gif|webp)$/i.test(file.type || '');
  chatShouldStickToBottom = true;
  const fd = new FormData();
  fd.append(isImage ? 'image' : 'file', file, options.fileName || file.name || `upload-${Date.now()}`);
  const token = await currentUser.getIdToken();
  const res = await fetch('/api/chat-rooms/' + currentRoomId + (isImage ? '/upload' : '/upload-file'), {
    method: 'POST',
    headers: { 'Authorization': 'Bearer ' + token },
    body: fd
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.error || '업로드 실패');
  }
  if (options.refreshAfterUpload !== false) {
    await fetchRoomMessages();
    queueChatBottomSnap('auto');
  }
  return true;
}

async function uploadFile(input) {
  if(!currentRoomId||!input.files[0]) return;
  const file = input.files[0];
  input.value='';
  try {
    await uploadChatAttachment(file);
  } catch (e) {
    alert(e.message || '업로드 실패');
  }
}

async function handleChatInputPaste(event) {
  const clipboardItems = Array.from(event?.clipboardData?.items || []);
  if (!clipboardItems.length || !currentRoomId) return;
  const imageItem = clipboardItems.find(item => item.kind === 'file' && /^image\//i.test(item.type || ''));
  if (!imageItem) return;
  const pastedFile = imageItem.getAsFile();
  if (!pastedFile) return;
  event.preventDefault();
  const fileExt = ((pastedFile.type || 'image/png').split('/')[1] || 'png').replace('jpeg', 'jpg');
  const uploadFileName = pastedFile.name || `chat-capture-${Date.now()}.${fileExt}`;
  setChatPendingAttachment(pastedFile, { fileName: uploadFileName });
}

async function submitMeetingActionConvert(actionMessageId, targetType) {
  const title = document.getElementById('meetingConvertTitle')?.value?.trim() || '';
  const assigneeUid = document.getElementById('meetingConvertAssignee')?.value || '';
  const date = document.getElementById('meetingConvertDate')?.value || '';
  const time = targetType === 'meeting' ? (document.getElementById('meetingConvertTime')?.value || '') : '';
  const note = document.getElementById('meetingConvertNote')?.value?.trim() || '';
  if (!title) return alert('제목을 입력하세요');
  if (!assigneeUid) return alert('담당자를 선택하세요');
  if (!date) return alert('날짜를 선택하세요');
  await api('POST', '/chat-rooms/' + currentRoomId + '/action-items/convert', {
    actionMessageId,
    title,
    assigneeUid,
    date,
    time,
    note,
    targetType
  });
  closeModal();
  await fetchEvents();
  await fetchRoomMessages();
  alert(targetType === 'todo' ? '할 일로 등록했습니다.' : '일정으로 등록했습니다.');
}

function filterRoomMemberCandidates(query) {
  document.querySelectorAll('.room-member-candidate').forEach(el => {

    api('GET', '/users/all-approved')

  let h = `<div class="modal-title">👥 ${esc(room.name)}</div>
    <div style="font-size:12px;color:var(--text3);margin-bottom:12px">카카오톡 방 정보처럼 멤버 확인, 초대, 제외를 한 곳에서 관리합니다. 현재 멤버 ${members.length}명</div>
    <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:14px">${members.map(member => `<div class="room-item" style="background:var(--bg3);padding:10px;cursor:default">
      <div class="room-avatar">${member.photo_url ? `<img src="${esc(member.photo_url)}" referrerpolicy="no-referrer" style="width:100%;height:100%;object-fit:cover">` : '👤'}</div>
      <div style="flex:1;min-width:0">
        <div style="font-size:13px;font-weight:600">${esc(member.name || member.email)}${member.is_creator ? ' · 방장' : ''}${String(member.uid) === String(currentUser.uid) ? ' · 나' : ''}</div>
        <div style="font-size:10px;color:var(--text3);margin-top:2px">${esc(member.email || '')}</div>
      </div>
      ${canManage && !member.is_creator && String(member.uid) !== String(currentUser.uid)
        ? `<button onclick="removeRoomMember('${roomId}','${member.uid}')" style="padding:6px 10px;border-radius:999px;border:none;background:rgba(255,107,95,0.13);color:var(--red);font-size:10px;font-weight:700;cursor:pointer;font-family:inherit">제외</button>`

    </div>`).join('')}</div>`;

  if (canManage) {
    h += `<div style="padding-top:4px;border-top:1px solid var(--border)">
      <div style="font-size:12px;font-weight:700;margin-bottom:8px">초대 가능한 멤버</div>
      <input class="form-input" placeholder="이름 또는 초성 검색" oninput="filterRoomMemberCandidates(this.value)" style="margin-bottom:8px">
      <div style="display:flex;flex-direction:column;gap:8px;max-height:240px;overflow-y:auto">${candidates.length ? candidates.map(user => `<div class="room-item room-member-candidate" data-name="${esc([user.name, user.email].filter(Boolean).join(' '))}" style="background:var(--bg3);padding:10px;cursor:default">
        <div class="room-avatar">👤</div>
        <div style="flex:1;min-width:0">
          <div style="font-size:13px;font-weight:600">${esc(user.name || user.email)}</div>
          <div style="font-size:10px;color:var(--text3);margin-top:2px">${esc(user.email || '')}</div>
        </div>
        <button onclick="addRoomMember('${roomId}','${user.uid}')" style="padding:6px 10px;border-radius:999px;border:none;background:rgba(90,167,255,0.14);color:var(--blue);font-size:10px;font-weight:700;cursor:pointer;font-family:inherit">초대</button>
      </div>`).join('') : `<div style="font-size:11px;color:var(--text3);padding:10px 0">추가로 초대할 수 있는 멤버가 없습니다.</div>`}</div>

async function leaveChatRoom(roomId = currentRoomId) {
  if (!confirm('채팅방을 나가시겠습니까?')) return;
  await api('POST','/chat-rooms/'+roomId+'/leave');
  closeModal();
  chatRooms = chatRooms.filter(r => String(r.id) !== String(roomId));
  delete chatUnreadCounts[roomId];
  if (String(currentRoomId) === String(roomId)) {
    exitRoom();
    return;
  }
  renderChatRoomList(document.getElementById('mainBody'));
}

async function requestDeleteRoom(roomId = currentRoomId) {

  await api('POST','/chat-rooms/'+roomId+'/request-delete');
  const room = chatRooms.find(r => String(r.id) === String(roomId));
  if (room) room.delete_requested = true;
  closeModal();
  renderPage(true);
  alert('삭제 요청이 전송되었습니다. 관리자 승인 후 삭제됩니다.');
}

async function adminDeleteRoom(roomId = currentRoomId) {

async function createRoom(mode = 'general') {
  const rawName = document.getElementById('newRoomName').value.trim();

let reportSubTab = 'daily';
async function renderReportPage(body, right) {
  const isActiveRender = createPageRenderGuard('report', body);
  right.innerHTML = '';
  let h = `<div class="sub-tabs" style="flex-wrap:wrap">
    ${userDoc.show_sales_report!==false||isAdmin?`
    <button class="sub-tab ${reportSubTab==='daily'?'active':''}" onclick="reportSubTab='daily';renderPage()">일일 매출</button>
    <button class="sub-tab ${reportSubTab==='weeklyReport'?'active':''}" onclick="reportSubTab='weeklyReport';renderPage()">주간 매출</button>
    <button class="sub-tab ${reportSubTab==='monthlyReport'?'active':''}" onclick="reportSubTab='monthlyReport';renderPage()">월간 매출</button>
    ${isAdmin||userDoc.role==='manager'||userDoc.can_view_all_reports?`<button class="sub-tab ${reportSubTab==='stats'?'active':''}" onclick="reportSubTab='stats';renderPage()">📊 통계</button>`:''}
    `:''}
    ${userDoc.show_sales_report===false||isAdmin?`<button class="sub-tab ${reportSubTab==='workReport'?'active':''}" onclick="reportSubTab='workReport';renderPage()">📋 업무보고</button>`:''}
    <button class="sub-tab ${reportSubTab==='attendance'?'active':''}" onclick="reportSubTab='attendance';renderPage()">출근 보고서</button>
  </div>`;

  if (reportSubTab === 'attendance') {
    h += await renderAttendancePage();
  } else if (reportSubTab === 'workReport') {
    h += await renderWorkReportPage();
  } else if (reportSubTab === 'stats') {
    h += await renderStatsDashboard();
  } else if (reportSubTab === 'weeklyReport') {
    h += await renderWeeklySalesReport();
  } else if (reportSubTab === 'monthlyReport') {
    h += await renderMonthlySalesReport();
  } else {
    h += `<div style="display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap">
      <button class="btn btn-red" onclick="openWriteReport()" style="flex:1;min-width:120px">✏️ 보고서 작성</button>
      ${isAdmin || userDoc.role==='manager' ? `<button class="btn btn-dark" onclick="openReportFieldSettings()" style="flex:1;min-width:120px">⚙️ 양식 설정</button>` : ''}
    </div>`;
    try {
      const reports = await api('GET','/reports');
      if (!reports.length) {
        h += '<div style="color:var(--text3);text-align:center;padding:40px 0;font-size:13px">보고서가 없습니다</div>';
      } else if (isAdmin || userDoc.role === 'manager') {
        // 팀장/admin: 팀원별 탭으로 보기
        const authors = [...new Map(reports.map(r => [r.author_id, r.author_name])).entries()];
        if (!window._reportAuthorFilter) window._reportAuthorFilter = 'all';
        h += `<div class="sub-tabs" style="flex-wrap:wrap;margin-bottom:12px">
          <button class="sub-tab ${window._reportAuthorFilter==='all'?'active':''}" onclick="window._reportAuthorFilter='all';renderPage()">전체</button>
          ${authors.map(([uid,name]) => `<button class="sub-tab ${window._reportAuthorFilter===uid?'active':''}" onclick="window._reportAuthorFilter='${uid}';renderPage()">${esc(name)}</button>`).join('')}
        </div>`;
        const filtered = window._reportAuthorFilter === 'all' ? reports : reports.filter(r => r.author_id === window._reportAuthorFilter);
        h += filtered.map(r => `<div class="card" onclick="viewReport('${r.id}')" style="cursor:pointer">
          <div class="card-title">📄 ${esc(r.author_name)}</div>
          <div class="card-meta">${r.report_date} · <span style="color:var(--green)">제출완료</span></div>
        </div>`).join('');
      } else {
        // 일반 팀원: 본인 보고서만
        h += reports.map(r => `<div class="card" onclick="viewReport('${r.id}')" style="cursor:pointer">
          <div class="card-title">📄 ${esc(r.author_name)}</div>
          <div class="card-meta">${r.report_date} · <span style="color:var(--green)">제출완료</span></div>
        </div>`).join('');
      }
    } catch(e) { h += '<div style="color:var(--red);text-align:center;padding:20px">로드 실패</div>'; }
  }
  if (!isActiveRender()) return;
  body.innerHTML = h;
}

let statsSubTab = 'daily';
async function renderStatsDashboard() {
  let h = `<div class="sub-tabs" style="margin-bottom:12px">
    <button class="sub-tab ${statsSubTab==='daily'?'active':''}" onclick="statsSubTab='daily';renderPage()">일간</button>
    <button class="sub-tab ${statsSubTab==='weekly'?'active':''}" onclick="statsSubTab='weekly';renderPage()">주간</button>
    <button class="sub-tab ${statsSubTab==='monthly'?'active':''}" onclick="statsSubTab='monthly';renderPage()">월간</button>

  try {

      const d = await api('GET','/stats/daily');
      let grandTotal = 0;
      Object.values(d.totals).forEach(v => grandTotal += v);
      h += `<div style="font-size:13px;color:var(--text3);margin-bottom:12px">📅 ${d.date}</div>`;
      h += `<div class="stats">

function findWorkReportInCache(id) {
  return workReportsCache.find(rr => String(rr.id) === String(id));
}

async function viewWorkReport(id) {
  // The list page that shows this card has already fetched
  // /work-reports moments ago and stashed it in workReportsCache —
  // refetching just to look up one record makes the modal feel
  // laggy on a slow network. Only round-trip if the cache is empty
  // (e.g. opened from a notification deep-link).
  let r = findWorkReportInCache(id);
  if (!r) {
    try { workReportsCache = await api('GET','/work-reports'); } catch (_) {}
    r = findWorkReportInCache(id);
  }
  if (!r) return;
  const canEdit = r.author_id === currentUser.uid || isAdmin;
  let h = `<div class="modal-title">📋 ${esc(r.author_name)} 업무보고</div>
    <div style="font-size:12px;color:var(--text3);margin-bottom:12px">${r.report_date}</div>
    <div style="font-size:13px;line-height:1.8;white-space:pre-wrap;background:var(--bg3);border-radius:8px;padding:12px">${esc(r.content)}</div>`;
  if (canEdit) h += `<button onclick="editWorkReport('${r.id}','${r.report_date}')" class="btn btn-red" style="width:100%;margin-top:12px">✏️ 수정</button>`;
  h += `<button class="btn btn-dark" onclick="closeModal()" style="width:100%;margin-top:8px">닫기</button>`;
  openModal(h);
}

async function editWorkReport(id, date) {
  let r = findWorkReportInCache(id);

  let h = `<div class="modal-title">✏️ 업무보고 수정</div>

// 주간 매출 보고서
async function renderWeeklySalesReport() {
  let h = `<div style="display:flex;gap:8px;margin-bottom:16px">
    <button class="btn btn-red" onclick="openWriteWeeklyReport()" style="flex:1">✏️ 주간 보고서 작성</button>
  </div>`;

  // Admin/manager sees three sections: own submitted weekly reports,
  // the active report template (needed for team auto-summary), and
  // the team auto-summary itself. Kick all three off in parallel so
  // the tab doesn't stack 3 round trips before first paint.
  const isTeamView = userDoc.role === 'admin' || userDoc.role === 'manager';
  const templatePromise = isTeamView && !currentTemplate
    ? api('GET','/report-templates').catch(() => [])
    : Promise.resolve(null);
  const [reports, templates] = await Promise.all([
    api('GET','/weekly-reports').catch(() => []),
    templatePromise,
  ]);
  if (templates && Array.isArray(templates) && templates.length) {
    currentTemplate = templates[0];
  }
  // The team summary query needs the template id so it has to chain
  // after the template resolves, but only for the team-view branch
  // and only when we actually know which template to ask about.
  const teamSummary = (isTeamView && currentTemplate)
    ? await api('GET','/reports/weekly-summary?templateId='+currentTemplate.id).catch(() => null)
    : null;

  // 제출된 주간 보고서 목록
  try {
    if (reports.length) {
      reports.forEach(r => {
        const as = typeof r.auto_summary === 'string' ? JSON.parse(r.auto_summary) : r.auto_summary;
        const af = typeof r.additional_fields === 'string' ? JSON.parse(r.additional_fields) : r.additional_fields;
        let totalAmt = 0;
        if (as.totals) Object.values(as.totals).forEach(v => totalAmt += v);
        h += `<div class="card" onclick="viewWeeklyReport('${r.id}')" style="cursor:pointer">
          <div style="display:flex;justify-content:space-between;align-items:center">
            <div class="card-title">📊 ${esc(r.author_name)} 주간</div>
            <span style="font-size:12px;color:var(--green);font-weight:600">${r.status==='submitted'?'제출완료':'작성중'}</span>
          </div>
          <div class="card-meta">${r.week_start} ~ ${r.week_end} · 보고서 ${as.reportCount||0}건 · 매출 ${totalAmt.toLocaleString()}원</div>
        </div>`;
      });
    } else {
      h += '<div style="color:var(--text3);text-align:center;padding:20px;font-size:13px">주간 보고서 없음</div>';
    }
  } catch(e) {}

  // 팀장/관리자만 팀 자동 집계 표시
  if (isTeamView) {
  h += '<div style="margin-top:20px;padding-top:16px;border-top:1px solid var(--border)">';
  h += '<div style="font-size:14px;font-weight:700;margin-bottom:10px">📈 팀 주간 자동 집계</div>';
  try {
    const r = teamSummary;
    if (r && r.amountFields?.length > 0) {
      Object.entries(r.byAuthor).forEach(([name, data]) => {
        let totalAmt = 0;
        h += `<div class="card"><div style="font-size:13px;font-weight:600;margin-bottom:6px">${esc(name)} (${data.reports.length}건)</div>`;
        r.amountFields.forEach(af => {
          const val = data.totals[af.field_name] || 0; totalAmt += val;
          h += `<div style="display:flex;justify-content:space-between;font-size:12px;padding:2px 0"><span style="color:var(--text2)">${esc(af.field_name)}</span><span>${val.toLocaleString()}원</span></div>`;
        });
        h += `<div style="display:flex;justify-content:space-between;font-size:13px;font-weight:700;padding:4px 0;margin-top:4px;border-top:1px solid var(--border);color:var(--green)"><span>합계</span><span>${totalAmt.toLocaleString()}원</span></div></div>`;
      });
    }
  } catch(e) {}
  h += '</div>';
  } // end if admin/manager
  return h;
}

    if (as.totals) Object.values(as.totals).forEach(v => totalAmt += v);

    let h = `<div class="modal-title">✏️ 주간 보고서</div>`;
    h += `<div style="font-size:13px;color:var(--text2);margin-bottom:16px">${data.weekStart} ~ ${data.weekEnd} (다음주 월요일까지 제출)</div>`;

    h += `<div class="card" style="margin-bottom:16px">
      <div style="font-size:13px;font-weight:700;margin-bottom:8px">📊 자동 합산 (일일 보고서 ${as.reportCount}건)</div>`;

    // 기존 추가 항목 복원
    const existingFields = data.existing?.additional_fields ? (typeof data.existing.additional_fields === 'string' ? JSON.parse(data.existing.additional_fields) : data.existing.additional_fields) : [];

    h += `<div style="font-size:13px;font-weight:700;margin-bottom:8px">📝 추가 내용</div>`;

        <textarea class="form-input wf-value" rows="2" placeholder="내용 입력" style="font-size:13px;resize:none">${esc(f.value)}</textarea>
      </div>`;
    });
    h += `</div>`;
    h += `<button onclick="addWeeklyField()" class="btn btn-dark" style="width:100%;margin-bottom:16px;font-size:12px">+ 항목 추가</button>`;

    h += `<div style="display:flex;gap:8px">
      <button class="btn btn-dark" onclick="closeModal()" style="flex:1">취소</button>
      <button class="btn btn-red" onclick="submitWeeklyReport('${data.weekStart}','${data.weekEnd}')" style="flex:1">제출</button>
    </div>`;

async function submitWeeklyReport(weekStart, weekEnd) {
  const labels = document.querySelectorAll('.wf-label');
  const values = document.querySelectorAll('.wf-value');
  const additionalFields = [];
  labels.forEach((el, i) => {
    if (el.value.trim() || values[i]?.value.trim()) {
      additionalFields.push({ label: el.value.trim(), value: values[i]?.value.trim() || '' });
    }
  });
  await api('POST','/weekly-reports',{ weekStart, weekEnd, additionalFields });
  closeModal(); alert('주간 보고서 제출 완료!'); renderPage(true);
}

function getMonthlyReportMonthFromTodoDate(dateStr) {
  const parts = String(dateStr || '').split('-').map(Number);
  if (parts.length < 2 || !parts[0] || !parts[1]) return '';
  let year = parts[0];
  let month = parts[1] - 1;
  if (month < 1) {
    year -= 1;
    month = 12;
  }
  return `${year}-${String(month).padStart(2, '0')}`;
}

function addMonthsToDateStr(dateStr, amount) {
  const parts = String(dateStr || '').split('-').map(Number);
  if (parts.length < 3 || !parts[0] || !parts[1] || !parts[2]) return '';
  const d = new Date(parts[0], parts[1] - 1 + amount, parts[2]);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

function getMonthlyReportMonthForTodo(ev) {
  const todoDate = ev?.done && ev.date < todayStr() ? addMonthsToDateStr(ev.date, 1) : ev?.date;
  return getMonthlyReportMonthFromTodoDate(todoDate);
}

function changeAttMonth(d) { attMonth+=d; if(attMonth>12){attMonth=1;attYear++;} if(attMonth<1){attMonth=12;attYear--;} renderPage(); }

async function renderAttendancePage() {
  const today = todayStr();
  const isPC = window.innerWidth >= 769;
  const canViewTeam = isAdmin || userDoc.can_view_all_attendance || userDoc.role === 'manager';
  const todayMonthStr = today.slice(0, 7);
  const attMonthStr = `${attYear}-${String(attMonth).padStart(2,'0')}`;
  const isViewingCurrentAttendanceMonth = attMonthStr === todayMonthStr;
  const attMonthQuery = 'month=' + encodeURIComponent(attMonthStr);
  // All four fetches are independent; the old serial pattern made the
  // attendance tab 3-4 round trips deep before first paint. For a
  // manager it used to be up to 400ms blank page — now it's max(each).
  // /attendance/details is also fetched TWICE under the old code
  // (once with a userId filter for the late counter, once with no
  // filter for the team view). Both paths want the same "this user's
  // records" data for the late counter, so we fetch the user-scoped
  // details once and only add the team-wide details when needed.
  const [allAttendance, myDetails, teamSummary, teamDetails] = await Promise.all([
    api('GET','/attendance?userId='+currentUser.uid+'&'+attMonthQuery).catch(() => []),
    api('GET','/attendance/details?userId='+currentUser.uid+'&'+attMonthQuery).catch(() => []),
    canViewTeam ? api('GET','/attendance/monthly-summary?'+attMonthQuery).catch(() => []) : Promise.resolve(null),
    canViewTeam ? api('GET','/attendance/details?'+attMonthQuery).catch(() => []) : Promise.resolve(null),
  ]);
  const myAttendance = (allAttendance || []).find(a => a.attendance_date === today);
  const myLateCount = (myDetails || []).filter(d => d.is_late).length;

  let h = '';

  // 출근/퇴근 버튼 (PC만)
  if (isPC) {
    h += '<div class="stats"><div class="stat-card">';
    if (!isViewingCurrentAttendanceMonth) {
      h += `<div style="font-size:13px;color:var(--text3);line-height:1.55">출근 체크는 오늘이 포함된 달에서만 가능합니다.<br><button onclick="attYear=${today.slice(0,4)};attMonth=${Number(today.slice(5,7))};renderPage()" class="btn btn-dark" style="margin-top:10px;padding:8px 12px;font-size:12px">이번 달로 이동</button></div>`;
    } else if (!myAttendance || !myAttendance.check_in) {
      h += `<button class="btn btn-red" onclick="checkIn()" style="width:100%;font-size:16px">🕐 출근하기</button>`;
    } else {
      const myLate = myAttendance.check_in > '10:10';
      h += `<div class="stat-num" style="color:${myLate?'var(--yellow)':'var(--green)'}">${myAttendance.check_in}</div><div class="stat-label">${myLate?'⚠️ 지각':'출근 완료 ✅'}</div>`;
      if (myLateCount > 0) h += `<div style="font-size:11px;color:var(--yellow);margin-top:4px">이번 달 지각: ${myLateCount}회</div>`;
    }
    h += '</div></div>';
  } else {
    // 모바일에서는 오늘 상태만 표시 (버튼 없음)
    h += '<div class="card" style="text-align:center">';
    if (!myAttendance || !myAttendance.check_in) {
      h += `<div style="font-size:13px;color:var(--text3)">⚠️ 출근 미등록 (PC에서 출근 체크해주세요)</div>`;
    } else {
      const myLate = myAttendance.check_in > '10:10';
      h += `<div class="stat-num" style="color:${myLate?'var(--yellow)':'var(--green)'}">${myAttendance.check_in}</div><div class="stat-label">${myLate?'⚠️ 지각':'출근 완료 ✅'}</div>`;
      if (myLateCount > 0) h += `<div style="font-size:11px;color:var(--yellow);margin-top:4px">이번 달 지각: ${myLateCount}회</div>`;
    }
    h += '</div>';
  }

  // 출근 캘린더
  const y = attYear, m = attMonth;
  const firstDay = new Date(y, m-1, 1).getDay();
  const daysInMonth = new Date(y, m, 0).getDate();
  const attendanceMap = {};
  allAttendance.forEach(a => { attendanceMap[a.attendance_date] = a; });

  h += `<div style="display:flex;align-items:center;justify-content:space-between;margin:16px 0 10px">
    <div style="display:flex;align-items:center;gap:8px">
      <button onclick="changeAttMonth(-1)" style="background:none;border:none;cursor:pointer;font-size:16px;color:var(--text2)">‹</button>
      <div style="font-size:14px;font-weight:700">📅 ${y}년 ${m}월 출근 기록</div>
      <button onclick="changeAttMonth(1)" style="background:none;border:none;cursor:pointer;font-size:16px;color:var(--text2)">›</button>
    </div>
    <div style="font-size:13px;color:var(--green);font-weight:600">${allAttendance.filter(a=>a.check_in).length}일 출근</div>
  </div>`;

  h += '<div class="cal-grid">';
  ['일','월','화','수','목','금','토'].forEach(d => h += `<div class="cal-header">${d}</div>`);

  // Fill prev month
  for (let i = firstDay - 1; i >= 0; i--) h += '<div class="cal-cell other"><div class="cal-num"></div></div>';

  for (let d = 1; d <= daysInMonth; d++) {
    const ds = `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const att = attendanceMap[ds];
    const dow = new Date(y, m-1, d).getDay();
    const isToday = ds === today;
    const hasCheckin = att && att.check_in;
    const hasCheckout = att && att.check_out;

    let dotColor = 'transparent';
    if (hasCheckin) dotColor = 'var(--green)';

    h += `<div class="cal-cell ${isToday?'today':''} ${dow===0?'sun':''} ${dow===6?'sat':''}"
      ${hasCheckin ? `onclick="showAttendanceDetail('${ds}','${att.check_in||''}','${att.check_out||''}')"` : ''}
      style="cursor:${hasCheckin?'pointer':'default'}">
      <div class="cal-num">${d}</div>
      <div class="cal-dots"><div class="cal-dot" style="background:${dotColor}"></div></div>
    </div>`;
  }

  // Fill next month
  const totalCells = firstDay + daysInMonth;
  for (let i = 1; i <= (42 - totalCells); i++) h += '<div class="cal-cell other"><div class="cal-num"></div></div>';
  h += '</div>';

  // 범례
  h += `<div style="display:flex;gap:16px;justify-content:center;margin-top:10px;font-size:11px;color:var(--text3)">
    <span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);margin-right:4px"></span>출근 완료</span>
  </div>`;

  // Admin/권한자: monthly summary (데이터는 상단의 Promise.all에서 이미 로드됨)
  if (canViewTeam && teamSummary && teamDetails) {
    try {
      const summary = teamSummary;
      h += '<div style="font-size:14px;font-weight:700;margin:20px 0 10px">📊 팀원 출근 현황</div>';
      const byUser = {};
      teamDetails.forEach(d => {
        if (!byUser[d.user_name]) byUser[d.user_name] = {total:0,late:0,records:[]};
        byUser[d.user_name].total++;
        if (d.is_late) byUser[d.user_name].late++;
        byUser[d.user_name].records.push(d);
      });
      summary.forEach(u => {
        const ud = byUser[u.name] || {total:0,late:0,records:[]};
        const lateBadge = ud.late > 0 ? `<span style="font-size:10px;color:var(--yellow);margin-left:6px">⚠️ 지각 ${ud.late}회</span>` : '';
        h += `<div class="card" style="cursor:pointer" onclick="toggleAttDetail('${esc(u.name)}')">
          <div style="display:flex;justify-content:space-between;align-items:center">
            <span style="font-size:14px;font-weight:600">${esc(u.name||u.email)}${lateBadge}</span>
            <span style="font-size:13px;color:var(--red);font-weight:700">${u.total_days}일</span>
          </div>
          <div id="attDetail_${esc(u.name).replace(/\s/g,'_')}" style="display:none;margin-top:8px;border-top:1px solid var(--border);padding-top:6px">
            ${ud.records.map(r => {
              const late = r.is_late ? '<span style="color:var(--yellow);font-size:10px;margin-left:4px">지각</span>' : '';
              return `<div style="display:flex;justify-content:space-between;font-size:11px;padding:2px 0">

function formatFileSize(bytes) {
  const size = Number(bytes || 0);
  if (!size) return '';
  if (size < 1024) return size + 'B';
  if (size < 1024 * 1024) return (size / 1024).toFixed(1) + 'KB';
  return (size / (1024 * 1024)).toFixed(1) + 'MB';
}

function getNoticeText(notice) {

async function uploadDraftImages(kind, input, uploadPath, containerId) {
  const files = Array.from(input?.files || []);
  if (!files.length) return;
  const invalid = files.find(file => !/^image\/(png|jpe?g)$/i.test(file.type || ''));
  if (invalid) {
    input.value = '';
    return alert('JPG, PNG 이미지만 업로드할 수 있습니다.');
  }
  input.disabled = true;
  try {
    const formData = new FormData();
    files.forEach(file => formData.append('images', file));
    const result = await api('POST', uploadPath, formData);
    setDraftImageAttachments(kind, getDraftImageAttachments(kind).concat(result.attachments || []));
    renderDraftImageAttachmentEditor(kind, containerId);
  } catch (e) {
    alert('이미지 업로드 실패: ' + e.message);

    input.disabled = false;
  }
}

}

    }

}

async function registerFCM(shouldPrompt = false) {
  const result = { permission: ('Notification' in window) ? Notification.permission : 'unsupported', tokenRegistered: false };
  try {
    if (!('Notification' in window) || !('serviceWorker' in navigator) || !firebase.messaging) return result;
    if (typeof firebase.messaging.isSupported === 'function') {
      const supported = await firebase.messaging.isSupported();
      if (!supported) return { permission: 'unsupported', tokenRegistered: false };
    }

    let permission = Notification.permission;
    if (permission === 'default' && shouldPrompt) permission = await Notification.requestPermission();
    result.permission = permission;
    if (permission !== 'granted') return result;

    const swReg = await ensureServiceWorkerRegistration();
    if (!swReg) return result;

    const messaging = firebase.messaging();
    let token = null;
    for (let i = 0; i < 3; i++) {
      try {
        token = await messaging.getToken({
          vapidKey: 'BHmM2ZxbHly236KFq-Vjzu-28n1x17ORXCL6PpbHR3yiB4ygiyb28PThfQkaRSzlVnCW5go8YkxjaHBRTjKzsy8',
          serviceWorkerRegistration: swReg
        });
        if (token) break;
      } catch (e) {
        if (i < 2) await new Promise(r => setTimeout(r, 1500));
      }
    }

    if (token) {
      await api('POST', '/fcm/register', { token });
      result.tokenRegistered = true;
      currentDevicePushReady = true;
    }

    if (!fcmMessageHandlerBound) {
      messaging.onMessage(async payload => {
        const { title, body } = payload.notification || {};
        const kind = payload.data?.kind || '';
        const roomId = payload.data?.roomId ? String(payload.data.roomId) : '';
        const tag = payload.data?.tag || '';
        if (tag) rememberNotificationSignal(tag, 20000);
        if (roomId) rememberNotificationSignal(`chat-room-${roomId}`, 20000);
        if (kind === 'chat') suppressChatAlerts(12000);
        if (kind === 'notice') suppressNoticeAlerts(12000);
        if (title) {
          const shouldShowForegroundSystemNotification = document.hidden || !document.hasFocus();
          if (shouldShowForegroundSystemNotification) {
            await showSystemNotification(title, {
              body,
              icon: '/icon-192.png',
              tag: payload.data?.tag || 'foreground-fcm',
              url: payload.data?.link || '/'
            });
          }
        }
        if (kind === 'chat' && getNotificationPrefs().notifyChat && roomId !== String(currentRoomId || '') && !document.hidden && document.hasFocus()) {
          playNotifSound();
        }
        checkAllRoomsUnread({ suppressAlerts: true });
        checkNoticeUnread({ suppressAlerts: true });
      });
      fcmMessageHandlerBound = true;
    }

    if (!fcmTokenRefreshHandlerBound && typeof messaging.onTokenRefresh === 'function') {
      messaging.onTokenRefresh(async () => {
        try {
          const newToken = await messaging.getToken({
            vapidKey: 'BHmM2ZxbHly236KFq-Vjzu-28n1x17ORXCL6PpbHR3yiB4ygiyb28PThfQkaRSzlVnCW5go8YkxjaHBRTjKzsy8',
            serviceWorkerRegistration: swReg
          });
          if (newToken) {
            await api('POST', '/fcm/register', { token: newToken });
            currentDevicePushReady = true;
          }
          await fetchFcmStatus();
        } catch (e) {}
      });
      fcmTokenRefreshHandlerBound = true;
    }

    await fetchFcmStatus();
    return result;
  } catch(e) {
    console.error('FCM registration failed:', e);
    return result;
  }
}

function formatDateTimeLabel(value) {
  if (!value) return '';
  const dt = new Date(value);
  if (Number.isNaN(dt.getTime())) return '';
  return dt.toLocaleString('ko-KR', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
}

async function showSystemNotification(title, options = {}) {
  if (!('Notification' in window) || Notification.permission !== 'granted') return false;

  const payload = {
    body: options.body || '',
    icon: options.icon || '/icon-192.png',
    badge: options.badge || '/icon-192.png',
    tag: options.tag,
    renotify: true,
    requireInteraction: true,
    silent: false,
    timestamp: Date.now(),
    data: { url: options.url || '/' }
  };

  try {
    const swReg = await ensureServiceWorkerRegistration();
    if (swReg?.showNotification) {
      await swReg.showNotification(title, payload);
      return true;
    }
  } catch (e) {}

  try {
    const notification = new Notification(title, payload);
    notification.onclick = () => {
      window.focus();
      if (options.url) handleInternalDeepLink(options.url);
    };
    return true;
  } catch (e) {
    console.error('showSystemNotification failed:', e.message || e);
    return false;
  }
}

async function checkNoticeUnread(options = {}) {
  const suppressAlerts = !!options.suppressAlerts || Date.now() < suppressNoticeAlertsUntil;
  try {
    const r = await api('GET', '/notices/unread/count');
    const count = r.count || 0;
    const sb = document.getElementById('sidebarNoticeBadge');
    const mb = document.getElementById('mobNoticeBadge');
    if (sb) { if(count>0){sb.textContent=count;sb.style.display='';} else sb.style.display='none'; }
    if (mb) { if(count>0){mb.textContent=count;mb.style.display='';} else mb.style.display='none'; }
    // 새 공지 감지 → 시스템 알림 + 팝업
    if (!suppressAlerts && count > (window._prevNoticeUnread||0) && count > 0) {
      const signalKey = `notice-unread:${count}`;
      if ('Notification' in window && Notification.permission === 'granted' && !currentDevicePushReady && (!document.hasFocus() || document.hidden) && !wasNotificationSignalRecent(signalKey)) {
        rememberNotificationSignal(signalKey, 20000);
        await showSystemNotification('피크마케팅 - 새 공지사항', {
          body: count + '개의 새 공지가 있습니다',
          icon: '/favicon.svg',
          tag: 'notice-unread',
          renotify: true,
          url: '/?page=notice'
        });
      }
      // 포그라운드면 바로 팝업
      if (document.hasFocus() && !document.hidden) {
        showUnreadNoticePopup();
      }
    }
    window._prevNoticeUnread = count;
  } catch(e) {}
}

  } else {
    filtered.forEach(n => {

      const attachments = getNoticeAttachments(n);
