// ── Minimal DOM morpher ───────────────────────────────────────────────
// Replaces the children of `container` so they match the structure of
// `newHtml`, but reuses existing DOM nodes where they are structurally
// equivalent. This keeps:
//   - Focus on unchanged inputs
//   - User-toggled state on unchanged nodes (e.g. accordion .acc-body
//     style.display, checkbox "checked" state)
//   - Scroll position within the container (no full innerHTML repaint)
// Matching strategy: for element children we prefer key-based matching
// via `data-acc-key`, falling back to positional matching for the rest.
function morphHtml(container, newHtml, label) {
  const tpl = document.createElement('template');
  tpl.innerHTML = newHtml;
  let added = 0, removed = 0, morphed = 0;
  if (CAL_DEBUG) {
    const origAppend = container.appendChild.bind(container);
    const origRemove = container.removeChild.bind(container);
    // Count via MutationObserver for the duration of the morph.
    const obs = new MutationObserver(muts => muts.forEach(m => { added += m.addedNodes.length; removed += m.removedNodes.length; }));
    obs.observe(container, { childList: true, subtree: true });
    morphChildren(container, tpl.content);
    obs.takeRecords().forEach(m => { added += m.addedNodes.length; removed += m.removedNodes.length; });
    obs.disconnect();
    dlog('morphHtml', label || container.id || container.tagName, { added, removed, childCount: container.childElementCount });
  } else {
    morphChildren(container, tpl.content);
  }
}

function morphChildren(oldParent, newParent) {
  // Build a keyed lookup for old children that carry a data-acc-key.
  const oldKeyed = new Map();
  for (const node of oldParent.childNodes) {
    if (node.nodeType === 1 && node.getAttribute && node.getAttribute('data-acc-key')) {
      oldKeyed.set(node.getAttribute('data-acc-key'), node);
    }
  }

  let oldChild = oldParent.firstChild;
  let newChild = newParent.firstChild;

  while (newChild) {
    const nextNew = newChild.nextSibling;
    const newKey = newChild.nodeType === 1 && newChild.getAttribute ? newChild.getAttribute('data-acc-key') : null;

    // Try keyed reuse: if the new element has a key we've seen on the
    // old side, move that old node into place rather than rebuilding.
    if (newKey && oldKeyed.has(newKey)) {
      const matched = oldKeyed.get(newKey);
      if (matched !== oldChild) {
        oldParent.insertBefore(matched, oldChild || null);
      } else {
        oldChild = oldChild.nextSibling;
      }
      morphNodeInPlace(matched, newChild);
      oldKeyed.delete(newKey);
      newChild = nextNew;
      continue;
    }

    if (!oldChild) {
      oldParent.appendChild(newChild.cloneNode(true));
    } else if (canMorph(oldChild, newChild)) {
      morphNodeInPlace(oldChild, newChild);
      oldChild = oldChild.nextSibling;
    } else {
      const replacement = newChild.cloneNode(true);
      oldParent.insertBefore(replacement, oldChild);
      const toRemove = oldChild;
      oldChild = oldChild.nextSibling;
      oldParent.removeChild(toRemove);
    }
    newChild = nextNew;
  }

  // Remove any trailing old children that don't have a match in the new tree.
  while (oldChild) {
    const next = oldChild.nextSibling;
    oldParent.removeChild(oldChild);
    oldChild = next;
  }
}

function canMorph(oldNode, newNode) {
  if (oldNode.nodeType !== newNode.nodeType) return false;
  if (oldNode.nodeType === 1) return oldNode.nodeName === newNode.nodeName;
  return true;
}

function morphNodeInPlace(oldNode, newNode) {
  if (oldNode.nodeType === 3 || oldNode.nodeType === 8) {
    if (oldNode.nodeValue !== newNode.nodeValue) oldNode.nodeValue = newNode.nodeValue;
    return;
  }
  if (oldNode.nodeType !== 1) return;

  // Capture user-toggled state BEFORE syncing attributes (the new
  // style="..." would otherwise reset display: none back to block).
  const isAccBody = oldNode.classList && oldNode.classList.contains('acc-body');
  const preservedDisplay = isAccBody ? oldNode.style.display : null;

  // Sync attributes without touching ones that already match.
  const newAttrs = newNode.attributes;
  const oldAttrs = oldNode.attributes;
  const seen = new Set();
  for (let i = 0; i < newAttrs.length; i++) {
    const a = newAttrs[i];
    seen.add(a.name);
    if (oldNode.getAttribute(a.name) !== a.value) oldNode.setAttribute(a.name, a.value);
  }
  for (let i = oldAttrs.length - 1; i >= 0; i--) {
    const name = oldAttrs[i].name;
    // Preserve data-e2e-* and data-test-* attributes so external
    // tooling (Playwright tests, debugging markers) can pin a DOM node
    // across re-renders without being clobbered.
    if (!seen.has(name) && !/^data-(e2e|test)-/.test(name)) oldNode.removeAttribute(name);
  }

  if (isAccBody) {
    oldNode.style.display = preservedDisplay;
    const wrap = oldNode.parentElement;
    const head = wrap && wrap.querySelector(':scope > .acc-head');
    const arrow = head && head.querySelector('.acc-arrow');
    if (arrow) arrow.textContent = preservedDisplay === 'none' ? '▶' : '▼';
  }

  morphChildren(oldNode, newNode);
}

const CHAT_ROOM_NAME_CACHE_KEY = 'peakChatRoomNames';
function readChatRoomNameCache() {
  try { return JSON.parse(localStorage.getItem(CHAT_ROOM_NAME_CACHE_KEY) || '{}') || {}; } catch (_) { return {}; }
}
function writeChatRoomNameCache(map) {
  try { localStorage.setItem(CHAT_ROOM_NAME_CACHE_KEY, JSON.stringify(map || {})); } catch (_) {}
}
function rememberChatRoomName(roomId, name) {
  if (!roomId) return;
  const trimmed = String(name || '').trim();
  if (!trimmed) return;
  const cache = readChatRoomNameCache();
  if (cache[roomId] === trimmed) return;
  cache[roomId] = trimmed;
  writeChatRoomNameCache(cache);
}
function syncChatRoomNameCacheFromList(rooms = chatRooms) {
  if (!Array.isArray(rooms) || !rooms.length) return;
  const cache = readChatRoomNameCache();
  let dirty = false;
  for (const r of rooms) {
    const name = String(r?.name || '').trim();
    if (!r?.id || !name) continue;
    if (cache[r.id] !== name) { cache[r.id] = name; dirty = true; }
  }
  if (dirty) writeChatRoomNameCache(cache);
}

function getChatRoomBrowserTitle(roomId = currentRoomId) {
  const room = chatRooms.find(item => String(item.id) === String(roomId));
  let roomName = String(room?.name || '').trim();
  if (!roomName) {
    // Fall back to localStorage so a popup whose chatRooms cache
    // hasn't populated yet still gets a recognisable tab title
    // instead of the generic default.
    const cache = readChatRoomNameCache();
    roomName = String(cache[roomId] || '').trim();
  }
  return roomName ? `${roomName} | ${APP_BROWSER_TITLE}` : `채팅 | ${APP_BROWSER_TITLE}`;
}

function updateBrowserWindowIdentity(nextTitle) {
  const title = String(nextTitle || '').trim() || APP_BROWSER_TITLE;
  const prev = document.title;
  if (prev !== title) document.title = title;
  const titleTag = document.querySelector('title');
  if (titleTag && titleTag.textContent !== title) titleTag.textContent = title;
  const appleWebAppTitle = document.querySelector('meta[name="apple-mobile-web-app-title"]');
  if (appleWebAppTitle && appleWebAppTitle.getAttribute('content') !== title) {
    appleWebAppTitle.setAttribute('content', title);
  }
  try {
    if (window.name !== title) window.name = title;
  } catch (e) {}
  if (prev !== title) dlog('title →', title);
  return title;
}

function syncDocumentTitle(options = {}) {
  const hasExplicitRoomId = Object.prototype.hasOwnProperty.call(options, 'roomId');
  const roomId = hasExplicitRoomId ? options.roomId : currentRoomId;
  const nextTitle = currentPage === 'chat' && roomId
    ? getChatRoomBrowserTitle(roomId)
    : getDefaultBrowserTitle();
  return updateBrowserWindowIdentity(nextTitle);
}

// ── Navigation ──
function navTo(page) {
  // chat_only accounts can never leave the chat tab. Paired with the
  // server-side whitelist in authMiddleware, this makes a "only this
  // user can use chat" role actually enforceable — hiding the UI
  // buttons is necessary but not sufficient.
  if (isChatOnlyUser() && page !== 'chat') page = 'chat';
  if (isExternalCalendarOnlyUser() && !['calendar','chat'].includes(page)) page = 'calendar';
  if (isStandaloneChatWindow() && page !== 'chat') page = 'chat';
  const prevPage = currentPage;
  currentPage = page;
  // Sidebar active
  const navPages = ['calendar','chat','project','report','idea','notice','request','more'];
  document.querySelectorAll('.sidebar-item').forEach((el,i) => {
    el.classList.toggle('active', navPages[i] === page);
  });
  // Mobile tabs active
  document.querySelectorAll('.mob-tab').forEach((el,i) => {
    el.classList.toggle('active', navPages[i] === page);
  });
  // Stop chat polling when leaving chat
  if (page !== 'chat') {
    clearChatPendingAttachment({ suppressSnap: true });
    if (chatPollId) { clearInterval(chatPollId); chatPollId = null; }
    currentRoomId = null;
  }
  // Events fetch is gated to the calendar tab, so returning to the
  // calendar from another page needs a one-shot refresh if the cached
  // data is older than the polling interval — otherwise the user may
  // briefly see stale events until the next 5s tick.
  if (page === 'calendar' && prevPage !== 'calendar' && !sessionExpired) {
    if (Date.now() - lastEventsFetchAt > 5000) fetchEvents();
  }
  // Render page
  renderPage();
}

function createPageRenderGuard(page = currentPage, body = document.getElementById('mainBody'), renderTicket = currentPageRenderTicket) {
  return () => currentPage === page && currentPageRenderTicket === renderTicket && !!body && body.isConnected && document.getElementById('mainBody') === body;
}

function queueBodyScrollRestore(body, scrollTop) {
  renderScrollRestoreTimers.forEach(timer => clearTimeout(timer));
  renderScrollRestoreTimers = [];
  const restore = () => {
    if (!body || !body.isConnected) return;
    body.scrollTop = scrollTop;
  };
  restore();
  requestAnimationFrame(restore);
  renderScrollRestoreTimers.push(setTimeout(restore, 90));
  renderScrollRestoreTimers.push(setTimeout(restore, 180));
}

function renderPage(keepScroll) {
  _accId = 0;
  // DOM is about to be wiped, so any cached panel HTML no longer
  // corresponds to a live node — reset so the first partial patch
  // after this doesn't false-positive "skip".
  lastDayDetailSig = null;
  lastMobileDayDetailSig = null;
  const body = document.getElementById('mainBody');
  const scrollTop = keepScroll ? body.scrollTop : 0;
  dwarn('renderPage (full wipe)', { page: currentPage, calSubTab, keepScroll: !!keepScroll, scrollTop });
  const title = document.getElementById('mainTitle');
  const right = document.getElementById('headerRight');
  right.innerHTML = '';
  currentPageRenderTicket += 1;
  body.dataset.renderTicket = String(currentPageRenderTicket);
  setChatRoomLayoutActive(currentPage === 'chat' && !!currentRoomId);

  switch(currentPage) {
    case 'calendar': title.textContent = '📅 캘린더'; renderCalendarPage(body, right); break;
    case 'chat': title.textContent = '💬 채팅'; renderChatPage(body, right); break;
    case 'project': title.textContent = '📁 프로젝트'; renderProjectPage(body, right); break;
    case 'report': title.textContent = '📄 보고서'; renderReportPage(body, right); break;
    case 'idea': title.textContent = '💡 아이디어'; renderIdeaPage(body, right); break;
    case 'notice': title.textContent = '📢 공지사항'; renderNoticePage(body, right); break;
    case 'request': title.textContent = '🛠 수정요청'; renderServiceRequestPage(body, right); break;
    case 'more': title.textContent = '⋯ 더보기'; renderMorePage(body); break;
  }
  syncDocumentTitle();
  if (keepScroll && scrollTop > 0) {
    queueBodyScrollRestore(body, scrollTop);
  }
}

      // PC: 캘린더 + 오른쪽 패널 (체크리스트/메모 상세)
      const panelW = window._panelWidth || 320;
      dynamic = `<div class="calendar-split">
        <div class="calendar-main-panel">${renderMonthCalendarOnly()}</div>
        <div class="panel-resizer" id="panelResizer" onmousedown="startPanelResize(event)" title="드래그해서 패널 크기 조절"></div>
        <div id="rightPanel" class="calendar-side-panel" style="width:${panelW}px">${renderDayDetailEnhanced()}</div>
      </div>`;
    } else {
      dynamic = renderMonthView();
    }
  } else if (calSubTab === 'list') dynamic = renderListView();
  else if (calSubTab === 'kanban') dynamic = renderKanbanView();
  else if (calSubTab === 'weekly') { renderWeeklyInline(body, h); return; }
  else if (calSubTab === 'timetable') { renderTimetablePage(body, h); return; }

  h += `<div id="calDynamicArea">${dynamic}</div>`;
  body.innerHTML = h;
  if (calSubTab === 'kanban') setupKanbanDrag();
}

function getMonthVisibleEvents() {
  const monthStart = `${currentYear}-${String(currentMonth).padStart(2,'0')}-01`;
  const monthEnd = `${currentYear}-${String(currentMonth).padStart(2,'0')}-${String(new Date(currentYear, currentMonth, 0).getDate()).padStart(2,'0')}`;
  return filteredEvents().filter(e => shouldShowEventInMonth(e, monthStart, monthEnd));
}

function renderMonthOverview() {
  const monthEvents = getMonthVisibleEvents();
  const incompleteTodoCount = monthEvents.filter(e => e.type === 'todo' && !e.done).length;
  const teamCount = monthEvents.filter(e => e.scope === 'team').length;
  const meetingCount = monthEvents.filter(e => e.type === 'meeting').length;
  return `<div class="month-overview">
    <div class="month-overview-card"><div class="month-overview-label">이번 달 일정</div><div class="month-overview-value red">${monthEvents.length}</div></div>
    <div class="month-overview-card"><div class="month-overview-label">미완료 할 일</div><div class="month-overview-value yellow">${incompleteTodoCount}</div></div>
    <div class="month-overview-card"><div class="month-overview-label">팀 일정</div><div class="month-overview-value blue">${teamCount}</div></div>
    <div class="month-overview-card"><div class="month-overview-label">미팅</div><div class="month-overview-value green">${meetingCount}</div></div>
  </div>`;
}

function getMonthDayStats(dayEvs) {
  return {
    totalCount: dayEvs.length,
    scheduleCount: dayEvs.filter(e => e.type !== 'todo').length,
    meetingCount: dayEvs.filter(e => e.type === 'meeting').length,
    todoCount: dayEvs.filter(e => e.type === 'todo').length,
    incompleteTodoCount: dayEvs.filter(e => e.type === 'todo' && !e.done).length,
    carriedTodoCount: dayEvs.filter(e => e.carriedTodo).length,
    teamCount: dayEvs.filter(e => e.scope === 'team').length
  };
}

function renderMonthDaySummary(dayEvs) {
  const stats = getMonthDayStats(dayEvs);
  const chips = [];
  if (stats.meetingCount) chips.push(`<span class="cal-chip meeting">미팅 ${stats.meetingCount}</span>`);
  else if (stats.scheduleCount) chips.push(`<span class="cal-chip schedule">일정 ${stats.scheduleCount}</span>`);
  if (stats.todoCount) {
    const todoLabel = stats.carriedTodoCount
      ? `미완료했던 일 ${stats.carriedTodoCount}`
      : (stats.incompleteTodoCount ? `미완료 ${stats.incompleteTodoCount}` : `할 일 ${stats.todoCount}`);
    const todoClass = stats.carriedTodoCount ? 'todo-carried' : (stats.incompleteTodoCount ? 'todo-open' : 'todo');
    chips.push(`<span class="cal-chip ${todoClass}">${todoLabel}</span>`);
  } else if (!stats.scheduleCount && stats.teamCount) {
    chips.push(`<span class="cal-chip team">팀 ${stats.teamCount}</span>`);
  }
  return chips.length ? `<div class="cal-day-metrics">${chips.join('')}</div>` : '<div class="cal-day-empty"></div>';
}

function monthCellSig(stats, isToday, isSel, dow) {
  return stats.totalCount + ',' + stats.meetingCount + ',' + stats.scheduleCount + ',' + stats.todoCount + ',' + stats.incompleteTodoCount + ',' + stats.carriedTodoCount + ',' + stats.teamCount + ',' + (isToday?'t':'') + (isSel?'s':'') + ',' + dow;
}

function renderMonthCalendarGrid() {
  const y = currentYear, m = currentMonth;
  const firstDay = new Date(y, m-1, 1).getDay();
  const daysInMonth = new Date(y, m, 0).getDate();
  const today = todayStr();

  let h = '<div class="cal-grid month-grid">';
  ['일','월','화','수','목','금','토'].forEach(d => h += `<div class="cal-header">${d}</div>`);

  const prevDays = new Date(y, m-1, 0).getDate();
  for (let i = firstDay - 1; i >= 0; i--) {
    h += `<div class="cal-cell other"><div class="cal-day-head"><div class="cal-num">${prevDays - i}</div></div><div class="cal-day-empty"></div></div>`;
  }

  for (let d = 1; d <= daysInMonth; d++) {
    const ds = `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const dow = new Date(y, m-1, d).getDay();
    const isToday = ds === today;
    const isSel = ds === selectedDate;
    const dayEvs = eventsForDate(ds);
    const stats = getMonthDayStats(dayEvs);
    // Seed data-sig on the initial render so the first
    // patchCalendarMonthView() finds a matching signature and skips
    // the cell entirely (avoids a spurious "rebuild every cell" pass
    // caused by browser-serialized innerHTML not byte-matching the
    // template string).
    const sig = monthCellSig(stats, isToday, isSel, dow);
    h += `<div class="cal-cell ${stats.totalCount ? 'has-items' : ''} ${isToday ? 'today' : ''} ${isSel ? 'selected' : ''} ${dow===0 ? 'sun' : ''} ${dow===6 ? 'sat' : ''}" data-date="${ds}" data-sig="${sig}" onclick="selectMonthDate('${ds}')">
      <div class="cal-day-head"><div class="cal-num">${d}</div>${stats.totalCount ? `<span class="cal-day-total">${stats.totalCount}</span>` : ''}</div>
      ${renderMonthDaySummary(dayEvs)}</div>`;
  }

  const totalCells = firstDay + daysInMonth;
  for (let i = 1; i <= (42 - totalCells); i++) {
    h += `<div class="cal-cell other"><div class="cal-day-head"><div class="cal-num">${i}</div></div><div class="cal-day-empty"></div></div>`;
  }
  h += '</div>';
  return h;
}

function getRelatedChatRoomsForDay(dayEvs) {
  if (!chatRooms.length || !dayEvs.length) return [];
  const normalize = value => (value || '').toLowerCase().replace(/\s+/g, ' ').trim();
  const titles = dayEvs.map(e => normalize(e.title)).filter(Boolean);
  return chatRooms.filter(r => {
    const roomName = normalize(r.name);
    if (!roomName) return false;
    return titles.some(title => {
      const roomKey = roomName.slice(0, 8);
      const titleKey = title.slice(0, 8);
      return roomName.includes(titleKey) || title.includes(roomKey);
    });
  }).slice(0, 6);
}

function renderSelectedDaySummary(allDayEvs, myEvs, teamEvs, relatedRooms) {
  const dateObj = new Date(selectedDate);
  const dayNames = ['일','월','화','수','목','금','토'];
  const todoCount = allDayEvs.filter(e => e.type === 'todo').length;
  const incompleteTodoCount = allDayEvs.filter(e => e.type === 'todo' && !e.done).length;
  const meetingCount = allDayEvs.filter(e => e.type === 'meeting').length;
  return `<div class="day-summary-card">
    <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px">
      <div>
        <div style="font-size:16px;font-weight:700">${selectedDate.slice(5)} (${dayNames[dateObj.getDay()]})</div>
        <div class="day-summary-meta">${allDayEvs.length ? `전체 ${allDayEvs.length}건` : '등록된 일정 없음'}${relatedRooms.length ? ` · 관련 채팅방 ${relatedRooms.length}개` : ''}</div>
      </div>
    </div>
    <div class="day-summary-stats">
      <div class="day-summary-stat"><strong>${myEvs.length}</strong><span>내 일정</span></div>
      <div class="day-summary-stat"><strong>${teamEvs.length}</strong><span>팀 일정</span></div>
      <div class="day-summary-stat"><strong>${incompleteTodoCount || todoCount}</strong><span>${incompleteTodoCount ? '미완료' : '할 일'}</span></div>
      <div class="day-summary-stat"><strong>${meetingCount}</strong><span>미팅</span></div>
    </div>
  </div>`;
}

function renderTeamEvSection(teamEvs) {
  let h = `<div class="day-section"><div class="day-section-head"><div class="day-section-title">👥 팀 일정</div><div class="day-section-badge">${teamEvs.length}건</div></div>`;
  groupEventsByOwner(teamEvs).forEach(([owner, evs]) => {
    h += `<div style="margin-bottom:12px">
      <div style="display:flex;align-items:center;gap:6px;margin:8px 0 6px">
        <div style="font-size:13px;font-weight:800;color:var(--text)">👤 ${esc(owner)}</div>
        <div style="font-size:10px;color:var(--text3)">${evs.length}건</div>
      </div>`;
    evs.forEach(e => {
      const t = getAllEventTypes()[e.type] || {icon:'📌',color:'#888'};
      const cl = checklistSummary[e.id];
      const titleStyle = e.done ? 'text-decoration:line-through;opacity:0.45;' : '';
      const matchRoom2 = chatRooms.find(r => r.name.includes(e.title.slice(0,10)) || e.title.includes(r.name.slice(0,10)));
      h += `<div style="padding:10px;margin-bottom:6px;background:var(--bg3);border-radius:10px;border-left:3px solid var(--blue)">
        <div onclick="openEventDetail('${e.id}')" style="cursor:pointer">
          <div style="display:flex;align-items:flex-start;gap:6px">
            <div style="flex:1;font-size:13px;font-weight:600;${titleStyle}">${t.icon} ${esc(e.title)} ${renderCarriedTodoBadge(e)}${cl&&cl.total>0?` <span style="font-size:10px;color:${cl.completed===cl.total?'var(--green)':'var(--yellow)'}">(${cl.completed}/${cl.total})</span>`:''}</div>
            ${e.time?`<span style="font-size:10px;color:var(--text3)">${e.time}</span>`:''}
          </div>
          ${renderCarriedTodoMeta(e)}
          ${e.memo?`<div style="font-size:10px;color:var(--text3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">📝 ${esc(e.memo.split('\\n')[0])}</div>`:''}
        </div>
        ${matchRoom2?`<button onclick="event.stopPropagation();openChatRoomById('${matchRoom2.id}')" class="day-action-btn" style="margin-top:6px">💬 채팅방 열기</button>`:''}
      </div>`;
    });
    h += '</div>';
  });
  h += '</div>';
  return h;
}

function renderProjectMeetingSection(projectMeetings) {
  if (!projectMeetings.length) return '';
  return `<div class="day-section">
    <div class="day-section-head"><div class="day-section-title">📁 프로젝트 회의</div><div class="day-section-badge">${projectMeetings.length}건</div></div>
    ${projectMeetings.map(e => `<div class="ev-item" onclick="openProjectFromCalendar('${e.projectId}')" style="flex-direction:column;align-items:stretch;padding:10px;margin-bottom:6px;background:rgba(90,167,255,0.12);border:1px solid rgba(90,167,255,0.22);border-left:3px solid var(--blue);border-radius:10px;cursor:pointer">
      <div style="display:flex;align-items:flex-start;gap:6px">
        <div style="flex:1;font-size:13px;font-weight:750;line-height:1.4">📅 ${esc(e.title)}</div>
        ${e.time ? `<span style="font-size:10px;color:var(--text3)">${esc(e.time)}</span>` : ''}
      </div>
      <div style="font-size:10px;color:var(--text3);margin-top:4px">프로젝트 연결 일정${e.ownerName ? ' · ' + esc(e.ownerName) : ''}</div>
      ${e.memo ? `<div style="font-size:10px;color:var(--text3);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">📝 ${esc(e.memo.split('\\n')[0])}</div>` : ''}
    </div>`).join('')}
  </div>`;
}

function openProjectFromCalendar(projectId) {
  if (!projectId) return;
  selectedProjectId = projectId;
  selectedProject = null;
  selectedProjectTaskId = null;
  projectSubTab = 'overview';
  navTo('project');
}

function renderRelatedRoomsSection(rooms) {
  return `<div class="day-section"><div class="day-section-head"><div class="day-section-title">💬 관련 채팅방</div><div class="day-section-badge">${rooms.length}개</div></div>
    <div class="day-linked-rooms">${rooms.map(r =>
      `<div class="day-linked-room" onclick="openChatRoomById('${r.id}')"><span>💬</span><span style="flex:1">${esc(r.name)}</span><span style="color:var(--text3);font-size:10px">열기</span></div>`
    ).join('')}</div></div>`;
}

function renderMonthCalendarOnly() {
  return `<div class="month-wrap">${renderMonthOverview()}${renderMonthCalendarGrid()}</div>`;
}

function renderDayDetailEnhanced() {
  const allDayEvs = eventsForDate(selectedDate);
  const projectMeetings = allDayEvs.filter(e => e.projectId && e.type === 'meeting');
  const projectMeetingIds = new Set(projectMeetings.map(e => String(e.id)));
  let myEvs = allDayEvs.filter(e => !projectMeetingIds.has(String(e.id)) && (e.scope === 'personal' || isMyCalendarEvent(e)));
  let teamEvs = allDayEvs.filter(e => !projectMeetingIds.has(String(e.id)) && e.scope === 'team' && e.ownerId !== currentUser.uid && !isMyCalendarEvent(e));
  const relatedRooms = getRelatedChatRoomsForDay(allDayEvs);
  if (calShowIncomplete) {
    myEvs = myEvs.filter(e => e.type !== 'todo' || !e.done);
    teamEvs = teamEvs.filter(e => e.type !== 'todo' || !e.done);
  }
  let h = `<div style="display:flex;align-items:center;justify-content:flex-end;margin-bottom:8px">
    <div style="display:flex;gap:4px">
      <button onclick="calShowIncomplete=!calShowIncomplete;renderPage(true)" class="sub-tab ${calShowIncomplete?'active':''}" style="font-size:10px;padding:3px 8px;${calShowIncomplete?'background:var(--yellow);color:#111':''}">${calShowIncomplete?'✓ 미완료만':'전체 표시'}</button>
      ${selectedDate<todayStr()?`<button onclick="postponeDayToToday('${selectedDate}')" style="padding:3px 8px;border-radius:12px;border:1px solid var(--red);background:transparent;color:var(--red);font-size:10px;cursor:pointer">→ 오늘로</button>`:''}
    </div>
  </div>`;

  h += renderSelectedDaySummary(allDayEvs, myEvs, teamEvs, relatedRooms);

  h += renderProjectMeetingSection(projectMeetings);

  // 팀장/admin: 보고서 현황
  if ((userDoc.role === 'manager' || userDoc.role === 'admin') && (viewScope === 'team' || viewScope === 'all')) {
    // Use the last successfully-loaded HTML for this date so a
    // re-render (e.g. after a todo toggle) doesn't flash "로딩 중..."
    // while the identical fetch completes a second time. Fresh fetch
    // only fires when the date or the cache is empty.
    const cached = reportStatusCache[selectedDate];
    const inner = cached || '<div class="day-empty-note">보고서 현황 로딩...</div>';
    const wrapDisplay = (cached && cached === REPORT_STATUS_HIDDEN) ? 'none' : '';
    h += `<div class="day-section" id="reportStatusWrap" style="display:${wrapDisplay}"><div class="day-section-head"><div class="day-section-title">📄 보고서 현황</div></div><div id="reportStatusArea">${cached === REPORT_STATUS_HIDDEN ? '' : inner}</div></div>`;
    if (!cached) setTimeout(() => loadReportStatus(selectedDate), 100);
  }

  // ── 내 일정 ──
  h += renderEvSection(myEvs, '🔒 내 일정');

  // ── 팀 일정 (별도 섹션) ──
  if (teamEvs.length) {
    h += renderTeamEvSection(teamEvs);
  }

  if (relatedRooms.length) {
    h += renderRelatedRoomsSection(relatedRooms);
  }

  return h;
}

function renderEvSection(dayEvs, sectionTitle) {
  let h = `<div class="day-section"><div class="day-section-head"><div class="day-section-title">${sectionTitle}</div><div class="day-section-badge">${dayEvs.length ? `${dayEvs.length}건` : ''}</div></div>`;

  // 일정 (할일 제외)
  const nonTodos = dayEvs.filter(e => e.type !== 'todo');
  nonTodos.forEach(e => {
    const t = getAllEventTypes()[e.type] || {icon:'📌',color:'#888'};
    const cl = checklistSummary[e.id];
    h += `<div class="ev-item" onclick="openEventDetail('${e.id}')" style="flex-direction:column;align-items:stretch;padding:8px;margin-bottom:6px;background:var(--bg3);border-radius:8px">
      <div style="display:flex;align-items:center;gap:6px">
        <div class="ev-color" style="background:${t.color}"></div>
        <div style="flex:1;font-size:13px;font-weight:600">${t.icon} ${esc(e.title)}${cl&&cl.total>0?` <span style="font-size:10px;color:${cl.completed===cl.total?'var(--green)':'var(--yellow)'}">(${cl.completed}/${cl.total})</span>`:''}</div>
        ${e.time?`<span style="font-size:10px;color:var(--text3)">${e.time}</span>`:''}
      </div>
      ${e.endDate?`<div style="font-size:10px;color:var(--text3);margin-top:3px;padding-left:10px">📅 ${e.date} ~ ${e.endDate}</div>`:''}
      ${e.memo?`<div style="font-size:11px;color:var(--text3);margin-top:3px;padding-left:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">📝 ${esc(e.memo.split('\\n')[0])}</div>`:''}
      ${cl&&cl.total>0?`<div style="margin-top:4px;padding-left:10px"><div style="width:100%;height:3px;background:var(--bg4);border-radius:2px;overflow:hidden"><div style="width:${Math.round(cl.completed/cl.total*100)}%;height:100%;background:var(--green);border-radius:2px"></div></div></div>`:''}
    </div>`;
  });

  // 할 일 카테고리별 (아코디언)
  const allCats = getAllTodoCats();
  const catKeys = Object.keys(allCats).filter(cat => dayEvs.some(e => e.type === 'todo' && (e.todoCat||'') === cat));
  if (catKeys.length) {
    catKeys.forEach(cat => {
      const color = allCats[cat];
      const catTodos = dayEvs.filter(e => e.type === 'todo' && (e.todoCat||'') === cat);
      const doneCnt = catTodos.filter(e=>e.done).length;
      let catContent = '';
      catTodos.sort((a,b)=>(a.sortOrder||0)-(b.sortOrder||0)).forEach(e => {
        const cl = checklistSummary[e.id];
        catContent += `<div class="ev-item todo-drag-item" draggable="true" data-todo-id="${e.id}" data-todo-cat="${esc(cat)}" style="padding:5px 4px;flex-direction:column;align-items:stretch;cursor:grab"
          ondragstart="onTodoDragStart(event,'${e.id}','${esc(cat)}')" ondragend="onTodoDragEnd(event)"
          ondragover="onTodoDragOver(event)" ondragleave="onTodoDragLeave(event)" ondrop="onTodoDrop(event,'${e.id}','${esc(cat)}')">
          <div style="display:flex;align-items:center;gap:8px">
            <div style="cursor:grab;color:var(--text3);font-size:10px">⠿</div>
            <div class="todo-check ${e.done?'done':''}" onclick="event.stopPropagation();toggleTodo('${e.id}')"></div>
            <div style="flex:1;font-size:13px;cursor:pointer;${e.done?'text-decoration:line-through;opacity:0.4':''}" onclick="openEventDetail('${e.id}')">${esc(e.title)} ${renderCarriedTodoBadge(e)}${cl&&cl.total>0?` <span style="font-size:10px;color:${cl.completed===cl.total?'var(--green)':'var(--yellow)'}">(${cl.completed}/${cl.total})</span>`:''}</div>
            ${!e.done&&e.date<todayStr()?`<button onclick="event.stopPropagation();quickPostpone('${e.id}')" style="background:none;border:none;cursor:pointer;font-size:10px;color:var(--text3);padding:0 2px" title="내일로">→</button>`:''}
          </div>
          <div style="margin-left:34px">${renderCarriedTodoMeta(e)}</div>
          ${e.memo?`<div style="font-size:10px;color:var(--text3);margin:2px 0 0 34px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">📝 ${esc(e.memo.split('\\n')[0])}</div>`:''}
          ${cl&&cl.total>0?`<div id="clToggle_${e.id}" style="display:none;margin:4px 0 0 34px;padding:4px 0;border-top:1px solid var(--bg4)"></div>
          <button onclick="event.stopPropagation();toggleInlineChecklist('${e.id}')" style="background:none;border:none;cursor:pointer;font-size:9px;color:var(--text3);margin-left:34px;padding:2px 0;font-family:inherit">☑ 체크리스트 ${cl.completed}/${cl.total}</button>`:''}
        </div>`;
      });
      catContent += `<div class="todo-cat-drop" data-drop-cat="${esc(cat)}" ondragover="event.preventDefault();this.style.background='var(--red-bg)'" ondragleave="this.style.background=''" ondrop="onTodoDropToCat(event,'${esc(cat)}');this.style.background=''" style="padding:4px 0;border-radius:4px;transition:background 0.15s">
        <button onclick="inlineAddTodo('${selectedDate}','${esc(cat)}')" style="background:none;border:none;cursor:pointer;font-size:11px;color:${color};font-family:inherit;padding:2px 0">+ 할 일 추가</button>
      </div>`;
      const badge = catTodos.length ? `${doneCnt}/${catTodos.length}` : '';
      h += accordion('● ' + esc(cat), badge, color, catContent, false);
    });
  }
  // 미분류
  const uncatTodos = dayEvs.filter(e => e.type === 'todo' && (!e.todoCat || !allCats[e.todoCat]));
  if (uncatTodos.length) {
    let uncatContent = '';
    uncatTodos.forEach(e => {
      uncatContent += `<div class="ev-item" style="padding:5px 4px;align-items:flex-start"><div class="todo-check ${e.done?'done':''}" onclick="event.stopPropagation();toggleTodo('${e.id}')"></div>
        <div style="flex:1;min-width:0"><div style="font-size:13px;cursor:pointer;${e.done?'text-decoration:line-through;opacity:0.4':''}" onclick="openEventDetail('${e.id}')">${esc(e.title)} ${renderCarriedTodoBadge(e)}</div>${renderCarriedTodoMeta(e)}</div></div>`;
    });
    h += accordion('● 미분류', uncatTodos.length+'', 'var(--text3)', uncatContent, true);
  }
  if (!nonTodos.length && !catKeys.length && !uncatTodos.length) {
    h += '<div class="day-empty-note">이 날짜에는 등록된 개인 일정이 없습니다.</div>';
  }
  h += `<div class="day-section-actions">

let listDateFilter = 'month'; // 'month', 'today', 'incomplete', 'today_incomplete'
let hideRepeatEvents = true; // 방안 B: 반복 일정 숨김 토글 (기본 숨김)
let listGroupByOwner = false;

function eventOwnerLabel(e) {
  return String(e?.ownerName || e?.owner_name || (e?.ownerId === currentUser?.uid ? userDoc?.name : '') || '미배정').trim() || '미배정';
}

function groupEventsByOwner(evs) {
  const groups = {};
  evs.forEach(e => {
    const name = eventOwnerLabel(e);
    if (!groups[name]) groups[name] = [];
    groups[name].push(e);
  });
  return Object.entries(groups)
    .sort(([a], [b]) => a.localeCompare(b, 'ko'))
    .map(([name, items]) => [name, items.sort((a,b) => (a.date || '').localeCompare(b.date || '') || (a.time || '').localeCompare(b.time || ''))]);
}

function eventDateMeta(e) {
  const dateLabel = e?.date ? e.date.slice(5) : '';
  const timeLabel = e?.time ? ` ${e.time}` : '';
  return dateLabel || timeLabel ? `<div style="font-size:10px;color:var(--text3);margin-top:2px">📅 ${dateLabel}${timeLabel}</div>` : '';
}

function renderListView() {
  let baseEvs = filteredEventsNoReport();

  // 날짜 필터
  const todayD = todayStr();
  const monthStr = `${currentYear}-${String(currentMonth).padStart(2,'0')}`;
  if (listDateFilter === 'today') baseEvs = baseEvs.filter(e => e.date === todayD);
  else if (listDateFilter === 'month') baseEvs = baseEvs.filter(e => e.date.startsWith(monthStr));
  else if (listDateFilter === 'incomplete') baseEvs = baseEvs.filter(e => e.type === 'todo' && !e.done);
  else if (listDateFilter === 'today_incomplete') baseEvs = baseEvs.filter(e => e.type === 'todo' && !e.done && e.date === todayD);

  // 방안 B+C: 반복 일정 필터링
  if (hideRepeatEvents) {
    baseEvs = baseEvs.filter(e => {
      if (!e.repeatType) return true; // 반복 아닌 건 통과
      // 오늘 이전 + 미완료, 또는 오늘인 건 표시
      if (e.date <= todayD) return true;
      // 오늘 이후 반복은 숨김
      return false;
    });
  }

	  const sorted = baseEvs.sort((a,b)=>a.date.localeCompare(b.date));
	  const repeatCount = filteredEventsNoReport().filter(e => e.repeatType && e.date > todayD).length;
	  let filterBar = `<div style="display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap">
	    <button class="sub-tab ${listDateFilter==='today'?'active':''}" onclick="listDateFilter='today';renderPage()">오늘</button>
	    <button class="sub-tab ${listDateFilter==='month'?'active':''}" onclick="listDateFilter='month';renderPage()">${currentMonth}월</button>
	    <button class="sub-tab ${listDateFilter==='incomplete'?'active':''}" onclick="listDateFilter='incomplete';renderPage()" style="${listDateFilter==='incomplete'?'background:var(--yellow)':''}">미완료</button>
	    ${listDateFilter==='incomplete'?`<button onclick="bulkPostponeOverdue()" style="padding:4px 10px;border-radius:8px;border:1px solid var(--red);background:transparent;color:var(--red);font-size:11px;cursor:pointer;font-family:inherit">⏩ 지난 미완료 → 오늘로</button>`:''}
	    <button class="sub-tab ${listGroupByOwner?'active':''}" onclick="listGroupByOwner=!listGroupByOwner;renderPage()" style="${listGroupByOwner?'background:var(--blue);color:#fff':''}">👤 사람별</button>
	    <button class="sub-tab" onclick="hideRepeatEvents=!hideRepeatEvents;renderPage()" style="margin-left:auto;${hideRepeatEvents?'':'background:var(--blue);color:#fff'}">${hideRepeatEvents?'🔁 반복 보기'+(repeatCount?' ('+repeatCount+')':''):'🔁 반복 숨기기'}</button>
	  </div>`;

	  if (!sorted.length) return filterBar + '<div style="color:var(--text3);text-align:center;padding:40px 0">일정 없음</div>';

	  if (listGroupByOwner) {
	    const grouped = groupEventsByOwner(sorted);
	    let h = '';
	    grouped.forEach(([owner, evs]) => {
	      const content = evs.map(e => evItemHtml(e, { showDate: true })).join('');
	      h += accordion(`👤 ${esc(owner)}`, `${evs.length}건`, 'var(--text)', content, false);
	    });
	    return filterBar + h;
	  }

  // 월별로 그룹
  const byMonth = {};
  sorted.forEach(e => {
    const m = e.date.slice(0,7); // "2026-04"
    if (!byMonth[m]) byMonth[m] = {};
    if (!byMonth[m][e.date]) byMonth[m][e.date] = [];
    byMonth[m][e.date].push(e);
  });

  let h = '';
  const currentMonthStr = `${currentYear}-${String(currentMonth).padStart(2,'0')}`;
  Object.entries(byMonth).forEach(([month, days]) => {
    const [y,m] = month.split('-');
    const monthLabel = `${y}년 ${parseInt(m)}월`;
    const totalEvs = Object.values(days).flat().length;
    const isCurrentMonth = month === currentMonthStr;

    let dayContent = '';
    Object.entries(days).forEach(([ds, evs]) => {
      const dateObj = new Date(ds);
      const dayNames = ['일','월','화','수','목','금','토'];
      dayContent += `<div style="font-size:12px;font-weight:600;color:var(--text3);padding:10px 0 4px;border-bottom:1px solid var(--bg4)">${ds.slice(5)} (${dayNames[dateObj.getDay()]})</div>`;
      evs.forEach(e => dayContent += evItemHtml(e));
    });

    h += accordion(`📅 ${monthLabel}`, `${totalEvs}건`, 'var(--text)', dayContent, !isCurrentMonth);
  });
  return filterBar + h;
}

// 아코디언 헬퍼
let _accId = 0;
function accordion(title, badge, color, content, collapsed) {
  // _accId kept so existing markup around the page that still relies on a
  // unique per-render id does not break, but expand/collapse is now routed
  // through the toggleAcc() helper and stable data-acc-key, so a partial
  // re-render can preserve whether the user had this section open.
  _accId += 1;
  const key = String(title).replace(/[^a-zA-Z0-9가-힣ㄱ-ㅎㅏ-ㅣ_-]+/g, '_');
  return `<div class="acc-wrap" data-acc-key="${esc(key)}" style="margin-bottom:6px">
    <div class="acc-head" onclick="toggleAcc(this)"
      style="display:flex;align-items:center;gap:6px;padding:6px 4px;cursor:pointer;border-radius:6px;transition:background 0.1s"
      onmouseover="this.style.background='var(--bg3)'" onmouseout="this.style.background=''">
      <span class="acc-arrow" style="font-size:9px;color:var(--text3);width:12px">${collapsed?'▶':'▼'}</span>
      <span style="font-size:12px;font-weight:700;color:${color};flex:1">${title}</span>
      ${badge?`<span style="font-size:10px;color:var(--text3)">${badge}</span>`:''}
    </div>
    <div class="acc-body" style="display:${collapsed?'none':'block'};padding-left:18px">${content}</div>
  </div>`;
}

function toggleAcc(headerEl) {
  const wrap = headerEl.closest('.acc-wrap');
  if (!wrap) return;
  const body = wrap.querySelector(':scope > .acc-body');
  const arrow = headerEl.querySelector('.acc-arrow');
  if (!body) return;
  const isOpen = body.style.display !== 'none';
  body.style.display = isOpen ? 'none' : '';
  if (arrow) arrow.textContent = isOpen ? '▶' : '▼';
}

let calShowIncomplete = true;

// 패널 리사이즈
function startPanelResize(e) {
  e.preventDefault();
  const resizer = document.getElementById('panelResizer');
  const panel = document.getElementById('rightPanel');
  if (!panel) return;
  resizer.classList.add('active');
  const startX = e.clientX;
  const startW = panel.offsetWidth;
  function onMove(ev) {
    const diff = startX - ev.clientX;
    const maxW = Math.min(600, window.innerWidth - 650);
    const newW = Math.max(250, Math.min(maxW, startW + diff));
    panel.style.width = newW + 'px';
    window._panelWidth = newW;
  }
  function onUp() {
    resizer.classList.remove('active');
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
  }
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
}

async function toggleInlineChecklist(eventId) {
  const el = document.getElementById('clToggle_'+eventId);
  if (!el) return;
  const cacheKey = String(eventId);
  if (openInlineChecklistIds.has(cacheKey) && el.style.display !== 'none') {
    openInlineChecklistIds.delete(cacheKey);
    el.style.display = 'none';
    return;
  }
  openInlineChecklistIds.add(cacheKey);
  const cachedItems = getChecklistItemsLocal(eventId);
  if (cachedItems.length) {
    renderInlineChecklistItems(eventId, cachedItems);
    return;
  }
  el.style.display = '';
  el.innerHTML = '<div style="font-size:10px;color:var(--text3)">로딩...</div>';
  try {
    const items = await fetchChecklistItems(eventId);
    renderInlineChecklistItems(eventId, items);
  } catch(e) { el.innerHTML = '<div style="font-size:10px;color:var(--red)">로드 실패</div>'; }
}

  if (!overdue.length) return alert('미완료 항목이 없습니다');

function filteredEvents() {
  return events.filter(e => {
    if (e.deleted) return false;
    if (viewScope === 'personal') return isMyCalendarEvent(e);
    if (viewScope === 'team') return e.scope === 'team';
    return true;
  });
}
// 보고서확인 제외 필터 (목록/주간리포트용)
function filteredEventsNoReport() {
  return filteredEvents().filter(e => !e.title.includes('보고서 확인') && !e.title.includes('보고서 작성'));
}

function shouldShowEventOnDate(e, ds) {
  if (!e || e.deleted) return false;
  if (isCarriablePeriodTodo(e)) {
    const today = todayStr();
    if (e.date < today) return ds === today;
    if (e.date === ds) return true;
    return !!(e.endDate && e.date <= ds && e.endDate >= ds);
  }
  if (e.date === ds) return true;
  if (e.done && e.date < ds) return false;
  return !!(e.endDate && e.date <= ds && e.endDate >= ds);
}

function shouldShowEventInMonth(e, monthStart, monthEnd) {
  if (!e || e.deleted) return false;
  if (isCarriablePeriodTodo(e) && e.date < todayStr()) {
    const today = todayStr();
    return today >= monthStart && today <= monthEnd;
  }
  if (e.done) return e.date >= monthStart && e.date <= monthEnd;
  const start = e.date;
  const end = e.endDate || e.date;
  return start <= monthEnd && end >= monthStart;
}

function isCarriablePeriodTodo(e) {
  return !!(e && e.type === 'todo' && !e.done && e.endDate && e.endDate !== e.date);
}

function shouldCarryPeriodTodoToToday(e, ds) {
  return isCarriablePeriodTodo(e) && e.date < todayStr() && ds === todayStr();
}

function eventForDisplayDate(e, ds) {
  if (!shouldCarryPeriodTodoToToday(e, ds)) return e;
  return {
    ...e,
    carriedTodo: true,
    carriedFrom: e.date,
    carriedUntil: e.endDate,
    carriedReason: e.endDate < todayStr() ? 'overdue' : 'active'
  };
}

function renderCarriedTodoBadge(e) {
  return e?.carriedTodo ? '<span class="todo-carried-badge">미완료했던 일</span>' : '';
}

function renderCarriedTodoMeta(e) {
  if (!e?.carriedTodo) return '';
  const range = e.carriedUntil ? `${e.carriedFrom} ~ ${e.carriedUntil}` : e.carriedFrom;
  return `<div class="todo-carried-meta">기존 기간 ${range}</div>`;
}

// 특정 날짜에 보이는 이벤트 (기간 일정 포함)
function eventsForDate(ds) {
  return filteredEvents().filter(e => shouldShowEventOnDate(e, ds)).map(e => eventForDisplayDate(e, ds));
}

function isMyCalendarEvent(e) {
  if (!e || !currentUser) return false;
  return e.ownerId === currentUser.uid || (e.isShared && e.projectId && e.type === 'meeting');
}
let weeklyReportScope = 'personal';
async function renderWeeklyInline(body, prefix) {
  body.innerHTML = prefix + '<div style="color:var(--text3);text-align:center;padding:20px">로딩 중...</div>';
  try {
    const r = await api('GET','/weekly-report');
    const allEvs = r.events || [];
    const noReport = allEvs.filter(e => !e.title?.includes('보고서 확인') && !e.title?.includes('보고서 작성'));
    const personal = noReport.filter(e => e.owner_id === currentUser.uid);
    const team = noReport.filter(e => e.scope === 'team');
    const filtered = weeklyReportScope === 'personal' ? personal : team;

    const todos = filtered.filter(e => e.type === 'todo');
    const doneTodos = todos.filter(e => e.done);
    const meetings = filtered.filter(e => e.type === 'meeting');

    let h = prefix;
    h += `<div style="display:flex;gap:6px;margin-bottom:12px">
      <button class="sub-tab ${weeklyReportScope==='personal'?'active':''}" onclick="weeklyReportScope='personal';renderPage()" style="${weeklyReportScope==='personal'?'background:var(--red)':''}">🔒 내 일정</button>
      <button class="sub-tab ${weeklyReportScope==='team'?'active':''}" onclick="weeklyReportScope='team';renderPage()" style="${weeklyReportScope==='team'?'background:var(--blue)':''}">👥 팀 일정</button>
    </div>`;
    h += `<div class="stats">
      <div class="stat-card"><div class="stat-num">${filtered.length}</div><div class="stat-label">일정</div></div>
      <div class="stat-card"><div class="stat-num" style="color:var(--green)">${todos.length?Math.round(doneTodos.length/todos.length*100):0}%</div><div class="stat-label">완료율</div></div>
      <div class="stat-card"><div class="stat-num" style="color:var(--yellow)">${doneTodos.length}/${todos.length}</div><div class="stat-label">할 일</div></div>
      <div class="stat-card"><div class="stat-num" style="color:var(--blue)">${meetings.length}</div><div class="stat-label">미팅</div></div>
    </div>`;
    h += `<div style="font-size:12px;color:var(--text3);text-align:center;margin-bottom:16px">${r.period}</div>`;
    const allTypes = getAllEventTypes();
    const days = ['월','화','수','목','금','토','일'];
    days.forEach(day => {
      const dayEvs = (r.byDay[day] || []).filter(e => !e.title?.includes('보고서 확인') && !e.title?.includes('보고서 작성')).filter(e => weeklyReportScope==='personal' ? e.owner_id===currentUser.uid : e.scope==='team');
      h += `<div style="margin-bottom:10px"><div style="font-size:12px;font-weight:600;color:var(--text3);padding:4px 0;border-bottom:1px solid var(--border)">${day}요일 (${dayEvs.length}건)</div>`;
      if (dayEvs.length) {
        dayEvs.forEach(e => {
          const t = allTypes[e.type]||{icon:'📌'};
          const owner = weeklyReportScope==='team' && e.owner_name ? `<span style="font-size:10px;color:var(--text3);margin-left:4px">👤${esc(e.owner_name)}</span>` : '';
          const matchRoom3 = weeklyReportScope==='team' ? chatRooms.find(r => r.name.includes(e.title?.slice(0,10))) : null;
          const chatLink = matchRoom3 ? `<span onclick="event.stopPropagation();openChatRoomById('${matchRoom3.id}')" style="font-size:9px;color:var(--blue);cursor:pointer;margin-left:4px">💬</span>` : '';
          h += `<div style="display:flex;align-items:center;gap:6px;padding:4px 8px;font-size:12px;${e.done?'text-decoration:line-through;opacity:0.5':''}">
            <span>${t.icon}</span><span style="flex:1">${esc(e.title)}${owner}${chatLink}</span>
            ${e.time?`<span style="color:var(--text3);font-size:10px">${e.time}</span>`:''}
          </div>`;
        });
      } else h += '<div style="padding:4px 8px;font-size:12px;color:var(--text3)">없음</div>';
      h += '</div>';
    });
    body.innerHTML = h;
  } catch(e) { body.innerHTML = prefix + '<div style="color:var(--red);text-align:center;padding:20px">로드 실패</div>'; }
}

// TIMETABLE (일과표)
// ══════════════════════════════════════════════════════════════
let timetableDate = null; // 현재 보고 있는 날짜

function getTimetableDate() {
  if (!timetableDate) timetableDate = todayStr();
  return timetableDate;
}

async function renderTimetablePage(body, prefix) {
  const isActiveRender = createPageRenderGuard('calendar', body);
  const date = getTimetableDate();
  body.innerHTML = prefix + '<div style="color:var(--text3);text-align:center;padding:20px">로딩 중...</div>';
  try {
    const entries = await api('GET', '/timetable?date=' + date);
    if (!isActiveRender()) return;
    const dateObj = new Date(date);
    const dayNames = ['일','월','화','수','목','금','토'];
    const dayName = dayNames[dateObj.getDay()];
    const isToday = date === todayStr();

    let h = prefix;
    // 날짜 네비게이션
    h += `<div style="display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:16px">
      <button onclick="moveTimetableDate(-1)" style="background:none;border:none;cursor:pointer;font-size:18px;color:var(--text2);padding:4px">‹</button>
      <span style="font-size:15px;font-weight:600;min-width:160px;text-align:center">${date} (${dayName})${isToday?' · 오늘':''}</span>
      <button onclick="moveTimetableDate(1)" style="background:none;border:none;cursor:pointer;font-size:18px;color:var(--text2);padding:4px">›</button>
      ${!isToday?`<button onclick="timetableDate=null;renderPage()" style="padding:3px 10px;border-radius:6px;background:var(--red);color:#fff;border:none;font-size:11px;cursor:pointer">오늘</button>`:''}
    </div>`;

    // 버튼 바
    h += `<div style="display:flex;gap:6px;margin-bottom:16px">
      <button onclick="openImportEvents('${date}')" style="flex:1;padding:8px;border-radius:8px;background:var(--bg3);border:1px solid var(--border);color:var(--text);cursor:pointer;font-size:12px;font-family:inherit">📅 일정 불러오기</button>
      <button onclick="openAddTimetableEntry('${date}')" style="flex:1;padding:8px;border-radius:8px;background:var(--red);border:none;color:#fff;cursor:pointer;font-size:12px;font-family:inherit;font-weight:600">+ 직접 추가</button>
    </div>`;

    // 완료 통계
    const total = entries.length;
    const doneCount = entries.filter(e => e.done).length;
    if (total > 0) {
      const pct = Math.round(doneCount / total * 100);
      h += `<div style="display:flex;align-items:center;gap:10px;margin-bottom:16px;padding:10px;background:var(--card);border:1px solid var(--border);border-radius:10px">
        <div style="flex:1;height:6px;background:var(--bg3);border-radius:3px;overflow:hidden"><div style="height:100%;width:${pct}%;background:${pct===100?'var(--green)':'var(--yellow)'};border-radius:3px;transition:width 0.3s"></div></div>
        <span style="font-size:12px;font-weight:600;color:${pct===100?'var(--green)':'var(--text2)'}">${doneCount}/${total} (${pct}%)</span>
      </div>`;
    }

    // 일과표 목록
    if (!entries.length) {
      h += '<div style="color:var(--text3);text-align:center;padding:40px 0">일과표가 비어있습니다<br><span style="font-size:12px">일정을 불러오거나 직접 추가하세요</span></div>';
    } else {
      h += '<div style="display:flex;flex-direction:column;gap:2px">';
      entries.forEach(e => {
        const carried = e.carried_from ? `<span style="font-size:9px;color:var(--red);margin-left:4px">⚠️ ${e.carried_from}에서 이월</span>` : '';
        const linked = e.event_id ? '<span style="font-size:9px;color:var(--blue);margin-left:4px">📅</span>' : '';
        h += `<div style="display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--card);border:1px solid var(--border);border-radius:8px;${e.done?'opacity:0.5':''}">
          <div onclick="toggleTimetableEntry(${e.id})" style="width:22px;height:22px;border-radius:6px;border:2px solid ${e.done?'var(--green)':'var(--text3)'};background:${e.done?'var(--green)':'transparent'};cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all 0.15s">
            ${e.done?'<span style="color:#fff;font-size:12px;font-weight:700">✓</span>':''}
          </div>
          <div style="flex:1;min-width:0">
            <div style="font-size:13px;font-weight:500;${e.done?'text-decoration:line-through':''}">${esc(e.title)}${linked}${carried}</div>
            <div style="font-size:11px;color:var(--text3);margin-top:1px">${e.start_time} ~ ${e.end_time}</div>
          </div>
          <div style="display:flex;gap:4px;flex-shrink:0">
            <button onclick="openEditTimetableEntry(${e.id},'${esc(e.title)}','${e.start_time}','${e.end_time}')" style="background:none;border:none;cursor:pointer;font-size:12px;padding:2px">✏️</button>
            <button onclick="deleteTimetableEntry(${e.id})" style="background:none;border:none;cursor:pointer;font-size:12px;padding:2px">🗑</button>
          </div>
        </div>`;
      });
      h += '</div>';
    }

    if (!isActiveRender()) return;
    body.innerHTML = h;
  } catch(e) {
    if (!isActiveRender()) return;
    body.innerHTML = prefix + '<div style="color:var(--red);text-align:center;padding:20px">로드 실패</div>';
  }
}

function moveTimetableDate(delta) {
  const d = new Date(getTimetableDate());
  d.setDate(d.getDate() + delta);
  timetableDate = d.toISOString().slice(0, 10);
  renderPage();
}

async function toggleTimetableEntry(id) {
  try {
    const r = await api('PUT', '/timetable/' + id + '/toggle');
    // 캘린더 이벤트 동기화 반영을 위해 events도 갱신
    await fetchEvents();
    renderPage(true);
  } catch(e) { alert('실패'); }
}

    <div class="form-group"><label class="form-label">업무 내용</label><input class="form-input" id="ttTitle" placeholder="업무 내용 입력"></div>
    <div style="display:flex;gap:8px">
      <div class="form-group" style="flex:1"><label class="form-label">시작 시간</label><input class="form-input" type="time" id="ttStart" value="09:00"></div>
      <div class="form-group" style="flex:1"><label class="form-label">종료 시간</label><input class="form-input" type="time" id="ttEnd" value="09:30"></div>

async function saveTimetableEntry(date) {
  const title = document.getElementById('ttTitle')?.value?.trim();
  const startTime = document.getElementById('ttStart')?.value;
  const endTime = document.getElementById('ttEnd')?.value;
  if (!title) return alert('업무 내용을 입력하세요');
  if (!startTime || !endTime) return alert('시간을 입력하세요');
  try {
    await api('POST', '/timetable', { date, startTime, endTime, title });
    closeModal();
    renderPage();
  } catch(e) { alert('저장 실패'); }
}
