async function savePermissions(uid) {
	  const viewableGroups = Array.from(document.querySelectorAll('.vg-check:checked')).map(el=>el.value);
	  const chatOnlyEl = document.getElementById('perm_chat_only');
	  const externalCalendarOnlyEl = document.getElementById('perm_external_calendar_only');
  await api('PUT','/users/'+uid+'/permissions',{
    canViewAllAttendance: document.getElementById('perm_att').checked,
    canViewAllReports: document.getElementById('perm_rep').checked,
    canManageTeam: document.getElementById('perm_team').checked,
    viewableGroups
  });
  // chat_only has its own endpoint so admin flips it in the same
  // modal but persists via a clearly-scoped PUT.
	  if (chatOnlyEl && !chatOnlyEl.disabled) {
    try {
      await api('PUT','/users/'+uid+'/chat-only',{ chatOnly: chatOnlyEl.checked });
    } catch (err) {
      alert('채팅 전용 설정 저장 실패: ' + (err?.message || err));
	  }
	  if (externalCalendarOnlyEl && !externalCalendarOnlyEl.disabled) {
	    try {
	      await api('PUT','/users/'+uid+'/external-calendar-only',{ externalCalendarOnly: externalCalendarOnlyEl.checked });
	    } catch (err) {
	      alert('외부 캘린더 설정 저장 실패: ' + (err?.message || err));
	    }
	  }
  }
  closeModal();
  alert('권한이 저장되었습니다!');
  openAdminPanel();
}

    </div>
    <div class="form-group"><label class="form-label">종류</label><div style="display:flex;flex-wrap:wrap;gap:6px" id="typeSelector">
    ${Object.entries(allTypes).map(([k,t])=>`<button class="sub-tab ${k===selType?'active':''}" data-type="${k}" onclick="selectType(this)">${t.icon} ${t.label}</button>`).join('')}</div></div>
    <div class="form-group"><label class="form-label">제목</label><input class="form-input" id="evTitle" value="${esc(ev.title)}" placeholder="제목"></div>
    <div class="form-group"><label class="form-label">시작일</label><input class="form-input" type="date" id="evDate" value="${ev.date}"></div>
    <div class="form-group"><label class="form-label">마감일 (선택)</label><input class="form-input" type="date" id="evEndDate" value="${ev.endDate||''}"></div>
    <div class="form-group"><label class="form-label">시간 (선택)</label><input class="form-input" type="time" id="evTime" value="${ev.time||''}"></div>
    <div class="form-group"><label class="form-label">리마인더</label><select class="form-input" id="evReminder">${renderEventReminderOptions(ev.reminder || '')}</select><div style="font-size:11px;color:var(--text3);margin-top:4px">시간을 지정한 일정만 PC/모바일 푸시가 발송됩니다.</div></div>
    <div class="form-group"><label class="form-label">메모 (선택)</label><textarea class="form-input" id="evMemo" rows="2" style="resize:none">${esc(ev.memo||'')}</textarea></div>
    <div class="form-group" id="todoCatGroup" style="display:${selType==='todo'?'':'none'}"><label class="form-label">카테고리</label><div style="display:flex;flex-wrap:wrap;gap:6px">
    ${Object.entries(allCats).map(([name,color])=>`<button class="sub-tab ${name===selCat?'active':''}" data-cat="${esc(name)}" onclick="selectCat(this)" style="border-color:${color};color:${color}">${esc(name)}</button>`).join('')}
    <button class="sub-tab" onclick="addTodoCatFromModal()" style="color:var(--text3)">+ 추가</button></div></div>
    <div style="display:flex;gap:8px;margin-top:16px">
      <button class="btn btn-dark" onclick="closeModal()" style="flex:1">취소</button>
      <button class="btn btn-red" onclick="updateEvent('${ev.id}')" style="flex:1">저장</button></div>`;
  openModal(h);
  if (evScope === 'team') {
    try {
      const existingShares = await api('GET','/events/'+ev.id+'/shares');
      await setEvScope('team', existingShares.map(user => user.uid));
    } catch (e) {
      await setEvScope('team', []);
    }
  }
}

async function updateEvent(id) {
  const title = document.getElementById('evTitle').value.trim();
  const date = document.getElementById('evDate').value;
  if (!title||!date) return alert('제목과 날짜 필수');
  const reminder = getValidatedEventReminderValue();
  if (reminder === undefined) return;
  if (isExternalCalendarOnlyUser() && evScope === 'team') return alert('외부 캘린더 계정은 본인 일정만 등록할 수 있습니다.');
  const shareWith = evScope==='team' ? Array.from(document.querySelectorAll('.share-check:checked')).map(el=>el.value) : [];
  const updated = await api('PUT','/events/'+id,{
    type:selType, title, date,
    endDate:document.getElementById('evEndDate')?.value||null,
    time:document.getElementById('evTime').value,
    memo:document.getElementById('evMemo').value.trim(),
    todoCat:selType==='todo'?selCat:null,
    reminder,
    scope:evScope,
    shareWith
  });
  closeModal();
  upsertLocalEvent(updated);
  refreshCalendarUi({ keepScroll: true });
}

</script>
</body>
</html>
