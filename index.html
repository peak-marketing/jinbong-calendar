    h += `<div class="card"><div class="card-title" style="color:var(--green)">✅ 알림 허용 및 기기 연결됨</div><div class="card-meta">현재 ${fcmStatus.tokenCount}개의 기기 토큰이 등록되어 있습니다.${fcmStatus.lastRegisteredAt ? ' 마지막 연결: ' + formatDateTimeLabel(fcmStatus.lastRegisteredAt) : ''} 안드로이드에서 앱 종료 상태 알림이 안 오면 Chrome 배터리 사용을 제한 없음으로 설정하세요.</div></div>`;
  } else if (notifStatus === 'granted') {
    h += `<div class="card"><div class="card-title" style="color:var(--yellow)">⚠️ 알림 권한은 있지만 기기 연결이 없습니다</div><div class="card-meta">현재 이 계정에 등록된 기기 토큰이 없습니다. 이 상태면 모바일/PC 모두 푸시가 오지 않습니다.${isIosDevice() && !isStandaloneMode() ? ' iPhone은 Safari에서 홈 화면에 추가한 뒤 허용해야 정상 등록됩니다.' : ''}</div><button onclick="reconnectPushNotifications()" class="btn btn-red" style="width:100%;margin-top:12px">알림 다시 연결</button></div>`;
  } else if (notifStatus === 'denied') {
    h += `<div class="card"><div class="card-title" style="color:var(--red)">❌ 알림 차단됨</div><div class="card-meta">브라우저 설정에서 알림을 허용해주세요</div></div>`;
  } else if (notifStatus === 'unsupported') {
    h += `<div class="card"><div class="card-title" style="color:var(--text3)">⚠️ 알림 미지원</div><div class="card-meta">이 브라우저에서는 알림을 지원하지 않습니다</div></div>`;
  } else {
    h += `<div class="card" onclick="requestNotifPermission()" style="cursor:pointer"><div class="card-title" style="color:var(--blue)">🔔 알림 허용하기</div><div class="card-meta">탭하면 알림 권한을 요청합니다</div></div>`;
  }
  if (notifStatus === 'granted') {
    h += `<div class="card"><div class="card-title">🧪 알림 테스트</div><div class="card-meta">로컬 알림과 실제 푸시를 따로 눌러서 어느 단계에서 막히는지 바로 확인할 수 있습니다.</div><div style="display:flex;gap:8px;margin-top:12px"><button class="btn btn-dark" onclick="runLocalNotificationTest()" style="flex:1">로컬 알림 테스트</button><button class="btn btn-red" onclick="runPushNotificationTest()" style="flex:1">푸시 테스트</button></div></div>`;
  }
  const prefs = getNotificationPrefs();
  h += `<div class="card" onclick="openNotificationSettings()" style="cursor:pointer"><div class="card-title">⚙️ 알림 상세 설정</div><div class="card-meta">공지사항은 항상 즉시 수신, 채팅 ${prefs.notifyChat?'ON':'OFF'}, 일정 리마인더 ${prefs.notifyEventReminder?'ON':'OFF'}, 익일 미완료 ${prefs.notifyOverdueMorning?'ON':'OFF'}, 오늘 미완료(평일 19시) ${prefs.notifyTodayEvening?'ON':'OFF'}</div></div>`;
  if (canOfferInstall()) {
    const installLabel = isIosDevice() ? '홈 화면에 추가' : '앱 설치';
    h += `<div class="card" onclick="openInstallExperience()" style="cursor:pointer"><div class="card-title">📲 ${installLabel}</div><div class="card-meta">${isIosDevice() ? 'iPhone에서는 안내에 따라 홈 화면에 추가하면 바로 앱처럼 설치됩니다.' : 'Android에서는 설치 팝업으로 바로 앱처럼 추가할 수 있습니다.'}</div></div>`;
  }

  h += '<div style="font-size:14px;font-weight:700;margin:20px 0 12px">🔗 피크마케팅 서비스</div>';
  try {
    const bookmarks = await api('GET','/bookmarks');
    if (!isActiveRender()) return;
    if (bookmarks.length) {
      h += '<div class="bm-grid">';
      bookmarks.forEach(b => {
        const bmUrl = b.url.startsWith('http') ? b.url : 'https://'+b.url;
        h += `<div class="bm-card" onclick="openBookmark('${esc(bmUrl)}')">
          <div class="bm-icon">${esc(b.icon)}</div>
          <div class="bm-name">${esc(b.name)}</div>
          ${b.description?`<div class="bm-desc">${esc(b.description)}</div>`:''}
        </div>`;
      });
      h += '</div>';
    } else {
      h += '<div style="color:var(--text3);font-size:13px">등록된 서비스 없음</div>';
    }
  } catch(e) {}

  if (isAdmin || userDoc.role === 'manager') {
    h += `<div style="margin-top:12px"><button class="btn btn-dark" onclick="openBookmarkManager()" style="width:100%">⚙️ 서비스 관리</button></div>`;
  }

  h += `<div style="margin-top:24px"><button class="btn btn-dark" onclick="doSignOut()" style="width:100%;color:var(--red)">로그아웃</button></div>`;
  if (!isActiveRender()) return;
  body.innerHTML = h;
}

function openBookmark(url) {
  window.open(url, '_blank', 'noopener,noreferrer');
}

function openBookmarkManager() {
  const iconOptions = ['🔗','🌐','📊','📱','💼','🛒','📝','🎯','📈','💰','🔍','📧','💻','🎨','📋','⚡','🏪','📰','🤖','🔧'];
  let h = `<div class="modal-title">🔗 서비스 관리</div>
    <div style="font-size:12px;font-weight:600;color:var(--text2);margin-bottom:8px">새 서비스 추가</div>
    <div class="form-group"><input class="form-input" id="bmName" placeholder="서비스 이름" style="font-size:13px"></div>
    <div class="form-group"><input class="form-input" id="bmUrl" placeholder="URL (예: naver.com)" style="font-size:13px"></div>
    <div class="form-group"><input class="form-input" id="bmDesc" placeholder="설명 (선택)" style="font-size:13px"></div>
    <div class="form-group"><label class="form-label">아이콘 선택</label>
      <div style="display:flex;flex-wrap:wrap;gap:6px" id="bmIconPicker">
        ${iconOptions.map(ic => `<button onclick="document.getElementById('bmIconSelected').value='${ic}';document.querySelectorAll('#bmIconPicker button').forEach(b=>b.style.background='');this.style.background='var(--red)'"
          style="width:36px;height:36px;border-radius:8px;border:1px solid var(--border);background:transparent;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center">${ic}</button>`).join('')}
      </div>
      <input type="hidden" id="bmIconSelected" value="🔗">
    </div>
    <button onclick="addBookmarkFromManager()" class="btn btn-red" style="width:100%;margin-bottom:16px">추가</button>
    <div style="font-size:12px;font-weight:600;color:var(--text2);margin-bottom:8px">등록된 서비스</div>
    <div id="bmList"></div>
    <button class="btn btn-dark" onclick="closeModal()" style="width:100%;margin-top:12px">닫기</button>`;
  openModal(h);
  loadBookmarkList();
}

async function loadBookmarkList() {
  const el = document.getElementById('bmList');
  if (!el) return;
  try {
    const bookmarks = await api('GET','/bookmarks');
    if (!bookmarks.length) { el.innerHTML='<div style="font-size:12px;color:var(--text3)">등록된 서비스 없음</div>'; return; }
    el.innerHTML = bookmarks.map(b => `<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--bg4)">
      <span style="font-size:18px">${esc(b.icon)}</span>
      <div style="flex:1;min-width:0">
        <div style="font-size:13px;font-weight:600">${esc(b.name)}</div>
        <div style="font-size:10px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(b.url)}</div>
      </div>
      <button onclick="editBookmark('${b.id}','${esc(b.name)}','${esc(b.url)}','${esc(b.icon)}','${esc(b.description||'')}')" style="background:none;border:none;cursor:pointer;color:var(--text3);font-size:12px">✏️</button>
      <button onclick="deleteBookmark('${b.id}')" style="background:none;border:none;cursor:pointer;color:var(--red);font-size:12px">🗑</button>
    </div>`).join('');
  } catch(e) {}
}

async function addBookmarkFromManager() {
  const name = document.getElementById('bmName').value.trim();
  const url = document.getElementById('bmUrl').value.trim();
  if (!name||!url) return alert('이름과 URL을 입력하세요');
  const icon = document.getElementById('bmIconSelected').value || '🔗';
  const desc = document.getElementById('bmDesc').value.trim();
  await api('POST','/bookmarks',{name,url,icon,description:desc});
  document.getElementById('bmName').value='';
  document.getElementById('bmUrl').value='';
  document.getElementById('bmDesc').value='';
  loadBookmarkList();
}

function editBookmark(id, name, url, icon, desc) {
  const newName = prompt('서비스 이름:', name);
  if (newName === null) return;
  const newUrl = prompt('URL:', url);
  if (newUrl === null) return;
  const newIcon = prompt('아이콘:', icon) || icon;
  // 수정 API는 없으니 삭제 후 재생성
  api('DELETE','/bookmarks/'+id).then(() => {
    api('POST','/bookmarks',{name:newName,url:newUrl,icon:newIcon,description:desc}).then(() => loadBookmarkList());
  });
}

async function deleteBookmark(id) {
  if (!confirm('삭제할까요?')) return;
  await api('DELETE','/bookmarks/'+id);
  loadBookmarkList();
}

async function addBookmarkPrompt() {
  openBookmarkManager();
}

// ══════════════════════════════════════════════════════════════
// PROJECT PAGE
// ══════════════════════════════════════════════════════════════
const PROJECT_STATUS = {
  planning: { label: '기획중', color: 'var(--blue)' },
  active: { label: '진행중', color: 'var(--red)' },
  review: { label: '확인대기', color: 'var(--yellow)' },
  done: { label: '완료', color: 'var(--green)' },
  hold: { label: '보류', color: 'var(--text3)' },
  archived: { label: '보관됨', color: 'var(--text3)' }
};
const PROJECT_TASK_STATUS = {
  todo: { label: '대기', color: 'var(--text3)' },
  doing: { label: '진행중', color: 'var(--blue)' },
  review: { label: '검토요청', color: 'var(--yellow)' },
  done: { label: '완료', color: 'var(--green)' },
  hold: { label: '보류', color: 'var(--text3)' }
};

function projectProgress(project) {
  const tasks = Array.isArray(project?.tasks) ? project.tasks : null;
  const total = tasks ? tasks.length : Number(project?.task_count || 0);
  const done = tasks ? tasks.filter(t => t.status === 'done').length : Number(project?.done_task_count || 0);
  return { total, done, percent: total ? Math.round((done / total) * 100) : 0 };
}

function projectStatusPill(status) {
  const meta = PROJECT_STATUS[status] || PROJECT_STATUS.active;
  return `<span style="font-size:11px;font-weight:800;color:${meta.color};background:rgba(255,255,255,0.08);border-radius:999px;padding:4px 8px">${meta.label}</span>`;
}

function projectTaskStatusPill(status) {
  const meta = PROJECT_TASK_STATUS[status] || PROJECT_TASK_STATUS.todo;
  return `<span style="font-size:11px;font-weight:800;color:${meta.color};background:rgba(255,255,255,0.08);border-radius:999px;padding:4px 8px">${meta.label}</span>`;
}

function renderProjectTabs() {
  const tabs = [
    ['overview', '개요'],
    ['tasks', '업무'],
    ['updates', '진행사항'],
    ['schedule', '일정']
  ];
  return `<div class="sub-tabs" style="overflow-x:auto;scrollbar-width:none;margin-bottom:2px">
    ${tabs.map(([key, label]) => `<button class="sub-tab ${projectSubTab===key?'active':''}" onclick="projectSubTab='${key}';renderPage(true)">${label}</button>`).join('')}
  </div>`;
}

function renderProjectCard(project) {
  const progress = projectProgress(project);
  const deadline = project.deadline ? `마감 ${esc(project.deadline)}` : '마감일 없음';
  const members = project.member_names || `${project.member_count || 0}명`;
  return `<div class="card" style="cursor:pointer;min-height:190px;display:flex;flex-direction:column" onclick="openProjectDetail('${project.id}')">
    <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:10px">
      <div style="min-width:0">
        <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px">${projectStatusPill(project.status)}</div>
        <div class="card-title" style="font-size:17px">${esc(project.name)}</div>
      </div>
      <div style="font-size:18px;color:var(--text3)">›</div>
    </div>
    <div class="card-meta" style="white-space:pre-wrap;line-height:1.5;max-height:44px;overflow:hidden">${esc(project.description || '프로젝트 설명이 없습니다.')}</div>
    <div style="margin-top:auto;padding-top:14px">
      <div style="display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--text2);margin-bottom:7px">
        <span>진행률 ${progress.percent}%</span><span>${progress.done}/${progress.total || 0}</span>
      </div>
      <div style="height:7px;background:var(--bg3);border-radius:999px;overflow:hidden"><div style="height:100%;width:${progress.percent}%;background:var(--red);border-radius:999px"></div></div>
      <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;font-size:11px;color:var(--text3)">
        <span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">👥 ${esc(members)}</span>
        <span>${deadline}</span>
      </div>
    </div>
  </div>`;
}

function getFilteredProjects() {
  const query = projectListSearch.trim().toLowerCase();
  return projects.filter(project => {
    const status = project.status || 'active';
    const statusMatched = projectListStatusFilter === 'all'
      || (projectListStatusFilter === 'active' && !['done','hold','archived'].includes(status))
      || status === projectListStatusFilter;
    if (!statusMatched) return false;
    if (!query) return true;
    const haystack = [
      project.name,
      project.description,
      project.member_names,
      project.owner_name,
      project.deadline
    ].join(' ').toLowerCase();
    return haystack.includes(query);
  });
}

function renderProjectListControls(counts) {
  const filters = [
    ['active', '진행중', counts.active],
    ['review', '확인대기', counts.review],
    ['planning', '기획중', counts.planning],
    ['done', '완료', counts.done],
    ['hold', '보류', counts.hold],
    ['all', '전체', counts.all]
  ];
  return `<div class="card" style="margin-bottom:14px">
    <div style="display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap">
      <div style="min-width:220px;flex:1">
        <input class="form-input" value="${esc(projectListSearch)}" placeholder="프로젝트명, 멤버, 설명 검색" oninput="projectListSearch=this.value;renderPage(true)" style="height:40px;font-size:13px">
      </div>
      <button class="btn btn-red" onclick="openProjectModal()">+ 프로젝트</button>
    </div>
    <div class="sub-tabs" style="padding:12px 0 0;overflow-x:auto;scrollbar-width:none">
      ${filters.map(([key, label, count]) => `<button class="sub-tab ${projectListStatusFilter===key?'active':''}" onclick="projectListStatusFilter='${key}';renderPage(true)">${label} ${count}</button>`).join('')}
    </div>
  </div>`;
}

async function renderProjectPage(body, right) {
  const isActiveRender = createPageRenderGuard('project', body);
  right.innerHTML = selectedProjectId
    ? `<button onclick="selectedProjectId=null;selectedProject=null;selectedProjectTaskId=null;renderPage()" class="btn btn-dark">← 목록</button>
       <button onclick="openProjectModal()" class="btn btn-red">+ 프로젝트</button>`
    : `<button onclick="openProjectModal()" class="btn btn-red">+ 프로젝트</button>`;
  if (!selectedProjectId) {
    body.innerHTML = '<div style="color:var(--text3);font-size:13px">프로젝트를 불러오는 중...</div>';
    try {
      const data = await api('GET', '/projects');
      if (!isActiveRender()) return;
      projects = Array.isArray(data) ? data : (data.projects || []);
      const active = projects.filter(p => !['done','hold','archived'].includes(p.status)).length;
      const review = projects.filter(p => p.status === 'review').length;
      const planning = projects.filter(p => p.status === 'planning').length;
      const done = projects.filter(p => p.status === 'done').length;
      const hold = projects.filter(p => p.status === 'hold').length;
      const visibleProjects = getFilteredProjects();
      let h = `<div class="card" style="margin-bottom:16px">
        <div class="card-title">프로젝트 상황판</div>
        <div class="card-meta">여러 프로젝트가 있어도 상태와 검색으로 빠르게 분류해서 확인합니다.</div>
        <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px">
          <div style="background:var(--bg3);border-radius:8px;padding:10px"><div style="font-size:11px;color:var(--text3)">진행중</div><div style="font-size:22px;font-weight:850;color:var(--red)">${active}</div></div>
          <div style="background:var(--bg3);border-radius:8px;padding:10px"><div style="font-size:11px;color:var(--text3)">완료</div><div style="font-size:22px;font-weight:850;color:var(--green)">${done}</div></div>
          <div style="background:var(--bg3);border-radius:8px;padding:10px"><div style="font-size:11px;color:var(--text3)">전체</div><div style="font-size:22px;font-weight:850;color:var(--blue)">${projects.length}</div></div>
        </div>
      </div>`;
      h += renderProjectListControls({ active, review, planning, done, hold, all: projects.length });
      if (!projects.length) {
        h += '<div class="card"><div class="card-title">아직 프로젝트가 없습니다</div><div class="card-meta">오른쪽 위 + 프로젝트 버튼으로 첫 프로젝트를 만들어주세요.</div></div>';
      } else if (!visibleProjects.length) {
        h += '<div class="card"><div class="card-title">조건에 맞는 프로젝트가 없습니다</div><div class="card-meta">검색어나 상태 필터를 바꿔보세요.</div></div>';
      } else {
        h += `<div style="font-size:12px;color:var(--text3);margin:-2px 0 10px">표시 중 ${visibleProjects.length} / 전체 ${projects.length}</div>`;
        h += `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px">${visibleProjects.map(renderProjectCard).join('')}</div>`;
      }
      body.innerHTML = h;
    } catch (err) {
      if (!isActiveRender()) return;
      body.innerHTML = `<div class="card"><div class="card-title" style="color:var(--red)">프로젝트 불러오기 실패</div><div class="card-meta">${esc(err.message)}</div></div>`;
    }
    return;
  }

  body.innerHTML = '<div style="color:var(--text3);font-size:13px">프로젝트 상세를 불러오는 중...</div>';
  try {
    selectedProject = await api('GET', '/projects/' + selectedProjectId);
    if (!isActiveRender()) return;
    right.innerHTML = `<button onclick="selectedProjectId=null;selectedProject=null;selectedProjectTaskId=null;renderPage()" class="btn btn-dark">← 목록</button>
      <button onclick="openProjectModal()" class="btn btn-red">+ 프로젝트</button>
      ${selectedProject.canManage ? `<button onclick="openProjectModal(selectedProject)" class="btn btn-dark">수정</button>` : ''}
      ${projectSubTab === 'tasks' ? `<button onclick="openProjectTaskModal()" class="btn btn-red">+ 업무</button>` : ''}
      ${projectSubTab === 'updates' ? `<button onclick="openProjectUpdateModal()" class="btn btn-red">+ 진행사항</button>` : ''}
      ${projectSubTab === 'schedule' ? `<button onclick="openProjectMeetingModal()" class="btn btn-red">+ 회의일정</button>` : ''}`;
    if (selectedProjectTaskId && !(selectedProject.tasks || []).some(t => String(t.id) === String(selectedProjectTaskId))) {
      selectedProjectTaskId = null;
    }
    body.innerHTML = renderProjectDetail(selectedProject);
    renderDraftImageAttachmentEditor('projectComment', 'projectCommentAttachmentList');
  } catch (err) {
    if (!isActiveRender()) return;
    body.innerHTML = `<div class="card"><div class="card-title" style="color:var(--red)">프로젝트 상세 불러오기 실패</div><div class="card-meta">${esc(err.message)}</div></div>`;
  }
}

function renderProjectDetail(project) {
  const progress = projectProgress(project);
  return `<div class="card" style="margin-bottom:14px">
    <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap">
      <div style="min-width:0">
        <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px">${projectStatusPill(project.status)}${project.deadline ? `<span style="font-size:11px;color:var(--text3);background:var(--bg3);border-radius:999px;padding:4px 8px">마감 ${esc(project.deadline)}</span>` : ''}</div>
        <div style="font-size:22px;font-weight:850;line-height:1.25">${esc(project.name)}</div>
        <div style="font-size:12px;color:var(--text3);margin-top:6px">담당 ${esc(project.owner_name || '미지정')} · 참여 ${project.members?.length || 0}명</div>
      </div>
      <div style="min-width:160px;flex:0 0 180px">
        <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--text2);margin-bottom:7px"><span>진행률</span><b>${progress.percent}%</b></div>
        <div style="height:8px;background:var(--bg3);border-radius:999px;overflow:hidden"><div style="height:100%;width:${progress.percent}%;background:var(--red)"></div></div>
        <div style="font-size:11px;color:var(--text3);margin-top:6px;text-align:right">${progress.done}/${progress.total || 0} 완료</div>
      </div>
    </div>
  </div>
  <div class="project-detail-layout" style="display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:12px;align-items:start">
    <div style="min-width:0">
      ${renderProjectTabs()}
      ${projectSubTab === 'overview' ? renderProjectOverview(project, progress) : ''}
      ${projectSubTab === 'tasks' ? renderProjectTasks(project) : ''}
      ${projectSubTab === 'updates' ? renderProjectUpdates(project) : ''}
      ${projectSubTab === 'schedule' ? renderProjectSchedule(project) : ''}
    </div>
    ${renderProjectRightConversation(project)}
  </div>`;
}

function renderProjectOverview(project, progress) {
  return `<div style="display:grid;grid-template-columns:minmax(0,1.2fr) minmax(260px,.8fr);gap:12px" class="project-overview-grid">
    <div class="card">
      <div class="card-title">개요</div>
      <div class="card-meta" style="white-space:pre-wrap;line-height:1.65">${esc(project.description || '프로젝트 설명이 없습니다.')}</div>
    </div>
    <div class="card">
      <div class="card-title">참여 멤버</div>
      <div style="display:flex;flex-wrap:wrap;gap:7px">${(project.members || []).map(m => `<span style="background:var(--bg3);border-radius:999px;padding:6px 9px;font-size:12px;color:var(--text2)">👤 ${esc(m.name)}${m.role==='manager'?' · 담당':''}</span>`).join('') || '<span class="card-meta">멤버 없음</span>'}</div>
    </div>
    <div class="card">
      <div class="card-title">다음 업무</div>
      ${(project.tasks || []).filter(t => t.status !== 'done').slice(0, 5).map(renderProjectTaskRow).join('') || '<div class="card-meta">대기 중인 업무가 없습니다.</div>'}
    </div>
    <div class="card">
      <div class="card-title">최근 진행사항</div>
      ${(project.updates || []).slice(0, 4).map(renderProjectUpdateItem).join('') || '<div class="card-meta">아직 진행사항 기록이 없습니다.</div>'}
    </div>
  </div>`;
}

function renderProjectTaskRow(task) {
  const selected = String(selectedProjectTaskId || '') === String(task.id);
  return `<div onclick="selectProjectTaskConversation('${task.id}')" style="display:flex;align-items:flex-start;gap:10px;padding:10px;border-bottom:1px solid var(--line);border-radius:8px;cursor:pointer;background:${selected ? 'var(--red-bg)' : 'transparent'};border-color:${selected ? 'rgba(255,107,95,0.24)' : 'var(--line)'}">
    <button onclick="event.stopPropagation();updateProjectTaskStatus('${task.id}', '${task.status === 'done' ? 'doing' : 'done'}')" style="width:24px;height:24px;border-radius:8px;border:1px solid var(--line);background:${task.status==='done'?'var(--green)':'var(--bg3)'};color:#fff;cursor:pointer;flex-shrink:0">${task.status==='done'?'✓':''}</button>
    <div style="flex:1;min-width:0">
      <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:4px">${projectTaskStatusPill(task.status)}${task.assignee_name ? `<span style="font-size:11px;color:var(--text3)">담당 ${esc(task.assignee_name)}</span>` : ''}${task.due_date ? `<span style="font-size:11px;color:var(--text3)">마감 ${esc(task.due_date)}</span>` : ''}</div>
      <div style="font-size:14px;font-weight:750;line-height:1.35">${esc(task.title)}</div>
      ${task.description ? `<div style="font-size:12px;color:var(--text3);white-space:pre-wrap;margin-top:4px;line-height:1.5">${esc(task.description)}</div>` : ''}
      ${renderProjectTaskActions(task)}
    </div>
    <button onclick="event.stopPropagation();openProjectTaskModal('${task.id}')" style="background:none;border:none;color:var(--text3);cursor:pointer;font-size:12px">수정</button>
  </div>`;
}

function renderProjectTaskActions(task) {
  const isAssignee = task.assignee_uid && currentUser && String(task.assignee_uid) === String(currentUser.uid);
  const canManage = !!selectedProject?.canManage;
  const buttons = [];
  if (isAssignee && !['review', 'done'].includes(task.status)) {
    buttons.push(`<button onclick="event.stopPropagation();updateProjectTaskStatus('${task.id}', 'review')" style="border:1px solid rgba(248,214,109,0.45);background:rgba(248,214,109,0.12);color:var(--yellow);border-radius:8px;padding:5px 8px;font-size:11px;font-weight:800;cursor:pointer;font-family:inherit">검토요청</button>`);
  }
  if (canManage && task.status === 'review') {
    buttons.push(`<button onclick="event.stopPropagation();updateProjectTaskStatus('${task.id}', 'done')" style="border:1px solid rgba(74,222,128,0.45);background:rgba(74,222,128,0.12);color:var(--green);border-radius:8px;padding:5px 8px;font-size:11px;font-weight:800;cursor:pointer;font-family:inherit">완료 처리</button>`);
    buttons.push(`<button onclick="event.stopPropagation();updateProjectTaskStatus('${task.id}', 'doing')" style="border:1px solid var(--line);background:var(--bg3);color:var(--text2);border-radius:8px;padding:5px 8px;font-size:11px;font-weight:800;cursor:pointer;font-family:inherit">다시 진행</button>`);
  }
  return buttons.length ? `<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:9px">${buttons.join('')}</div>` : '';
}

function renderProjectTasks(project) {
  const groups = [
    ['todo', '대기'],
    ['doing', '진행중'],
    ['review', '확인요청'],
    ['done', '완료'],
    ['hold', '보류']
  ];
  return `<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px">
    ${groups.map(([key, label]) => {
      const items = (project.tasks || []).filter(t => t.status === key);
      return `<div class="card" style="min-height:160px">
        <div class="card-title">${label} <span style="color:var(--text3);font-size:12px">${items.length}</span></div>
        ${items.map(renderProjectTaskRow).join('') || '<div class="card-meta">비어 있습니다.</div>'}
      </div>`;
    }).join('')}
  </div>`;
}

function renderProjectUpdateItem(update) {
  const canEdit = !!(
    selectedProject?.canManage
    || isAdmin
    || (currentUser && String(update.author_uid) === String(currentUser.uid))
  );
  const wasEdited = update.updated_at
    && update.created_at
    && Math.abs(new Date(update.updated_at).getTime() - new Date(update.created_at).getTime()) > 1000;
  return `<div style="padding:11px 0;border-bottom:1px solid var(--line)">
    <div style="display:flex;justify-content:space-between;gap:8px;margin-bottom:5px;font-size:11px;color:var(--text3)">
      <span>${esc(update.author_name || '')}${update.status_snapshot ? ' · ' + esc(update.status_snapshot) : ''}</span>
      <span style="display:flex;align-items:center;gap:7px">
        ${formatDateTimeLabel(update.created_at)}${wasEdited ? ' · 수정됨' : ''}
        ${canEdit ? `<button onclick="openProjectUpdateModal('${update.id}')" style="border:1px solid var(--line);background:var(--bg3);color:var(--text2);border-radius:7px;padding:3px 7px;font-size:10px;cursor:pointer;font-family:inherit">수정</button>` : ''}
      </span>
    </div>
    <div style="font-size:13px;color:var(--text2);white-space:pre-wrap;line-height:1.6">${esc(update.content)}</div>
  </div>`;
}

function renderProjectUpdates(project) {
  return `<div class="card">
    <div class="card-title">진행사항 기록</div>
    <div class="card-meta" style="margin-bottom:10px">회의 결과, 결정사항, 다음 확인일처럼 나중에 다시 봐야 하는 내용을 남깁니다.</div>
    ${(project.updates || []).map(renderProjectUpdateItem).join('') || '<div class="card-meta">아직 기록된 진행사항이 없습니다.</div>'}
  </div>`;
}

function renderProjectTalk(project) {
  return `<div class="card">
    <div class="card-title">프로젝트 대화</div>
    ${renderProjectTalkContent(project)}
  </div>`;
}

function renderProjectConversationNav(project, activeTaskId = null) {
  const tasks = project?.tasks || [];
  return `<div style="display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 0 12px;padding-bottom:2px">
    <button onclick="selectedProjectTaskId=null;renderPage(true)" class="sub-tab ${!activeTaskId?'active':''}" style="white-space:nowrap">전체</button>
    ${tasks.map(task => `<button onclick="selectProjectTaskConversation('${task.id}')" class="sub-tab ${String(activeTaskId || '')===String(task.id)?'active':''}" style="white-space:nowrap;max-width:160px;overflow:hidden;text-overflow:ellipsis">${esc(task.title)}</button>`).join('')}
  </div>`;
}

function renderProjectTalkContent(project) {
  return `<div>
    ${renderProjectConversationNav(project, null)}
    <div style="display:flex;flex-direction:column;gap:10px;margin-bottom:14px">
      ${(project.comments || []).map(comment => {
        const mine = comment.author_uid === currentUser.uid;
        return `<div style="background:var(--bg3);border:1px solid var(--line);border-radius:8px;padding:11px">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:7px">
            <div style="font-size:12px;font-weight:800">${esc(comment.author_name || '')} <span style="font-weight:500;color:var(--text3)">${formatDateTimeLabel(comment.created_at)}</span></div>
            ${mine || selectedProject?.canManage ? `<button onclick="deleteProjectComment('${comment.id}')" style="background:none;border:none;color:var(--red);font-size:11px;cursor:pointer">삭제</button>` : ''}
          </div>
          ${comment.content ? `<div style="font-size:13px;color:var(--text2);white-space:pre-wrap;line-height:1.6">${esc(comment.content)}</div>` : ''}
          ${renderNoticeAttachmentViewer(getImageAttachments(comment))}
        </div>`;
      }).join('') || '<div class="card-meta">아직 프로젝트 전체 대화가 없습니다.</div>'}
    </div>
    <textarea class="form-input" id="projectCommentInput" rows="4" placeholder="프로젝트 전체 대화를 남겨주세요." style="margin-bottom:10px"></textarea>
    <div class="form-group"><label class="form-label">이미지 첨부 (JPG, PNG)</label><input type="file" accept="image/png,image/jpeg" multiple onchange="uploadProjectCommentImages(this)" style="display:block;width:100%;font-size:12px;color:var(--text2)"><div id="projectCommentAttachmentList" style="margin-top:10px"></div></div>
    <button class="btn btn-red" onclick="createProjectComment()" style="width:100%">등록</button>

}

function getSelectedProjectTask(project = selectedProject) {
  const tasks = project?.tasks || [];
  return tasks.find(t => String(t.id) === String(selectedProjectTaskId)) || null;
}

function renderProjectRightConversation(project) {
  const task = getSelectedProjectTask(project);
  if (!task) {
    return `<aside class="card project-talk-panel" style="position:sticky;top:12px;max-height:calc(100vh - 126px);overflow:auto">
      <div class="card-title">프로젝트 전체 대화</div>
      <div class="card-meta" style="margin-bottom:12px">전체 공유는 여기, 업무별 확인사항은 업무를 선택해서 남깁니다.</div>
      ${renderProjectTalkContent(project)}
    </aside>`;
  }
  const comments = (project.taskComments || []).filter(c => String(c.task_id) === String(task.id));
  return `<aside class="card project-talk-panel" style="position:sticky;top:12px;max-height:calc(100vh - 126px);overflow:auto">
    <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:10px">
      <div style="min-width:0">
        <div class="card-title" style="margin-bottom:4px">업무 대화</div>
        <div style="font-size:13px;font-weight:800;line-height:1.35;overflow-wrap:anywhere">${esc(task.title)}</div>
        <div style="font-size:11px;color:var(--text3);margin-top:4px">${task.assignee_name ? '담당 ' + esc(task.assignee_name) : '담당 미지정'} · ${PROJECT_TASK_STATUS[task.status]?.label || '대기'}</div>
      </div>
    </div>
    ${renderProjectConversationNav(project, task.id)}
    <div style="display:flex;flex-direction:column;gap:9px;margin:12px 0 14px">
      ${comments.map(comment => {
        const mine = comment.author_uid === currentUser.uid;
        return `<div style="background:var(--bg3);border:1px solid var(--line);border-radius:8px;padding:10px">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px">
            <div style="font-size:12px;font-weight:800">${esc(comment.author_name || '')} <span style="font-weight:500;color:var(--text3)">${formatDateTimeLabel(comment.created_at)}</span></div>
            ${mine || project.canManage ? `<button onclick="deleteProjectTaskComment('${task.id}','${comment.id}')" style="background:none;border:none;color:var(--red);font-size:11px;cursor:pointer">삭제</button>` : ''}
          </div>
          <div style="font-size:13px;color:var(--text2);white-space:pre-wrap;line-height:1.6">${esc(comment.content)}</div>
        </div>`;
      }).join('') || '<div class="card-meta">아직 이 업무에 남긴 대화가 없습니다.</div>'}

    <button class="btn btn-red" onclick="createProjectTaskComment('${task.id}')" style="width:100%">등록</button>
  </aside>`;
}

function selectProjectTaskConversation(taskId) {
  selectedProjectTaskId = taskId;
  projectSubTab = 'tasks';
  renderPage(true);
}

function renderProjectSchedule(project) {
  return `<div class="card">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px">
      <div>
        <div class="card-title" style="margin-bottom:3px">관련 일정</div>
        <div class="card-meta">프로젝트 회의일정을 추가하면 참여 멤버 캘린더에 팀 일정으로 자동 공유됩니다.</div>
      </div>
      <button class="btn btn-red btn-small" onclick="openProjectMeetingModal()">+ 회의일정</button>
    </div>
    ${(project.events || []).map(ev => `<div style="padding:10px 0;border-bottom:1px solid var(--line)">
      <div style="font-size:13px;font-weight:750">${esc(ev.title)}</div>
      <div style="font-size:11px;color:var(--text3);margin-top:4px">${esc(ev.date || '')} ${esc(ev.time || '')} · ${ev.scope === 'team' ? '팀 공유' : '개인'}</div>
      ${ev.memo ? `<div style="font-size:12px;color:var(--text3);white-space:pre-wrap;line-height:1.5;margin-top:5px">${esc(ev.memo)}</div>` : ''}
      <button class="day-action-btn" onclick="goToProjectEventDate('${esc(ev.date || '')}', '${ev.id}')" style="margin-top:8px">캘린더에서 보기</button>
    </div>`).join('') || '<div class="card-meta">아직 연결된 일정이 없습니다.</div>'}
  </div>`;
}

function goToProjectEventDate(date) {
  if (!date) return;
  const parts = String(date).split('-').map(Number);
  if (parts.length >= 2 && parts[0] && parts[1]) {
    currentYear = parts[0];
    currentMonth = parts[1];
  }
  selectedDate = date;
  calSubTab = 'month';
  viewScope = 'personal';
  navTo('calendar');
}

async function openProjectDetail(id) {
  selectedProjectId = id;
  projectSubTab = 'overview';
  renderPage();
}

async function openProjectModal(project = null) {
  let users = [];
  try { users = await api('GET', '/users/all-approved'); } catch(e) {}
  const memberIds = new Set((project?.members || []).map(m => m.uid));
  const h = `<div class="modal-title">${project ? '📁 프로젝트 수정' : '📁 프로젝트 생성'}</div>
    <div class="form-group"><label class="form-label">프로젝트명</label><input class="form-input" id="projectName" value="${esc(project?.name || '')}" placeholder="예: 리뷰스페이스 개선"></div>
    <div class="form-group"><label class="form-label">설명</label><textarea class="form-input" id="projectDescription" rows="5" placeholder="프로젝트 목적과 범위를 적어주세요.">${esc(project?.description || '')}</textarea></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <div class="form-group"><label class="form-label">상태</label><select class="form-input" id="projectStatus">${Object.entries(PROJECT_STATUS).filter(([k]) => k !== 'archived').map(([value, meta]) => `<option value="${value}" ${project?.status===value?'selected':''}>${meta.label}</option>`).join('')}</select></div>
      <div class="form-group"><label class="form-label">마감일</label><input type="date" class="form-input" id="projectDeadline" value="${esc(project?.deadline || '')}"></div>
    </div>
    <div class="form-group"><label class="form-label">참여 멤버</label>
      <div style="max-height:190px;overflow:auto;background:var(--bg3);border:1px solid var(--line);border-radius:8px;padding:8px">
        ${users.map(u => `<label style="display:flex;align-items:center;gap:8px;padding:7px 4px;font-size:13px;color:var(--text2)">
          <input type="checkbox" class="projectMemberCheck" value="${esc(u.uid)}" ${memberIds.has(u.uid) || (!project && u.uid === currentUser.uid) ? 'checked' : ''}>
          <span>${esc(u.name || u.email || '사용자')}</span>
        </label>`).join('')}
      </div>
    </div>
    ${!project ? `<div class="card" style="margin-bottom:12px;background:var(--bg3)">
      <div class="card-title" style="font-size:14px">첫 회의일정</div>
      <div class="card-meta" style="margin-bottom:10px">날짜를 입력하면 프로젝트 생성과 동시에 참여자 캘린더에 팀 일정으로 공유됩니다.</div>
      <div class="form-group"><label class="form-label">회의명</label><input class="form-input" id="projectInitialMeetingTitle" placeholder="예: 첫 기획 회의"></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        <div class="form-group"><label class="form-label">날짜</label><input type="date" class="form-input" id="projectInitialMeetingDate"></div>
        <div class="form-group"><label class="form-label">시간</label><input type="time" class="form-input" id="projectInitialMeetingTime"></div>
      </div>
      <div class="form-group"><label class="form-label">메모</label><textarea class="form-input" id="projectInitialMeetingMemo" rows="3"></textarea></div>
    </div>` : ''}
    <div style="display:flex;gap:8px">
      <button class="btn btn-dark" onclick="closeModal()" style="flex:1">취소</button>
      ${project ? `<button class="btn btn-dark" onclick="deleteProject('${project.id}')" style="flex:1;color:var(--red)">삭제</button>` : ''}
      <button class="btn btn-red" onclick="saveProject(${project ? `'${project.id}'` : 'null'})" style="flex:1">저장</button>
    </div>`;
  openModal(h);
}

async function saveProject(id) {
  const body = {
    name: document.getElementById('projectName')?.value?.trim(),
    description: document.getElementById('projectDescription')?.value?.trim() || '',
    status: document.getElementById('projectStatus')?.value || 'active',
    deadline: document.getElementById('projectDeadline')?.value || '',
    memberIds: Array.from(document.querySelectorAll('.projectMemberCheck:checked')).map(el => el.value)
  };
  const initialMeetingDate = document.getElementById('projectInitialMeetingDate')?.value || '';
  if (!id && initialMeetingDate) {
    body.meeting = {
      title: document.getElementById('projectInitialMeetingTitle')?.value?.trim() || `${body.name} 회의`,
      date: initialMeetingDate,
      time: document.getElementById('projectInitialMeetingTime')?.value || '',
      memo: document.getElementById('projectInitialMeetingMemo')?.value?.trim() || ''
    };
  }
  if (!body.name) return alert('프로젝트명을 입력하세요');
  const saved = id ? await api('PUT', '/projects/' + id, body) : await api('POST', '/projects', body);
  if (saved.meetingEvent) upsertLocalEvent(mapEventRecord(saved.meetingEvent));
  closeModal();
  selectedProjectId = saved.id;
  if (saved.meetingEvent) await fetchEvents();
  await renderPage(true);
}

async function deleteProject(id) {
  if (!confirm('이 프로젝트를 삭제할까요?')) return;
  await api('DELETE', '/projects/' + id);
  closeModal();
  selectedProjectId = null;
  selectedProject = null;
  renderPage();
}

async function openProjectTaskModal(taskId = null) {
  const task = selectedProject?.tasks?.find(t => String(t.id) === String(taskId));
  const members = selectedProject?.members || [];
  const h = `<div class="modal-title">${task ? '업무 수정' : '업무 추가'}</div>
    <div class="form-group"><label class="form-label">업무명</label><input class="form-input" id="projectTaskTitle" value="${esc(task?.title || '')}" placeholder="예: 메인 화면 문구 정리"></div>
    <div class="form-group"><label class="form-label">설명</label><textarea class="form-input" id="projectTaskDescription" rows="4">${esc(task?.description || '')}</textarea></div>

// SERVICE REQUEST PAGE
// ══════════════════════════════════════════════════════════════
const SERVICE_REQUEST_STATUS = {
  requested: { label: '요청', color: 'var(--yellow)' },
  reviewing: { label: '확인중', color: 'var(--blue)' },
  working: { label: '수정중', color: 'var(--red)' },
  done: { label: '완료', color: 'var(--green)' },
  rejected: { label: '보류', color: 'var(--text3)' }
};
const SERVICE_REQUEST_PRIORITY = {
  low: '낮음',
  normal: '보통',
  high: '중요',
  urgent: '긴급'
};

function serviceRequestStatusMeta(status) {
  return SERVICE_REQUEST_STATUS[status] || SERVICE_REQUEST_STATUS.requested;
}

function serviceRequestDateLabel(value) {
  if (!value) return '';
  const d = new Date(value);
  if (Number.isNaN(d.getTime())) return '';
  return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

function serviceRequestProductOptions(bookmarks = [], selected = '') {
  const names = [...new Set((bookmarks || []).map(b => String(b.name || '').trim()).filter(Boolean))];
  if (!names.includes('기타')) names.push('기타');
  return names.map(name => `<option value="${esc(name)}" ${name === selected ? 'selected' : ''}>${esc(name)}</option>`).join('');
}

function renderServiceRequestFilters() {
  const filters = [
    ['open', '진행중'],
    ['requested', '요청'],
    ['reviewing', '확인중'],
    ['working', '수정중'],
    ['done', '완료'],
    ['rejected', '보류'],
    ['all', '전체']
  ];
  return `<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px">
    ${filters.map(([key, label]) => `<button class="sub-tab ${serviceRequestStatusFilter===key?'active':''}" onclick="serviceRequestStatusFilter='${key}';renderPage(true)">${label}</button>`).join('')}
  </div>`;
}

function getFilteredServiceRequests() {
  const visibleRequests = serviceRequestCanManage
    ? serviceRequests
    : serviceRequests.filter(r => String(r.requester_uid || '') === String(currentUser?.uid || ''));
  if (serviceRequestStatusFilter === 'all') return visibleRequests;
  if (serviceRequestStatusFilter === 'open') return visibleRequests.filter(r => !['done','rejected'].includes(r.status));
  return visibleRequests.filter(r => r.status === serviceRequestStatusFilter);
}

function renderServiceRequestCard(req) {
  const meta = serviceRequestStatusMeta(req.status);
  const priority = SERVICE_REQUEST_PRIORITY[req.priority] || SERVICE_REQUEST_PRIORITY.normal;
  const assignee = req.assignee_name || '미지정';
  const isMine = req.requester_uid === currentUser.uid;
  const attachments = getImageAttachments(req);
  const firstImage = attachments[0];
  return `<div class="card" style="cursor:pointer" onclick="openServiceRequestDetail('${req.id}')">
    <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:8px">
      <div style="min-width:0">
        <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:6px">
          <span style="font-size:11px;font-weight:700;color:${meta.color};background:rgba(255,255,255,0.08);border-radius:999px;padding:3px 8px">${meta.label}</span>
          <span style="font-size:11px;color:var(--text3)">${esc(req.product_name || '기타')}</span>
          ${req.priority !== 'normal' ? `<span style="font-size:11px;color:var(--yellow)">${esc(priority)}</span>` : ''}
          ${isMine ? `<span style="font-size:11px;color:var(--green)">내 요청</span>` : ''}
        </div>
        <div class="card-title" style="font-size:15px;line-height:1.35">${esc(req.title)}</div>
      </div>
      <div style="font-size:18px;color:var(--text3)">›</div>
		    </div>
		    <div class="card-meta" style="white-space:pre-wrap;line-height:1.5;max-height:44px;overflow:hidden">${esc(req.content)}</div>
		    ${firstImage ? `<img src="${esc(firstImage.url)}" alt="${esc(firstImage.name || '첨부 이미지')}" loading="lazy" decoding="async" style="display:block;width:100%;height:150px;object-fit:cover;border-radius:8px;background:var(--bg3);margin-top:10px">` : ''}
		    ${renderNoticeAttachmentBadge(attachments)}
		    <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;font-size:11px;color:var(--text3)">
      <span>${esc(req.requester_name || '')} · ${serviceRequestDateLabel(req.created_at)}</span>
      <span>담당 ${esc(assignee)}</span>
    </div>
    ${req.manager_note ? `<div style="margin-top:10px;padding:8px 10px;border-radius:8px;background:var(--bg3);font-size:12px;color:var(--text2);white-space:pre-wrap">${esc(req.manager_note)}</div>` : ''}
  </div>`;
}

async function renderServiceRequestPage(body, right) {
  const isActiveRender = createPageRenderGuard('request', body);
  right.innerHTML = `<button onclick="openNewServiceRequestModal()" class="btn btn-red">+ 요청</button>`;
  body.innerHTML = '<div style="color:var(--text3);font-size:13px">수정 요청을 불러오는 중...</div>';
  try {
    const data = await api('GET', '/service-requests');
    if (!isActiveRender()) return;
    serviceRequestCanManage = !!data.canManage;
    serviceRequests = (Array.isArray(data.requests) ? data.requests : []).filter(r =>
      serviceRequestCanManage || String(r.requester_uid || '') === String(currentUser?.uid || '')
    );
    right.innerHTML = `
      ${isAdmin ? `<button onclick="openServiceRequestManagerModal()" class="btn btn-dark">담당자 관리</button>` : ''}
      <button onclick="openNewServiceRequestModal()" class="btn btn-red">+ 요청</button>`;

    const visible = getFilteredServiceRequests();
    const counts = {
      open: serviceRequests.filter(r => !['done','rejected'].includes(r.status)).length,
      done: serviceRequests.filter(r => r.status === 'done').length,
      all: serviceRequests.length
    };
    let h = `<div class="card" style="margin-bottom:16px">
      <div class="card-title">피크마케팅 서비스 상품 개발 수정 요청</div>
      <div class="card-meta">리뷰스페이스, 키워드마스터, 접수 UI 같은 서비스 수정 요청을 여기에 남기면 담당자가 상태를 업데이트합니다.</div>
      <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px">
        <div style="background:var(--bg3);border-radius:8px;padding:10px"><div style="font-size:11px;color:var(--text3)">진행중</div><div style="font-size:22px;font-weight:800;color:var(--yellow)">${counts.open}</div></div>
        <div style="background:var(--bg3);border-radius:8px;padding:10px"><div style="font-size:11px;color:var(--text3)">완료</div><div style="font-size:22px;font-weight:800;color:var(--green)">${counts.done}</div></div>
        <div style="background:var(--bg3);border-radius:8px;padding:10px"><div style="font-size:11px;color:var(--text3)">전체</div><div style="font-size:22px;font-weight:800;color:var(--red)">${counts.all}</div></div>
      </div>
    </div>`;
    h += renderServiceRequestFilters();
    if (!serviceRequestCanManage) {
      h += '<div style="font-size:12px;color:var(--text3);margin:-4px 0 12px">내가 등록한 요청만 보입니다.</div>';
    }
    if (!visible.length) {
      h += '<div class="card"><div class="card-title">등록된 요청이 없습니다</div><div class="card-meta">필요한 수정사항이 생기면 오른쪽 위 + 요청 버튼으로 남겨주세요.</div></div>';
    } else {
      h += `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px">${visible.map(renderServiceRequestCard).join('')}</div>`;
    }
    body.innerHTML = h;
  } catch (err) {
    if (!isActiveRender()) return;
    body.innerHTML = `<div class="card"><div class="card-title" style="color:var(--red)">불러오기 실패</div><div class="card-meta">${esc(err.message)}</div></div>`;
  }
}

async function saveServiceRequest(id) {
  const body = {};
	  if (serviceRequestCanManage) {
	    body.status = document.getElementById('srEditStatus')?.value;
	    body.assigneeUid = document.getElementById('srEditAssignee')?.value || '';
	    body.managerNote = document.getElementById('srEditManagerNote')?.value || '';
	    body.attachments = serviceRequestDraftAttachments;
	  } else {
    body.productName = document.getElementById('srEditProduct')?.value || '기타';
    body.title = document.getElementById('srEditTitle')?.value?.trim();
    body.content = document.getElementById('srEditContent')?.value?.trim();
	    body.priority = document.getElementById('srEditPriority')?.value || 'normal';
	    body.attachments = serviceRequestDraftAttachments;
    if (!body.title) return alert('제목을 입력하세요');
    if (!body.content) return alert('요청 내용을 입력하세요');
  }
  const updated = await api('PUT', '/service-requests/' + id, body);
  serviceRequests = serviceRequests.map(r => r.id === updated.id ? updated : r);
  closeModal();
  renderPage(true);
}

async function deleteServiceRequest(id) {
  if (!confirm('이 수정 요청을 삭제할까요?')) return;
  await api('DELETE', '/service-requests/' + id);
  serviceRequests = serviceRequests.filter(r => r.id !== id);
  closeModal();
  renderPage(true);
}

async function createChatRoomGroup() {
  const name = document.getElementById('chatGroupName')?.value?.trim();

  if (!name) return alert('그룹 이름을 입력하세요');
  await api('POST', '/chat-room-groups', { name, color });
  await refreshChatRoomCaches();
  await openChatRoomGroupManager();
}

async function editChatRoomGroup(groupId) {
  const group = chatRoomGroups.find(g => String(g.id) === String(groupId));
  if (!group) return;
  const name = prompt('그룹 이름:', group.name);
  if (name === null) return;
  const trimmed = name.trim();
  if (!trimmed) return alert('그룹 이름을 입력하세요');
  const color = prompt('색상 코드:', group.color || '#5AA7FF');
  if (color === null) return;
  await api('PUT', '/chat-room-groups/' + groupId, { name: trimmed, color: color.trim() || '#5AA7FF' });
  await refreshChatRoomCaches();
  await openChatRoomGroupManager();
}

async function deleteChatRoomGroup(groupId) {
  if (!confirm('이 그룹을 삭제할까요?\n그룹 안의 채팅방은 삭제되지 않고 미분류로 이동합니다.')) return;
  await api('DELETE', '/chat-room-groups/' + groupId);

  await openChatRoomGroupManager();
}

  currentOpenEventDetailId = null;
  document.getElementById('modalContent').innerHTML = html;
  document.getElementById('modalOverlay').classList.remove('hidden');
}

async function openEventDetail(id, options = {}) {
  const renderTicket = ++eventDetailRenderTicket;
  const ev = events.find(e=>e.id===id); if(!ev) return;

  // 보고서 확인 일정이면 바로 보고서 상세로
  // 보고서 확인 → 바로 보고서 상세
  if (ev.title.includes('보고서 확인') && ev.todoCat === '보고서') {
    openReportReview(id, ev);
    return;
  }
  // 업무보고 확인 → 바로 업무보고 상세
  if (ev.title.includes('업무보고 확인') && ev.todoCat === '보고서') {
    openWorkReportReview(id, ev);
    return;
  }
  // 보고서 작성 → 바로 작성 모달
  if (ev.title === '📝 일일 보고서 작성' && ev.todoCat === '보고서') {
    openWriteReport();
    return;
  }
  if (ev.title === '📊 주간 보고서 작성' && ev.todoCat === '보고서') {
    openWriteWeeklyReport();
    return;
  }
  if (ev.title === '📈 월간 보고서 작성' && ev.todoCat === '보고서') {
    openWriteMonthlyReport(getMonthlyReportMonthForTodo(ev));
    return;
  }
  if (ev.title === '📋 업무보고 작성' && ev.todoCat === '보고서') {
    openWriteWorkReport();
    return;
  }

  const t = getAllEventTypes()[ev.type]||{icon:'📌',color:'#888',label:ev.type};
  const canEdit = ev.ownerId === currentUser.uid || isAdmin;
  const canEditChecklist = canEdit || ev.scope === 'team';

  // 체크리스트 로드
  let checklist = [];
  if (Array.isArray(options.checklist)) {
    applyChecklistItemsToLocalEvent(id, options.checklist);
    checklist = getChecklistItemsLocal(id);
  } else {
    try { checklist = await fetchChecklistItems(id); } catch(e) {}
  }
  if (renderTicket !== eventDetailRenderTicket) return;
  const clDone = checklist.filter(c=>c.done).length;
  const clTotal = checklist.length;

  let h = `<div class="event-detail-title" style="font-size:18px;font-weight:700;margin-bottom:4px">${t.icon} ${esc(ev.title)}${clTotal>0?` <span style="font-size:12px;color:${clDone===clTotal?'var(--green)':'var(--yellow)'}">(${clDone}/${clTotal})</span>`:''}</div>
    <div style="font-size:12px;color:var(--text3);margin-bottom:16px">${t.label}${ev.todoCat?' · '+esc(ev.todoCat):''}</div>`;

  if(canEdit) h += `<div style="display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:16px">
    <button onclick="editEventModal('${ev.id}')" style="flex:1;padding:12px;text-align:center;background:var(--bg3);border:none;cursor:pointer;font-size:13px;font-weight:600;color:var(--text);border-radius:8px 0 0 8px;font-family:inherit">✏️ 수정</button>
    <button onclick="deleteEv('${ev.id}')" style="flex:1;padding:12px;text-align:center;background:var(--bg3);border:none;cursor:pointer;font-size:13px;font-weight:600;color:var(--red);border-radius:0 8px 8px 0;font-family:inherit">🗑 삭제</button>
  </div>`;

  // 체크리스트
  h += `<div style="padding:10px;border-radius:8px;background:var(--bg3);margin-bottom:8px">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
      <div style="font-size:11px;color:var(--text3)">☑️ 체크리스트${clTotal>0?` (${clDone}/${clTotal})`:''}</div>
      ${clTotal>0?`<div style="width:60px;height:4px;border-radius:2px;background:var(--bg4);overflow:hidden"><div style="width:${clTotal>0?Math.round(clDone/clTotal*100):0}%;height:100%;background:var(--green);border-radius:2px"></div></div>`:''}
    </div>`;
  checklist.forEach((c,i) => {
    h += `<div class="checklist-row" style="${c.done?'opacity:0.5':''}">
      <div class="todo-check ${c.done?'done':''}" ${canEditChecklist?`onclick="toggleCheckItem('${id}','${c.id}',${!c.done})"`:''} style="width:16px;height:16px;flex-shrink:0;cursor:${canEditChecklist?'pointer':'default'}"></div>
      <span class="checklist-text" style="${c.done?'text-decoration:line-through':''}">${i+1}. ${esc(c.title)}</span>
      ${canEditChecklist?`<span class="checklist-actions"><button onclick="editCheckItemModal('${id}','${c.id}','${esc(c.title)}')" style="background:none;border:none;cursor:pointer;color:var(--text3);font-size:10px">✏️</button><button onclick="deleteCheckItem('${id}','${c.id}')" style="background:none;border:none;cursor:pointer;color:var(--text3);font-size:12px">✕</button></span>`:''}
    </div>`;
  });
  if(canEditChecklist) {
    h += `<div style="display:flex;gap:6px;margin-top:6px">
      <input id="newCheckItem" class="form-input" placeholder="항목 추가..." style="flex:1;font-size:12px;padding:6px 8px"
        onkeydown="if(event.key==='Enter'&&!event.isComposing&&event.keyCode!==229){event.preventDefault();addCheckItem('${id}')}">
      <button onclick="addCheckItem('${id}')" style="padding:6px 10px;border-radius:6px;border:none;background:var(--red);color:#fff;font-size:11px;font-weight:600;cursor:pointer">+</button>
    </div>`;
  }
  h += '</div>';

  // 메모
  h += `<div onclick="${canEdit?`editMemo('${ev.id}')`:''}}" style="padding:10px;border-radius:8px;background:var(--bg3);margin-bottom:8px;cursor:${canEdit?'pointer':'default'}">
    <div style="font-size:11px;color:var(--text3);margin-bottom:4px">📝 메모</div>
    <div style="font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word">${ev.memo||'<span style="color:var(--text3)">메모 없음</span>'}</div></div>`;

  // 날짜
  h += `<div style="padding:10px;border-radius:8px;background:var(--bg3);margin-bottom:8px">
    <div style="font-size:11px;color:var(--text3);margin-bottom:4px">📅 날짜</div>
    <div style="font-size:13px">${ev.date}${ev.endDate?' ~ '+ev.endDate:''}${ev.time?' '+ev.time:''}</div>
    ${ev.reminder ? `<div style="font-size:11px;color:var(--text3);margin-top:4px">🔔 ${getEventReminderLabel(ev.reminder)}${ev.time ? ' 푸시 알림' : ' (시간 지정 시 발송)'}</div>` : ''}</div>`;

  // 카테고리 변경 (할일만)
  if (canEdit && ev.type === 'todo') {
    const allCats = getAllTodoCats();
    const catKeys = Object.keys(allCats);
    h += `<div style="padding:10px;border-radius:8px;background:var(--bg3);margin-bottom:8px">
      <div style="font-size:11px;color:var(--text3);margin-bottom:6px">📂 카테고리</div>
      <div style="display:flex;flex-wrap:wrap;gap:4px">
        ${catKeys.map(c => `<button onclick="changeTodoCat('${ev.id}','${esc(c)}')" style="padding:3px 10px;border-radius:12px;border:1px solid ${allCats[c]};background:${ev.todoCat===c?allCats[c]:'transparent'};color:${ev.todoCat===c?'#fff':allCats[c]};font-size:11px;cursor:pointer;font-family:inherit">${esc(c)}</button>`).join('')}
      </div>
    </div>`;
  }

  // 미루기 버튼들
  if(canEdit) {
    h += `<div style="display:flex;gap:6px;margin-bottom:8px">
      <button onclick="moveTomorrow('${ev.id}')" style="flex:1;padding:10px;border-radius:8px;background:var(--bg3);border:none;cursor:pointer;font-size:12px;color:var(--text);font-family:inherit;text-align:center">➡️ 내일</button>
      <button onclick="moveToDate('${ev.id}',2)" style="flex:1;padding:10px;border-radius:8px;background:var(--bg3);border:none;cursor:pointer;font-size:12px;color:var(--text);font-family:inherit;text-align:center">📅 모레</button>
      <button onclick="moveToDate('${ev.id}',7)" style="flex:1;padding:10px;border-radius:8px;background:var(--bg3);border:none;cursor:pointer;font-size:12px;color:var(--text);font-family:inherit;text-align:center">📆 다음주</button>
      <button onclick="changeDatePrompt('${ev.id}')" style="flex:1;padding:10px;border-radius:8px;background:var(--bg3);border:none;cursor:pointer;font-size:12px;color:var(--text);font-family:inherit;text-align:center">🔄 직접선택</button>
    </div>`;
  }

  // 댓글
  h += `<div style="padding:10px;border-radius:8px;background:var(--bg3);margin-bottom:8px">
    <div style="font-size:11px;color:var(--text3);margin-bottom:6px">💬 댓글</div>
    <div id="evComments_${ev.id}"><div style="font-size:11px;color:var(--text3)">로딩...</div></div>
    <div style="display:flex;gap:6px;margin-top:6px">
      <input id="evCommentInput_${ev.id}" class="form-input" placeholder="댓글 입력..." style="flex:1;font-size:12px;padding:6px 8px"
        onkeydown="if(event.key==='Enter'&&!event.isComposing&&event.keyCode!==229){event.preventDefault();addComment('${ev.id}')}">
      <button onclick="addComment('${ev.id}')" style="padding:6px 10px;border-radius:6px;border:none;background:var(--red);color:#fff;font-size:11px;font-weight:600;cursor:pointer">등록</button>
    </div>
  </div>`;
  setTimeout(() => loadComments(ev.id), 100);

  // 공유된 사람 표시
  if (ev.scope === 'team') {
    h += `<div style="padding:10px;border-radius:8px;background:var(--bg3);margin-bottom:8px">
      <div style="font-size:11px;color:var(--text3);margin-bottom:6px">👥 공유 멤버</div>
      <div id="evShares_${ev.id}"><div style="font-size:11px;color:var(--text3)">로딩...</div></div>
    </div>`;
    setTimeout(async () => {
      const el = document.getElementById('evShares_'+ev.id);
      if (!el) return;
      try {
        const shares = await api('GET','/events/'+ev.id+'/shares');
        if (!shares.length) { el.innerHTML='<div style="font-size:11px;color:var(--text3)">공유 없음</div>'; return; }
        el.innerHTML = shares.map(s => `<span style="display:inline-flex;align-items:center;gap:4px;padding:2px 8px;background:var(--bg4);border-radius:12px;font-size:11px;margin:2px">👤 ${esc(s.name)}</span>`).join('');
      } catch(e) { el.innerHTML=''; }
    }, 100);
  }

  // 프로젝트 채팅방 바로가기 (scope=team이면)
  if (ev.scope === 'team') {
    // 이 일정과 연결된 채팅방 찾기 (공유된 팀원들과의 채팅방)
    const matchRoom = chatRooms.find(r => r.name.includes(ev.title.slice(0,10)) || ev.title.includes(r.name.slice(0,10)));
    if (matchRoom) {

async function createChatForEvent(eventId) {
  const ev = events.find(e=>e.id===eventId);
  if (!ev) return;
  try {
    const roomName = '📅 ' + ev.title;
    const existingRoom = chatRooms.find(r => r.name === roomName);
    if (existingRoom) {
      closeModal();
      openChatRoomById(existingRoom.id);
      return;
    }

    // 팀일정에 공유된 멤버만 초대
    let memberIds = [];
    try {
      const shares = await api('GET','/events/'+eventId+'/shares');
      memberIds = Array.from(new Set([
        ev.ownerId,
        ...shares.map(s => s.uid),
        currentUser.uid
      ].filter(Boolean))).filter(uid => uid !== currentUser.uid);
    } catch(e) {}

    const room = await api('POST','/chat-rooms',{name:roomName, memberIds});
    chatRooms = await api('GET','/chat-rooms');
    try { chatUnreadCounts = await api('GET','/chat-rooms/unread'); } catch(e) { chatUnreadCounts = {}; }

    // 채팅방에 일정 정보 자동 전송
    const shareData = {type:ev.type,title:ev.title,date:ev.date,endDate:ev.endDate,time:ev.time,memo:ev.memo};
    await api('POST','/chat-rooms/'+room.id+'/messages',{text:'[EVENT_SHARE]'+JSON.stringify(shareData)});

    closeModal();
    openChatRoomById(room.id);
  } catch(e) { alert('채팅방 생성 실패: '+e.message); }
}

// 보고서 확인 일정 → 바로 보고서 보기
async function openReportReview(eventId, ev) {
  // 제목에서 이름 추출: "📄 김대호 보고서 확인"
  const nameMatch = ev.title.match(/📄\s*(.+?)\s*보고서/);
  const authorName = nameMatch ? nameMatch[1] : '';
  const reportDate = ev.date;

  let h = `<div class="modal-title">📄 ${esc(authorName)} 보고서 확인</div>
    <div style="font-size:12px;color:var(--text3);margin-bottom:12px">${reportDate}</div>`;

  // 해당 날짜 해당 작성자 보고서 찾기
  try {
    const reports = await api('GET','/reports?date='+reportDate);
    const targetReport = reports.find(r => r.author_name === authorName);

    if (targetReport) {
      const entries = await api('GET','/reports/'+targetReport.id+'/entries');
      let lastGroup = null, total = 0;
      entries.forEach(e => {
        if (e.field_group && e.field_group !== lastGroup) {
          h += `<div style="font-size:12px;font-weight:700;color:var(--text3);margin:10px 0 4px;border-top:1px solid var(--border);padding-top:8px">${esc(e.field_group)}</div>`;
          lastGroup = e.field_group;
        }
        const val = e.value || '-';
        if (e.is_amount) {
          const num = parseInt(val.replace(/[^0-9]/g,'')||'0'); total += num;
          h += `<div style="display:flex;justify-content:space-between;padding:3px 0;font-size:13px"><span style="color:var(--text2)">${esc(e.field_name)}</span><span>${num.toLocaleString()}원</span></div>`;
        } else {
          h += `<div style="display:flex;justify-content:space-between;padding:3px 0;font-size:13px"><span style="color:var(--text2)">${esc(e.field_name)}</span><span>${esc(val)}</span></div>`;
        }
      });
      if (total > 0) {
        h += `<div style="margin-top:8px;padding:10px;background:rgba(74,222,128,0.15);border-radius:8px;font-size:14px;font-weight:700;color:var(--green);text-align:right">총 매출: ${total.toLocaleString()}원</div>`;
      }
    } else {
      h += '<div style="color:var(--text3);text-align:center;padding:20px;font-size:13px">보고서를 찾을 수 없습니다</div>';
    }
  } catch(e) {
    h += '<div style="color:var(--red);text-align:center;padding:20px;font-size:13px">보고서 로드 실패</div>';
  }

  // 확인 완료 버튼
  const isDone = ev.done;
  if (!isDone) {
    h += `<button onclick="confirmReport('${eventId}')" class="btn btn-red" style="width:100%;margin-top:16px">✅ 확인 완료</button>`;
  } else {
    h += `<div style="text-align:center;padding:12px;color:var(--green);font-size:14px;font-weight:700;margin-top:12px">✅ 확인 완료됨</div>`;
  }
  h += `<button onclick="closeModal()" class="btn btn-dark" style="width:100%;margin-top:8px">닫기</button>`;
  openModal(h);
}

// ── 할 일 드래그 앤 드롭 ──────────────────────────────────
let dragTodoId = null, dragTodoCat = null;

function onTodoDragStart(ev, id, cat) {
  dragTodoId = id; dragTodoCat = cat;
  ev.dataTransfer.effectAllowed = 'move';
  ev.target.classList.add('todo-dragging');
}
function onTodoDragEnd(ev) {
  ev.target.classList.remove('todo-dragging');
  dragTodoId = null;
}
function onTodoDragOver(ev) {
  ev.preventDefault();
  ev.currentTarget.classList.add('todo-drop-target');
}
function onTodoDragLeave(ev) {
  ev.currentTarget.classList.remove('todo-drop-target');
}
async function onTodoDrop(ev, targetId, targetCat) {
  ev.preventDefault();
  ev.currentTarget.classList.remove('todo-drop-target');
  if (!dragTodoId || dragTodoId === targetId) return;

  // 같은 카테고리 내 순서 변경
  const dayEvs = eventsForDate(selectedDate);
  const catTodos = dayEvs.filter(e => e.type === 'todo' && (e.todoCat||'') === targetCat).sort((a,b)=>(a.sortOrder||0)-(b.sortOrder||0));

  const dragIdx = catTodos.findIndex(e => e.id === dragTodoId);
  const targetIdx = catTodos.findIndex(e => e.id === targetId);
  if (dragIdx === -1) {
    // 다른 카테고리에서 드래그 → 카테고리 변경 + 순서 삽입
    const moved = await api('PUT','/events/'+dragTodoId, {todoCat: targetCat});
    upsertLocalEvent(moved);
  }

  // 순서 재정렬
  const items = catTodos.filter(e => e.id !== dragTodoId);
  const dragItem = events.find(e => e.id === dragTodoId);
  if (dragItem) items.splice(targetIdx, 0, dragItem);

  const reorder = items.map((e, i) => ({id: e.id, sortOrder: i, todoCat: targetCat}));
  await api('POST','/events/reorder', {items: reorder});
  reorder.forEach(item => {
    const current = events.find(event => event.id === item.id);
    if (!current) return;
    upsertLocalEvent({ ...current, sortOrder: item.sortOrder, todoCat: item.todoCat });
  });
  refreshCalendarUi({ keepScroll: true });
}

async function onTodoDropToCat(ev, targetCat) {
  ev.preventDefault();
  if (!dragTodoId) return;
  // 카테고리 변경
  const updated = await api('PUT','/events/'+dragTodoId, {todoCat: targetCat});
  upsertLocalEvent(updated);
  refreshCalendarUi({ keepScroll: true });
}

async function bulkPostponeOverdue() {
  const today = todayStr();
  const overdue = events.filter(e => !e.deleted && e.type === 'todo' && !e.done && e.date < today && e.ownerId === currentUser.uid);
  if (!overdue.length) return alert('지난 미완료 항목이 없습니다');
  if (!confirm(`${overdue.length}개의 지난 미완료 항목을 오늘로 옮기시겠습니까?`)) return;
  for (const e of overdue) {
    const updated = await api('PUT','/events/'+e.id,{date:today});
    upsertLocalEvent(updated);
  }
  refreshCalendarUi({ keepScroll: true });
  alert(`${overdue.length}개 항목이 오늘로 이동되었습니다`);
}

async function addCheckItem(eventId) {
  const input = document.getElementById('newCheckItem');
  const title = input?.value?.trim();
  if (!title) return;
  // Re-entry guard: clear the input *before* awaiting so a Korean IME
  // double-Enter (composition-commit + real Enter fires keydown twice)
  // or a second click while the POST is in flight short-circuits on
  // the empty-title check above. The `_busy` dataset makes the second
  // entry fully inert even if the user typed something new in that
  // microtask gap.
  if (input.dataset.busy === '1') return;
  input.dataset.busy = '1';
  input.value = '';
  try {
    const response = await api('POST','/events/'+eventId+'/checklist',{title});
    const normalized = normalizeChecklistMutationResponse(eventId, response, { eventId, title, sortOrder: getNextChecklistSortOrder(eventId) });
    const items = patchChecklistItemLocal(eventId, normalized.item);
    const applied = applyChecklistItemsToLocalEvent(eventId, items, normalized.event);
    if (applied.done) calShowIncomplete = true;
    refreshCalendarUi({ keepScroll: true, openDetailId: eventId, detailChecklist: items });
  } finally {
    const refreshed = document.getElementById('newCheckItem');
    if (refreshed) refreshed.dataset.busy = '';
  }
}

  const response = await api('PUT','/events/'+eventId+'/checklist/'+itemId,{done});
  const normalized = normalizeChecklistMutationResponse(eventId, response, { id: itemId, eventId, done });
  const items = patchChecklistItemLocal(eventId, normalized.item);

function updateRepeatEndBounds() {
  const startDate = document.getElementById('evDate')?.value;
  const repeatEnd = document.getElementById('evRepeatEnd');

  const maxDate = new Date(`${startDate}T00:00:00Z`);

  repeatEnd.min = startDate;
  repeatEnd.max = maxDate.toISOString().slice(0, 10);
  if (repeatEnd.value && (repeatEnd.value < repeatEnd.min || repeatEnd.value > repeatEnd.max)) {
    repeatEnd.value = '';
  }
}

async function saveNewEvent() {
  dlog('saveNewEvent start');
  const title=document.getElementById('evTitle').value.trim();
  const date=document.getElementById('evDate').value;
  if(!title||!date) return alert('제목과 날짜 필수');
  const reminder = getValidatedEventReminderValue();
  if (reminder === undefined) return;
  if (isExternalCalendarOnlyUser() && evScope === 'team') return alert('외부 캘린더 계정은 본인 일정만 등록할 수 있습니다.');
  const shareWith = evScope === 'team' ? Array.from(document.querySelectorAll('.share-check:checked')).map(el=>el.value) : [];
  const repeatType = document.getElementById('evRepeat').value || null;
  const repeatEnd = document.getElementById('evRepeatEnd')?.value || null;
  if (repeatType && !repeatEnd) return alert('반복 종료일을 선택해주세요.');
  const newEvent = normalizeCreatedTodoEventRecord(await api('POST','/events',{
    type:selType, title, date,
    endDate:document.getElementById('evEndDate')?.value||null,
    time:document.getElementById('evTime').value,
    memo:document.getElementById('evMemo').value.trim(),
    todoCat:selType==='todo'?selCat:null,
    reminder,
    scope:evScope,
    repeatType,
    repeatEnd,
    shareWith,
    checklist: pendingChecklist
  }), { scope: evScope, ownerId: currentUser?.uid });
  const createdChecklistCount = pendingChecklist.length;
  pendingChecklist = [];
  if (repeatType) {
    // Paint the UI with the locally known representative event first so the
    // modal-close transition doesn't reveal a blank calendar, then reconcile
    // with the full server-generated set.
    upsertLocalEvent(newEvent);
    setChecklistSummaryLocal(newEvent.id, createdChecklistCount, 0);
    refreshCalendarUi({ keepScroll: true });
    closeModal();
    await fetchEvents();
    refreshCalendarUi({ keepScroll: true });
    return;
  }
  upsertLocalEvent(newEvent);
  setChecklistSummaryLocal(newEvent.id, createdChecklistCount, 0);
  // Refresh the calendar *while the modal is still covering it* so the
  // user doesn't see the grid flicker as the modal fades out.
  refreshCalendarUi({ keepScroll: true });
  closeModal();
}

async function deleteReportFieldInline(fieldId, btn) {
  if (!confirm('이 항목을 삭제할까요?')) return;
  if (!currentTemplate) return;
  await api('DELETE','/report-templates/'+currentTemplate.id+'/fields/'+fieldId);
  // UI에서 바로 제거
  const formGroup = btn.closest('.form-group');
  if (formGroup) formGroup.remove();
  reportFields = reportFields.filter(f => f.id !== fieldId);
}

async function addReportFieldQuick() {
  const el = document.getElementById('quickAddField');
  const name = el?.value?.trim();
  if (!name) return alert('상품명을 입력하세요');
  if (!currentTemplate) return;
  const btn = el.nextElementSibling;
  if (btn) btn.disabled = true;
  try {
    const newField = await api('POST','/report-templates/'+currentTemplate.id+'/fields',{
      fieldName: name, fieldType: 'number', fieldGroup: '매출', isAmount: true
    });
    el.value = '';
    // addFieldArea 바로 앞에 입력칸 추가
    const area = document.getElementById('addFieldArea');
    const newDiv = document.createElement('div');
    newDiv.className = 'form-group';
    newDiv.style.marginBottom = '8px';
    newDiv.innerHTML = `<label class="form-label" style="font-size:11px">${esc(name)} (원)</label>
      ${reportFieldInputHtml(newField)}`;
    area.parentElement.insertBefore(newDiv, area);
    reportFields.push(newField);
    // 새 입력칸에 포커스
    const newInput = document.getElementById('rf_'+newField.id);
    if (newInput) newInput.focus();
  } catch(e) { alert('추가 실패: '+e.message); }
  if (btn) btn.disabled = false;
}

async function submitReport() {
  const date = document.getElementById('rptDate').value;
  if(!date) return alert('날짜 선택');
  const entries = reportFields.map(f => ({fieldId:f.id, value:getReportFieldSubmitValue(f)}));
  await api('POST','/reports',{templateId:currentTemplate.id,reportDate:date,entries});
  closeModal(); alert('제출 완료!'); renderPage(true);
}

async function viewReport(id) {
  const reports = await api('GET','/reports');
  const report = reports.find(r=>r.id===id);
  const entries = await api('GET','/reports/'+id+'/entries');
  const canEdit = report && (report.author_id === currentUser.uid || isAdmin);
  let lastGroup = null, total = 0;
  let h = `<div class="modal-title">📄 ${report?esc(report.author_name)+' ':''}보고서 상세</div>
    <div style="font-size:12px;color:var(--text3);margin-bottom:12px">${report?report.report_date:''}</div>`;
  entries.forEach(e => {
    if(e.field_group && e.field_group !== lastGroup) {
      h += `<div style="font-size:12px;font-weight:700;color:var(--text3);margin:12px 0 6px;border-top:1px solid var(--border);padding-top:8px">${esc(e.field_group)}</div>`;
      lastGroup = e.field_group;

  h += `<button class="btn btn-dark" onclick="closeModal()" style="width:100%;margin-top:8px">닫기</button>`;

async function editReport(id) {
  const reports = await api('GET','/reports');
  const report = reports.find(r=>r.id===id);
  if (!report) return;
  const entries = await api('GET','/reports/'+id+'/entries');
  reportFields = await api('GET','/report-templates/'+report.template_id+'/fields');

  let lastGroup = null;
  let h = `<div class="modal-title">✏️ 보고서 수정</div>
    <div style="font-size:12px;color:var(--text3);margin-bottom:12px">${esc(report.author_name)}</div>
    <div class="form-group"><label class="form-label">날짜</label><input class="form-input" type="date" id="editRptDate" value="${esc(report.report_date)}"></div>`;

  reportFields.forEach(f => {
    if(f.field_group && f.field_group !== lastGroup) {
      h += `<div style="font-size:12px;font-weight:700;color:var(--text3);margin:12px 0 6px;padding-top:8px;border-top:1px solid var(--border)">${esc(f.field_group)}</div>`;
      lastGroup = f.field_group;
    }

    h += `<div class="form-group" style="margin-bottom:8px"><label class="form-label" style="font-size:11px">${esc(f.field_name)}${f.is_amount?' (원)':''}</label>

    <button class="btn btn-red" onclick="saveEditReport('${report.id}','${report.template_id}')" style="flex:1">저장</button></div>`;
  openModal(h);
}

async function saveEditReport(reportId, templateId) {
  const reportDate = document.getElementById('editRptDate')?.value;
  if(!reportDate) return alert('날짜 선택');
  const fields = await api('GET','/report-templates/'+templateId+'/fields');
  const entries = fields.map(f => ({fieldId:f.id, value:getReportFieldSubmitValue(f)}));
  try {
    await api('PUT','/reports/'+reportId,{reportDate, entries});
    closeModal(); alert('수정 완료!'); renderPage(true);
  } catch(e) {
    alert('수정 실패: ' + e.message);
  }
}

async function checkAllRoomsUnread(options = {}) {
  const suppressAlerts = !!options.suppressAlerts || Date.now() < suppressChatAlertsUntil;
  try {
    const counts = await api('GET','/chat-rooms/unread');
    chatUnreadCounts = counts && typeof counts === 'object' ? counts : {};
    if (options.renderList) maybeRenderVisibleChatRoomList();
    let totalUnread = 0;
    for(const [rid,c] of Object.entries(counts)) { totalUnread += c; }
    // Sidebar badge
    const sb = document.getElementById('sidebarChatBadge');
    if(sb) { if(totalUnread>0){sb.textContent=totalUnread;sb.style.display='';} else sb.style.display='none'; }
    // Mobile badge
    const mb = document.getElementById('mobChatBadge');
    if(mb) { if(totalUnread>0){mb.textContent=totalUnread;mb.style.display='';} else mb.style.display='none'; }
    // Notification for new messages
    for(const [rid,c] of Object.entries(counts)) {
      if(!suppressAlerts && c>(prevUnreadCounts[rid]||0) && rid!==currentRoomId) {
        if(getNotificationPrefs().notifyChat) {
          const tag = 'chat-room-' + rid;
          const signalKey = `${tag}:${c}`;
          // 현재 기기 FCM이 없을 때만 폴링 기반 시스템 알림을 폴백으로 사용
          if('Notification' in window && Notification.permission==='granted' && !currentDevicePushReady && (!document.hasFocus() || document.hidden) && !wasNotificationSignalRecent(signalKey)) {
            rememberNotificationSignal(tag, 20000);
            rememberNotificationSignal(signalKey, 20000);
            await showSystemNotification('피크마케팅 - 새 메시지', {
              body: c+'개의 읽지 않은 메시지',
              icon: '/favicon.svg',
              tag,
              renotify: true,
              url: `/?page=chat&roomId=${encodeURIComponent(rid)}`
            });
          }
        }
        if (getNotificationPrefs().notifyChat && !document.hidden && document.hasFocus()) playNotifSound();
      }
    }
    prevUnreadCounts = counts;
  } catch(e) {}
}

function playNotifSound() {
  try {
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.connect(g);g.connect(ctx.destination);o.frequency.value=880;o.type='sine';g.gain.value=0.15;
    o.start();g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.12);o.stop(ctx.currentTime+0.12);
  } catch(e){}
}

      </div>`;
    groupUsers.forEach(u => {
      const roleLabel = u.role === 'admin' ? '👑 관리자' : u.role === 'manager' ? '⭐ 팀장' : '팀원';
      const roleColor = u.role === 'admin' ? 'var(--red)' : u.role === 'manager' ? 'var(--yellow)' : 'var(--text3)';
      h += `<div style="display:flex;align-items:center;gap:8px;padding:6px 0;font-size:13px;border-bottom:1px solid var(--bg4)">
        <span style="flex:1">${esc(u.name||u.email)}</span>

        ${u.role !== 'admin' ? `<select onchange="changeRole('${u.uid}',this.value)" style="background:var(--bg3);color:var(--text);border:1px solid var(--border);border-radius:4px;font-size:10px;padding:2px 4px">

        </select>` : ''}

        ${u.role!=='admin'?`<button onclick="deactivateUser('${u.uid}','${esc(u.name)}')" style="background:none;border:1px solid var(--red);border-radius:4px;cursor:pointer;font-size:9px;padding:2px 6px;color:var(--red)" title="비활성화">🚫</button>`:''}
      </div>`;
    });
    if (!groupUsers.length) h += `<div style="font-size:12px;color:var(--text3);padding:4px 0">멤버 없음</div>`;
    h += '</div>';
  });

  // 미배정 팀원
  const unassigned = activeUsers.filter(u => !u.group_id);
  if (unassigned.length) {
    h += `<div style="font-size:13px;font-weight:600;color:var(--yellow);margin-bottom:6px;padding-bottom:4px;border-bottom:1px solid var(--border)">미배정 (${unassigned.length}명)</div>`;
    unassigned.forEach(u => {
      h += `<div style="display:flex;align-items:center;gap:6px;padding:5px 0;font-size:13px">
        <span style="flex:1">${esc(u.name||u.email)}</span>
        ${groups.map(g => `<button onclick="assignGroup('${u.uid}','${g.id}')" style="padding:3px 8px;border-radius:6px;border:1px solid var(--border);background:var(--bg3);color:var(--text2);font-size:10px;cursor:pointer">${esc(g.name)}</button>`).join('')}
      </div>`;
    });
  }

  // 팀원 그룹 변경
  h += `<div style="font-size:13px;font-weight:700;color:var(--text2);margin:20px 0 8px">🔄 그룹 변경</div>`;
  activeUsers.filter(u => u.group_id).forEach(u => {
    const curGroup = groups.find(g => g.id === u.group_id);
    h += `<div style="display:flex;align-items:center;gap:6px;padding:5px 0;font-size:13px">
      <span style="flex:1">${esc(u.name||u.email)}</span>
      <span style="font-size:11px;color:var(--text3)">${esc(curGroup?.name||'')}</span>
      <span style="color:var(--text3)">→</span>
      ${groups.filter(g=>g.id!==u.group_id).map(g => `<button onclick="assignGroup('${u.uid}','${g.id}')" style="padding:3px 8px;border-radius:6px;border:1px solid var(--border);background:var(--bg3);color:var(--text2);font-size:10px;cursor:pointer">${esc(g.name)}</button>`).join('')}
    </div>`;
  });

  // 그룹 추가
  h += `<div style="margin-top:20px;padding-top:12px;border-top:1px solid var(--border)">
    <button onclick="addGroupPrompt()" class="btn btn-dark" style="width:100%">+ 새 그룹 추가</button>
  </div>`;

  // 비활성 유저
  const inactive = users.filter(u => u.is_active === false);
  if (inactive.length) {
    h += `<div style="font-size:13px;font-weight:700;color:var(--red);margin:20px 0 8px">🚫 비활성화된 직원 (${inactive.length}명)</div>`;
    inactive.forEach(u => {
      h += `<div style="display:flex;align-items:center;gap:8px;padding:6px 0;font-size:13px;border-bottom:1px solid var(--bg4);opacity:0.6">
        <span style="flex:1">${esc(u.name||u.email)}</span>
        <button onclick="activateUser('${u.uid}','${esc(u.name)}')" style="padding:3px 8px;border-radius:4px;border:1px solid var(--green);background:transparent;color:var(--green);font-size:10px;cursor:pointer">활성화</button>
      </div>`;
    });
  }

  h += `<button class="btn btn-dark" onclick="closeModal()" style="width:100%;margin-top:12px">닫기</button>`;
  openModal(h);
}
